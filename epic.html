<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: a drafting table. Intake band on top, results beside a coach rail below.
   Stories are blue (value), WBS is teal (deliverables); status colors stay separate. */
:root {
  --bg: #EDF0F5;
  --surface: #FFFFFF;
  --surface-2: #F5F7FA;
  --ink: #111C2B;
  --ink-2: #4B596C;
  --line: #D3DBE6;
  --line-strong: #AAB6C6;
  --story: #3147D9;
  --story-tint: #E7EAFB;
  --wbs: #0A6770;
  --wbs-tint: #DDF1F2;
  --ok: #27702B;
  --ok-tint: #E3F3E4;
  --warn: #8F5F00;
  --warn-tint: #FBEFCF;
  --bad: #B3261E;
  --bad-tint: #FBE3E1;
  --focus: #3147D9;
  --font-display: "Unbounded", "IBM Plex Sans", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D131D;
    --surface: #151D2B;
    --surface-2: #1B2536;
    --ink: #E7EDF6;
    --ink-2: #9DABC0;
    --line: #2A3850;
    --line-strong: #46587A;
    --story: #93A2FF;
    --story-tint: #222B52;
    --wbs: #55CBD4;
    --wbs-tint: #153A40;
    --ok: #79D07F;
    --ok-tint: #17331A;
    --warn: #F2C14E;
    --warn-tint: #3A2D0E;
    --bad: #FF8A85;
    --bad-tint: #3E1816;
    --focus: #93A2FF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D131D;
  --surface: #151D2B;
  --surface-2: #1B2536;
  --ink: #E7EDF6;
  --ink-2: #9DABC0;
  --line: #2A3850;
  --line-strong: #46587A;
  --story: #93A2FF;
  --story-tint: #222B52;
  --wbs: #55CBD4;
  --wbs-tint: #153A40;
  --ok: #79D07F;
  --ok-tint: #17331A;
  --warn: #F2C14E;
  --warn-tint: #3A2D0E;
  --bad: #FF8A85;
  --bad-tint: #3E1816;
  --focus: #93A2FF;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.5;
  padding-inline: 16px;
  padding-block: 0 48px;
}
.wrap { max-width: 1280px; margin-inline: auto; }
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.num, .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* Header with a ruler along its lower edge */
.top {
  display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between;
  padding-block: 20px 14px;
  border-bottom: 1px solid var(--line-strong);
  position: relative;
}
.top::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -9px; height: 8px;
  background:
    repeating-linear-gradient(90deg, var(--line-strong) 0 1px, transparent 1px 48px),
    repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 12px);
  background-size: 100% 8px, 100% 4px;
  background-repeat: no-repeat;
  background-position: 0 0, 0 0;
  pointer-events: none;
}
.brand { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.brand h1 { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: -0.01em; }
.brand p { color: var(--ink-2); max-width: 60ch; }
.top-tools { display: flex; gap: 8px; align-items: center; }

/* Buttons and controls */
.btn {
  appearance: none; cursor: pointer; border: 1px solid var(--line-strong); background: var(--surface);
  border-radius: 4px; padding: 7px 12px; font-weight: 500; line-height: 1.2;
}
.btn:hover { background: var(--surface-2); }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
.btn-primary { background: var(--story); border-color: var(--story); color: #fff; }
.btn-primary:hover { background: var(--story); filter: brightness(1.08); }
:root[data-theme="dark"] .btn-primary { color: #0D131D; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn-primary { color: #0D131D; } }
.btn-small { padding: 4px 9px; font-size: 12.5px; }
.btn-ghost { background: transparent; border-color: transparent; color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 4px; overflow: hidden; background: var(--surface); }
.seg button {
  appearance: none; border: 0; background: transparent; cursor: pointer; padding: 7px 14px; font-weight: 500;
  border-right: 1px solid var(--line);
}
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg button[data-m="stories"][aria-pressed="true"] { background: var(--story); color: #fff; }
.seg button[data-m="wbs"][aria-pressed="true"] { background: var(--wbs); color: #fff; }
:root[data-theme="dark"] .seg button[aria-pressed="true"] { color: #0D131D; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seg button[aria-pressed="true"] { color: #0D131D; } }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label, .lbl { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
textarea, input[type="text"], input[type="number"], select {
  width: 100%; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 4px; padding: 8px 10px;
}
textarea { resize: vertical; min-height: 112px; line-height: 1.5; }

/* Intake */
.intake { display: grid; gap: 16px; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); padding-block: 26px 18px; align-items: start; }
.intake-side { display: flex; flex-direction: column; gap: 12px; }
.samples { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.samples .lbl { margin-right: 4px; }
.chipbtn {
  appearance: none; cursor: pointer; border: 1px solid var(--line-strong); background: var(--surface);
  border-radius: 999px; padding: 3px 11px; font-size: 12.5px;
}
.chipbtn:hover { background: var(--surface-2); }
.chipbtn[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.hint { color: var(--ink-2); font-size: 12.5px; }
.status-line { min-height: 20px; font-size: 13px; }
.status-line.err { color: var(--bad); }
.status-line.busy { color: var(--ink-2); }
.under-hood { margin-top: 2px; }
.under-hood summary { cursor: pointer; color: var(--ink-2); font-size: 12.5px; }
.under-hood pre {
  margin: 8px 0 0; padding: 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px;
  max-height: 240px; overflow: auto; font-family: var(--font-mono); font-size: 11.5px; white-space: pre-wrap; overflow-wrap: anywhere;
}

/* Workspace */
.workspace { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 1100px) { .workspace { grid-template-columns: minmax(0, 1fr) 380px; } }
.results { container-type: inline-size; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; justify-content: space-between; }
.toolbar-r { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.summary {
  display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline; padding: 10px 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 4px;
}
.summary h2 { font-family: var(--font-display); font-weight: 500; font-size: 15px; flex: 1 1 280px; min-width: 0; overflow-wrap: anywhere; }
.summary .m { color: var(--ink-2); font-size: 12.5px; }
.summary .m b { color: var(--ink); font-family: var(--font-mono); font-weight: 500; }
.badge {
  display: inline-block; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; font-weight: 600;
  padding: 2px 7px; border: 1px solid var(--line-strong); border-radius: 3px; color: var(--ink-2);
}
.badge.live { color: var(--story); border-color: var(--story); }
.badge.stale { color: var(--warn); border-color: var(--warn); background: var(--warn-tint); }

.panes { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@container (min-width: 780px) { .panes.two { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); } }
.pane { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.pane-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding-bottom: 6px; border-bottom: 2px solid var(--story); }
.pane.wbs .pane-head { border-bottom-color: var(--wbs); }
.pane-head h3 { font-family: var(--font-display); font-weight: 500; font-size: 14px; }
.pane-head span { color: var(--ink-2); font-size: 12.5px; }

/* Story cards */
.story { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 12px; display: flex; flex-direction: column; gap: 9px; min-width: 0; }
.story.hl, .node.hl > summary, .node.hl > .leaf { box-shadow: 0 0 0 2px var(--story); }
.story.dim { opacity: .55; }
.story-top { display: flex; gap: 10px; align-items: baseline; }
.sid { font-family: var(--font-mono); font-weight: 500; color: var(--story); flex: none; }
.story-title { flex: 1; min-width: 0; margin: 0; font-weight: 500; font-size: 14.5px; line-height: 1.4; overflow-wrap: anywhere; }
.story-btn { display: block; width: 100%; appearance: none; background: none; border: 0; padding: 0; margin: 0; text-align: left; font: inherit; color: inherit; cursor: pointer; overflow-wrap: anywhere; }
.story-btn:hover { text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
.pts { flex: none; font-family: var(--font-mono); font-size: 12.5px; border: 1px solid var(--line-strong); border-radius: 3px; padding: 1px 6px; }
.pts.big { border-color: var(--bad); color: var(--bad); background: var(--bad-tint); }
.meta { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.chip { font-size: 12px; padding: 1px 8px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); }
.chip.st-ok { background: var(--ok-tint); color: var(--ok); border-color: var(--ok); }
.chip.st-warn { background: var(--warn-tint); color: var(--warn); border-color: var(--warn); }
.chip.st-bad { background: var(--bad-tint); color: var(--bad); border-color: var(--bad); }
.invest { display: inline-flex; gap: 3px; }
.iv {
  width: 22px; height: 22px; display: grid; place-items: center; font-family: var(--font-mono); font-size: 11.5px; font-weight: 500;
  border-radius: 3px; border: 1px solid var(--line-strong); color: var(--ink-2); position: relative;
}
.iv.ok { background: var(--ok-tint); color: var(--ok); border-color: var(--ok); }
.iv.warn { background: var(--warn-tint); color: var(--warn); border-color: var(--warn); }
.iv.warn::after, .iv.bad::after { content: ""; position: absolute; right: -2px; top: -2px; width: 6px; height: 6px; background: currentColor; }
.iv.warn::after { border-radius: 50%; }
.iv.bad { background: var(--bad-tint); color: var(--bad); border-color: var(--bad); }
.why { font-size: 12.5px; color: var(--ink-2); }
.crit summary { cursor: pointer; font-size: 12.5px; color: var(--ink-2); }
.crit ul { margin: 6px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 5px; }
.crit li { font-size: 13px; }
.kw { font-weight: 600; color: var(--story); }
.story-foot { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; justify-content: space-between; }
.codes { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.code { font-family: var(--font-mono); font-size: 11.5px; padding: 0 6px; border-radius: 3px; background: var(--wbs-tint); color: var(--wbs); border: 1px solid var(--wbs); }
.stack { display: flex; flex-direction: column; gap: 10px; }

/* WBS tree */
.tree { display: flex; flex-direction: column; gap: 8px; }
.node { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; }
.node > summary, .leaf { list-style: none; display: flex; gap: 10px; align-items: baseline; padding: 8px 10px; cursor: pointer; min-width: 0; }
.leaf { cursor: default; }
.node > summary::-webkit-details-marker { display: none; }
.node > summary::before { content: "+"; font-family: var(--font-mono); color: var(--wbs); width: 10px; flex: none; }
.node[open] > summary::before { content: "−"; }
.ncode { font-family: var(--font-mono); font-weight: 500; color: var(--wbs); flex: none; min-width: 28px; }
.nname { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.node.l1 > summary .nname { font-weight: 600; }
.nkids { padding: 0 10px 10px 22px; display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--line); padding-top: 8px; }
.nkids .node, .nkids .leafbox { background: var(--surface-2); }
.leafbox { border: 1px solid var(--line); border-radius: 4px; }
.sid-chip { font-family: var(--font-mono); font-size: 11.5px; padding: 0 6px; border-radius: 3px; background: var(--story-tint); color: var(--story); border: 1px solid var(--story); }
.orphan { font-size: 11.5px; color: var(--warn); border: 1px dashed var(--warn); background: var(--warn-tint); border-radius: 3px; padding: 0 6px; }
.leaf-links { display: flex; flex-wrap: wrap; gap: 5px; flex: none; }

/* Coach */
.coach { background: var(--surface); border: 1px solid var(--line-strong); border-radius: 4px; display: flex; flex-direction: column; min-width: 0; }
@media (min-width: 1100px) { .coach { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; } }
.coach-head { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.coach-head h3 { font-family: var(--font-display); font-weight: 500; font-size: 15px; }
.ready-bar { display: flex; height: 8px; border-radius: 2px; overflow: hidden; background: var(--line); }
.ready-bar i { display: block; height: 100%; }
.ready-bar .r-ok { background: var(--ok); }
.ready-bar .r-warn { background: var(--warn); }
.ready-bar .r-bad { background: var(--bad); }
.ready-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--ink-2); }
.coach-sec { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.coach-sec:last-child { border-bottom: 0; }
.coach-sec > h4 { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
.obs { display: flex; flex-direction: column; gap: 3px; }
.obs-head { display: flex; gap: 8px; align-items: baseline; }
.obs-tag { flex: none; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 0 6px; border-radius: 3px; border: 1px solid; }
.obs-tag.bad { color: var(--bad); background: var(--bad-tint); }
.obs-tag.warn { color: var(--warn); background: var(--warn-tint); }
.obs-tag.good { color: var(--ok); background: var(--ok-tint); }
.obs-tag.info { color: var(--ink-2); background: var(--surface-2); }
.obs-title { font-weight: 600; }
.obs p { color: var(--ink); }
.obs .q { color: var(--ink-2); font-style: italic; }
.note { display: flex; flex-direction: column; gap: 3px; padding: 9px 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; }
.note h5 { margin: 0; font-size: 13px; font-weight: 600; }
.note .src { font-size: 12px; color: var(--ink-2); }
.note p { font-size: 13px; }
.note .why-found { font-family: var(--font-mono); font-size: 11px; color: var(--ink-2); }
.note.mine { border-color: var(--story); }
.reflect { white-space: pre-wrap; overflow-wrap: anywhere; padding: 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; min-height: 40px; }
.addnote { display: flex; flex-direction: column; gap: 8px; }
.addnote summary { cursor: pointer; font-weight: 500; }
.addnote .field { margin-top: 8px; }
.empty { padding: 28px 16px; text-align: center; color: var(--ink-2); border: 1px dashed var(--line-strong); border-radius: 4px; }
.err-line { color: var(--bad); font-size: 12.5px; min-height: 18px; margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 760px) {
  .intake { grid-template-columns: minmax(0, 1fr); }
  .brand h1 { font-size: 19px; }
  .story-top { flex-wrap: wrap; }
}
@media (prefers-reduced-motion: no-preference) {
  .story, .node, .btn, .chipbtn { transition: box-shadow .12s ease, opacity .12s ease, background-color .12s ease; }
}
</style>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Нарезка эпика</h1>
      <p data-ru="Один эпик, две проекции: пользовательские истории по ценности и WBS по результатам. Коуч сверяет итог с вашей библиотекой." data-en="One epic, two projections: user stories by value and a WBS by deliverable. The coach checks the outcome against your library."></p>
    </div>
    <div class="top-tools">
      <div class="seg" role="group" aria-label="Language">
        <button type="button" data-lang="ru" aria-pressed="true">RU</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </header>

  <section class="intake" aria-labelledby="intake-h">
    <div class="field">
      <label id="intake-h" for="epic" data-ru="Эпик или цель проекта" data-en="Epic or project goal"></label>
      <textarea id="epic" rows="5"></textarea>
      <div class="samples" id="samples"></div>
    </div>
    <div class="intake-side">
      <div class="field">
        <label for="ctx" data-ru="Контекст" data-en="Context"></label>
        <input type="text" id="ctx" data-ph-ru="Продукт, команда, длина спринта, ограничения" data-ph-en="Product, team, sprint length, constraints">
      </div>
      <div class="field">
        <label for="lens" data-ru="Метод нарезки историй" data-en="Story splitting method"></label>
        <select id="lens"></select>
      </div>
      <div class="field">
        <label for="bigat" data-ru="Порог «слишком крупная», баллов" data-en="“Too big” threshold, points"></label>
        <input type="number" id="bigat" min="2" max="100" step="1" value="13">
        <span class="hint" data-ru="По шкале Кона истории для ближайших итераций оценивают в 1–8, а 13 и больше — эпики. Баллы относительны: настройте порог по скорости команды." data-en="On Cohn's scale near-term stories are 1–8 and 13 or more are epics. Points are relative: adjust the threshold to your team's velocity."></span>
      </div>
      <div class="actions">
        <button type="button" class="btn btn-primary" id="run"></button>
        <button type="button" class="btn" id="cancel" hidden data-ru="Остановить" data-en="Stop"></button>
      </div>
      <div class="status-line" id="status" role="status" aria-live="polite"></div>
    </div>
  </section>

  <section class="workspace">
    <div class="results" id="results">
      <div class="toolbar">
        <div class="seg" role="group" id="modes" aria-label="View"></div>
        <div class="toolbar-r">
          <button type="button" class="btn btn-small" id="copy-wbs"></button>
          <button type="button" class="btn btn-small" id="dl-csv"></button>
        </div>
      </div>
      <div class="summary" id="summary"></div>
      <div class="panes" id="panes"></div>
      <details class="under-hood">
        <summary data-ru="Что под капотом: промпт, который строит разбор" data-en="Under the hood: the prompt that builds the breakdown"></summary>
        <pre id="prompt-view"></pre>
      </details>
    </div>

    <aside class="coach" id="coach" aria-label="Coach"></aside>
  </section>
</div>
<script>

    title: { ru: 'Роль в истории, один пользователь, действительный залог', en: 'Name the role, write for one user, use active voice' },
    text: { ru: 'Если роли выявлены, их используют: не «пользователь», а «соискатель». Это держит перед глазами разработчика реального человека. Пишите для одного пользователя: «Соискатели могут удалять резюме» можно понять так, что один соискатель удаляет чужие резюме, а «Соискатель может удалять свои резюме» таких вопросов не оставляет. Действительный залог читается легче. Шаблон Connextra «я как (роль) хочу (функция), чтобы (ценность)» Кон предлагает как вариант, который стоит попробовать, а не как обязательную форму.',
            en: 'If roles have been identified, use them: not "a user" but "a Job Seeker". It keeps a real person in the developer\'s mind. Write for one user: "Job Seekers can remove resumes" can be read as one seeker removing others\' resumes, while "A Job Seeker can remove her own resumes" leaves no doubt. Active voice reads more easily. The Connextra template "I as a (role) want (function) so that (business value)" is offered by Cohn as something to experiment with, not a required form.' } },
  { id: 'horizon', tags: ['horizon', 'big', 'split', 'scrum', 'ready'],
    src: { ru: `${USA}, гл. 7, с. 78–79 («Size the Story to the Horizon»); ${AEP}, гл. 6, с. 53–54`, en: `${USA_EN}, ch. 7, pp. 78–79 ("Size the Story to the Horizon"); ${AEP_EN}, ch. 6, pp. 53–54` },
    title: { ru: 'Размер истории зависит от горизонта планирования', en: 'Story size depends on the planning horizon' },
    text: { ru: 'Истории для ближайших итераций пишут такого размера, чтобы их можно было запланировать, а далёкие могут быть крупными и неточными. Кон разворачивает только «Соискатель может разместить резюме», а остальные три крупные истории оставляет как есть. В AEP добавлено: для ближайших итераций оценки 1, 2, 3, 5, 8, а для далёкой работы допустимы эпики и темы с оценками 13, 20, 40, 100. Поэтому приложение, нарезающее весь эпик сразу, показывает уровень детализации, который по Кону для далёкой работы избыточен.',
            en: 'Stories for the next iterations are written at a size that can be planned; distant ones may stay large and imprecise. Cohn expands only "A Job Seeker can post a resume" and leaves the other three big stories alone. AEP adds: near-term stories are estimated 1, 2, 3, 5, 8, while distant work may stay as epics and themes estimated 13, 20, 40, 100. So an app that splits a whole epic up front shows more detail than Cohn would want for distant work.' } },
  { id: 'small', tags: ['small', 'batch', 'tiny', 'split', 'size', 'dependencies', 'deps'],
    src: { ru: `${USA}, гл. 2, с. 23–27; гл. 14, с. 157; ${AEP}, гл. 12, с. 126`, en: `${USA_EN}, ch. 2, pp. 23–27; ch. 14, p. 157; ${AEP_EN}, ch. 12, p. 126` },
    title: { ru: 'Слишком крупные и слишком мелкие истории', en: 'Stories too big and stories too small' },
    text: { ru: 'У размера две стороны. Слишком мелкие истории (признак — частый пересмотр оценок, например «сохранить результаты в XML» и «в HTML») объединяют для планирования и режут, когда они попадают в итерацию. Кон говорит о половине дня и нескольких днях; в AEP для двухнедельных итераций ориентир 2–5 дней на историю. Окончательно размер определяют команда, её навыки и технологии.',
            en: 'Size has two sides. Stories that are too small (a symptom is frequent revision of estimates, such as "save results to XML" and "to HTML") are combined for planning and split when they reach an iteration. Cohn speaks of half a day to several days; AEP gives 2-5 days per story for two-week iterations as a guide. The final call depends on the team, its skills and its technologies.' } },
  { id: 'compound', tags: ['split', 'big', 'patterns', 'operations', 'data', 'rules', 'workflow', 'crud'],
    src: { ru: `${USA}, гл. 2, с. 24–26; ${AEP}, гл. 12, с. 120–125`, en: `${USA_EN}, ch. 2, pp. 24-26; ${AEP_EN}, ch. 12, pp. 120-125` },
    title: { ru: 'Составная и сложная история: чем резать', en: 'Compound and complex stories: how to cut' },
    text: { ru: 'Составную историю (в ней несколько историй) режут по операциям (создать, изменить, удалить) или по границам данных. Сложную (она неопределённа по сути) делят на исследование с ограничением по времени и саму разработку. В AEP, гл. 12, перечень приёмов шире: данные, операции (CRUD), сквозные аспекты (безопасность, логирование, ошибки), производительность как отдельная история, истории разного приоритета. Правило AEP: историю не делят на задачи.',
            en: 'A compound story (several stories in one) is cut by operations (create, edit, delete) or along data boundaries. A complex story (inherently uncertain) is split into a timeboxed investigation and the build itself. AEP ch. 12 has a wider list: data, operations (CRUD), cross-cutting concerns (security, logging, errors), performance as a separate story, stories of different priority. AEP\'s rule: do not split a story into tasks.' } },
  { id: 'smells', tags: ['dependencies', 'deps', 'small', 'split', 'batch', 'prioritize', 'smells'],
    src: { ru: `${USA}, гл. 14, с. 157–162 («A Catalog of Story Smells»)`, en: `${USA_EN}, ch. 14, pp. 157-162 ("A Catalog of Story Smells")` },
    title: { ru: 'Запахи историй: зависимости, мелкость, частая нарезка', en: 'Story smells: dependencies, tiny stories, constant splitting' },
    text: { ru: 'В каталоге девять запахов; по теме разбора важны три. Взаимозависимые истории (одну можно взять только вместе с другой) возникают, когда истории слишком мелкие или нарезаны неудачно: объедините их или нарежьте сквозными срезами. Слишком мелкие истории дают частый пересмотр оценок. Нарезка при планировании итерации сама по себе нормальна, но если она нужна постоянно, значит, истории стоит перепроверить заранее. Ещё запах: заказчику трудно расставить приоритеты, когда истории крупные или не выражают пользы.',
            en: 'The catalog lists nine smells; three matter here. Interdependent stories (one can be taken only with another) arise when stories are too small or poorly sliced: combine them or cut vertical slices. Too-small stories cause frequent revision of estimates. Splitting at iteration planning is normal in itself, but if it is needed constantly, review the stories ahead of time. Also: the customer struggles to prioritize when stories are big or do not express benefit.' } },
  { id: 'tests', tags: ['criteria', 'testable', 'confirmation', 'tests', 'gwt'],
    src: { ru: `${USA}, гл. 6, с. 67–73; гл. 2, с. 27 («Testable»); формат «Дано, Когда, Тогда» — Дэн Норт (BDD), не Кон`, en: `${USA_EN}, ch. 6, pp. 67-73; ch. 2, p. 27 ("Testable"); Given/When/Then is Dan North (BDD), not Cohn` },
    title: { ru: 'Приёмочные тесты: до кода, и определяет их заказчик', en: 'Acceptance tests: before the code, and the customer specifies them' },
    text: { ru: 'Кон: тесты записывают на обороте карточки по мере появления, а до начала программирования превращают в полноценные. Определяет их заказчик, ему помогают разработчики и тестировщики. Писать тесты стоит, пока они проясняют замысел истории; покрытие ради покрытия не цель. Формулировка «пользователю никогда не приходится долго ждать» нетестируема, а «новые экраны открываются за 2 секунды в 95% случаев» тестируема. Запись «Дано, Когда, Тогда» пришла из BDD и необязательна. Требование «не меньше двух критериев» в приложении моё эвристическое правило, а не правило Кона.',
            en: 'Cohn: tests are jotted on the back of the card as they come up, and turned into full tests before programming begins. The customer specifies them, helped by developers and testers. Keep writing tests while they clarify the intent of the story; coverage for its own sake is not the goal. "A user never waits long" is untestable, while "new screens appear within 2 seconds in 95% of cases" is testable. Given/When/Then comes from BDD and is optional. The app\'s "at least two criteria" check is my own heuristic, not Cohn\'s rule.' } },
  { id: 'cards', tags: ['conversation', 'criteria', 'negotiable', 'details', 'confirmation'],
    src: { ru: `Рон Джеффрис (карточка, разговор, подтверждение); ${USA}, гл. 1 и гл. 2, с. 18–20; гл. 14, с. 159 («Too Many Details»)`, en: `Ron Jeffries (card, conversation, confirmation); ${USA_EN}, ch. 1 and ch. 2, pp. 18-20; ch. 14, p. 159 ("Too Many Details")` },
    title: { ru: 'Карточка, разговор, подтверждение', en: 'Card, conversation, confirmation' },
    text: { ru: 'История состоит из короткой записи, разговора и подтверждения (тестов). Лишние подробности на карточке создают иллюзию точности и отменяют разговор. Уже согласованные детали переносят в тесты, а на лицевой стороне оставляют вопросы. Шутка Тома Поппендика, которую приводит Кон: «если места не хватило, возьмите карточку поменьше».',
            en: 'A story is a short written note, a conversation, and a confirmation (tests). Extra detail on the card creates a false sense of precision and replaces the conversation. Details already agreed go into tests, and questions stay on the front. Cohn quotes Tom Poppendieck: "if you run out of room, use a smaller card".' } },
  { id: 'estimable', tags: ['estimate', 'estimable', 'spike', 'uncertainty', 'timebox', 'research', 'invest'],
    src: { ru: `${USA}, гл. 2, с. 22–23 и с. 25–26 («Estimatable»)`, en: `${USA_EN}, ch. 2, pp. 22-23 and 25-26 ("Estimatable")` },
    title: { ru: 'Почему историю не получается оценить', en: 'Why a story cannot be estimated' },
    text: { ru: 'Три причины: нет знаний о предметной области, нет технических знаний, история слишком большая. В первом случае идут к заказчику, во втором отправляют разработчика на спайк (короткий эксперимент с ограничением по времени), в третьем нарезают. Спайк оценить можно, потому что его длительность задана заранее. Кон советует по возможности ставить спайк в одну итерацию, а саму разработку в следующие.',
            en: 'Three reasons: lack of domain knowledge, lack of technical knowledge, or the story is too big. In the first case go to the customer; in the second send a developer on a spike (a brief timeboxed experiment); in the third, split. A spike can be estimated because its length is set in advance. Cohn advises putting the spike in one iteration and the real work in later ones where possible.' } },
  { id: 'spike', tags: ['spike', 'uncertainty', 'timebox', 'research'],
    src: { ru: `Экстремальное программирование (спайк); ${USA}, гл. 2, с. 22, 25–26`, en: `Extreme Programming (the spike); ${USA_EN}, ch. 2, pp. 22, 25-26` },
    title: { ru: 'Спайк: исследование с ограничением по времени', en: 'Spike: timeboxed research' },
    text: { ru: 'Спайк отвечает на конкретный вопрос в заданное время. Кон требует всегда задавать ему лимит: даже если историю нельзя оценить, можно назначить максимум времени на обучение. Выгода от выделения спайка: заказчик расставляет приоритеты для исследования и для самой функции отдельно.',
            en: 'A spike answers one concrete question in a set time. Cohn requires always setting a limit: even when a story cannot be estimated, a maximum time for learning can be set. The benefit of separating the spike: the customer prioritizes the research and the feature separately.' } },
  { id: 'constraint', tags: ['constraint', 'nonfunctional', 'testable', 'criteria'],
    src: { ru: `${USA}, гл. 7, с. 77–78 («Put Constraints on Cards»); гл. 2, с. 27`, en: `${USA_EN}, ch. 7, pp. 77-78 ("Put Constraints on Cards"); ch. 2, p. 27` },
    title: { ru: 'Ограничения: карточка-напоминание и автоматический тест', en: 'Constraints: a reminder card and an automated test' },
    text: { ru: 'Требование, которое нужно соблюдать, а не реализовать («до 50 одновременных пользователей»), Кон предлагает помечать на карточке как «Constraint». Его не оценивают и не планируют в итерацию, но вешают на стену как напоминание и, где возможно, пишут автоматический тест. Нефункциональное требование без измеримого порога («система должна быть удобной») нетестируемо.',
            en: 'A requirement that must be obeyed rather than built ("up to 50 concurrent users") is marked on the card as a "Constraint". It is not estimated or scheduled into an iteration, but put on the wall as a reminder and, where possible, covered by an automated test. A nonfunctional requirement with no measurable threshold ("the system must be easy to use") is not testable.' } },
  { id: 'estimate', tags: ['estimate', 'size', 'points', 'team', 'velocity', 'big', 'scale'],
    src: { ru: `${USA}, гл. 8, с. 87–94; ${AEP}, гл. 6, с. 53–56`, en: `${USA_EN}, ch. 8, pp. 87-94; ${AEP_EN}, ch. 6, pp. 53-56` },
    title: { ru: 'Баллы: относительная оценка команды', en: 'Points: a relative team estimate' },
    text: { ru: 'Каждая команда определяет балл сама: идеальный день, сложность и т. п. Баллы одной команды не равны баллам другой. Оценку дают вместе те, кто будет делать работу, а заказчик отвечает на вопросы, но не оценивает. Допустимые значения заранее ограничивают шкалой: у Кона в «User Stories Applied» это ½, 1, 2, 3, 5, 8, 13, 20, 40, 80; в AEP 0, 1, 2, 3, 5, 8, 13, 20, 40, 100. Спор «7 или 8» создаёт ложную точность. Сумма оценок частей не обязана равняться оценке эпика. Оценки генератора в приложении стартовые.',
            en: 'Each team defines a point itself: an ideal day, complexity, and so on. One team\'s points do not equal another\'s. The people who will do the work estimate together; the customer answers questions but does not estimate. Allowed values are fixed in advance as a scale: in User Stories Applied it is ½, 1, 2, 3, 5, 8, 13, 20, 40, 80; in AEP 0, 1, 2, 3, 5, 8, 13, 20, 40, 100. Arguing "7 or 8" implies false precision. The estimates of the parts need not sum to the estimate of the epic. The generator\'s estimates in the app are only a start.' } },
  { id: 'spidr', tags: ['split', 'big', 'patterns', 'spike', 'rules', 'paths', 'interfaces', 'data'],
    src: { ru: 'Майк Кон, статья «SPIDR: Five Simple but Powerful Ways to Split User Stories» (Mountain Goat Software); в книгах 2004–2005 годов её нет', en: 'Mike Cohn, the article "SPIDR: Five Simple but Powerful Ways to Split User Stories" (Mountain Goat Software); not in the 2004-2005 books' },
    title: { ru: 'SPIDR: пять приёмов нарезки', en: 'SPIDR: five splitting techniques' },
    text: { ru: 'Спайк, путь (Path), интерфейсы, данные, правила. Автор пишет, что распечатал более тысячи историй, собранных за 15 лет, и сгруппировал их по способу нарезки. Спайк он называет важным приёмом, но обычно не первым.',
            en: 'Spike, Path, Interfaces, Data, Rules. The author writes that he printed over a thousand stories collected over 15 years and grouped them by how they were split. He calls the spike an essential technique, but normally not the first one to reach for.' } },
  { id: 'hw', tags: ['split', 'big', 'patterns', 'workflow', 'operations', 'rules', 'data'],
    src: { ru: 'Ричард Лоуренс и Питер Грин, Humanizing Work (не перечитывалось)', en: 'Richard Lawrence and Peter Green, Humanizing Work (not re-read)' },
    title: { ru: 'Девять паттернов нарезки: пробуйте по порядку', en: 'Nine splitting patterns: try them in order' },
    text: { ru: 'Шаги рабочего процесса, операции, варианты бизнес-правил, варианты данных, способы ввода данных, основной объём работы, простое и сложное, отложенная производительность, спайк. Сначала отрежьте самый тонкий сквозной путь.',
            en: 'Workflow steps, operations, business rule variations, data variations, data entry methods, major effort, simple and complex, deferred performance, spike. Cut the thinnest end-to-end path first.' } },
  { id: 'map', tags: ['map', 'backbone', 'releases', 'coverage', 'wbs', 'value'],
    src: { ru: 'Джефф Паттон, «User Story Mapping» (не перечитывалось)', en: 'Jeff Patton, User Story Mapping (not re-read)' },
    title: { ru: 'Карта историй: сначала путь пользователя', en: 'Story map: the user\'s journey first' },
    text: { ru: 'Расположите шаги пути пользователя по горизонтали, а варианты и детали под ними. Горизонтальная полоса через всю карту и есть релиз, который уже работает целиком.',
            en: 'Lay the user\'s steps out horizontally and put variations and details beneath. A horizontal band across the whole map is a release that already works end to end.' } },
  { id: 'wbs100', tags: ['wbs', 'coverage', '100', 'scope', 'orphan', 'traceability'],
    src: { ru: 'PMI, Practice Standard for Work Breakdown Structures (не перечитывалось)', en: 'PMI, Practice Standard for Work Breakdown Structures (not re-read)' },
    title: { ru: 'Правило 100%', en: 'The 100% rule' },
    text: { ru: 'WBS включает всю работу в рамках скоупа и не включает работу сверх него. Пакет работ без связанной истории либо скрытая история, либо обеспечивающая работа, либо расширение скоупа: назовите, что именно.',
            en: 'The WBS contains all the work in scope and none beyond it. A work package with no linked story is a hidden story, enabling work, or scope creep: say which.' } },
  { id: 'wbsdel', tags: ['wbs', 'deliverable', 'tasks', 'depth', 'packages'],
    src: { ru: 'PMI, Practice Standard for Work Breakdown Structures (не перечитывалось)', en: 'PMI, Practice Standard for Work Breakdown Structures (not re-read)' },
    title: { ru: 'WBS описывает результаты, а не действия', en: 'A WBS describes deliverables, not activities' },
    text: { ru: 'Верхние уровни называют результатами (существительными), нижний уровень — пакеты работ. Задачи («сделать, настроить») возникают позже, при планировании, и в WBS не нужны.',
            en: 'Upper levels name deliverables (nouns); the lowest level is the work package. Tasks ("do, configure") appear later in planning and do not belong in the WBS.' } },
  { id: 'scrum', tags: ['ready', 'sprint', 'big', 'refinement', 'size', 'done'],
    src: { ru: 'Руководство по Scrum, Швабер и Сазерленд (не перечитывалось)', en: 'The Scrum Guide, Schwaber and Sutherland (not re-read)' },
    title: { ru: 'Элемент бэклога, который влезает в спринт', en: 'A backlog item that fits in a Sprint' },
    text: { ru: 'К выбору на планировании готовы элементы, которые команда может завершить за один спринт. Такая прозрачность обычно возникает в ходе уточнения бэклога, а не на самом планировании.',
            en: 'Items the team can finish within one Sprint are ready to be selected at Sprint Planning. That clarity usually comes from refinement, not from planning itself.' } },
  { id: 'batch', tags: ['small', 'batch', 'feedback', 'big', 'flow'],
    src: { ru: 'Дон Райнертсен, «The Principles of Product Development Flow» (не перечитывалось)', en: 'Don Reinertsen, The Principles of Product Development Flow (not re-read)' },
    title: { ru: 'Малые партии работы', en: 'Small batches of work' },
    text: { ru: 'Меньший размер партии сокращает ожидание обратной связи и уменьшает цену ошибки. Нарезка нужна ради скорости обучения, а не ради аккуратного бэклога.',
            en: 'A smaller batch size shortens the wait for feedback and lowers the cost of an error. Splitting is for learning speed, not for a tidier backlog.' } }
];

const LETTERS = ['i', 'n', 'v', 'e', 's', 't'];

function normalizeInvest(v) {
  const out = {};
  if (typeof v === 'string' && v.length >= 6) {
    LETTERS.forEach((l, i) => { out[l] = LEVEL[v[i].toLowerCase()] || 'ok'; });
  } else if (Array.isArray(v)) {
    LETTERS.forEach((l, i) => { const x = str(v[i]).toLowerCase(); out[l] = LEVELS.includes(x) ? x : (LEVEL[x] || 'ok'); });
  } else {
    const o = v && typeof v === 'object' ? v : {};

}

function normalize(raw, opts) {

  const idMap = {};

    let id = 'S' + (i + 1);
    if (keep && str(s.id) && !used.has(str(s.id))) id = str(s.id);
    used.add(id);
    if (str(s.id)) idMap[str(s.id)] = id;
    const size = Number(s.size);
    r.stories.push({
      id, title: str(s.title), pattern: str(s.pattern), size: Number.isFinite(size) && size > 0 ? size : 3,

  const changed = Object.keys(idMap).filter((k) => idMap[k] !== k).sort((a, b) => b.length - a.length);
  if (changed.length) {
    const re = new RegExp('(^|[^\\p{L}\\p{N}-])(' + changed.map(escRe).join('|') + ')(?![\\p{L}\\p{N}-])', 'gu');
    r.stories.forEach((s) => { s.why = s.why.replace(re, (m, pre, id) => pre + idMap[id]); });
  }
  const codeMap = {};
  const walk = (nodes, prefix) => arr(nodes).map((n, i) => {
    const code = prefix ? prefix + '.' + (i + 1) : String(i + 1);
    if (n.code != null) codeMap[str(n.code)] = code;
    const node = { code, name: str(n.name), stories: arr(n.stories).map(str), children: [] };
    node.children = walk(n.children, code);

    s.wbs.forEach((c) => { const m = codeMap[c] || c; if (valid.has(m)) codes.add(m); });
    s._codes = codes;
  });

    n.stories.forEach((sid) => {
      const m = idMap[sid] || sid;
      const st = r.stories.find((x) => x.id === m);
      if (st) st._codes.add(n.code);
    });
  });
  r.stories.forEach((s) => { s.wbs = Array.from(s._codes).sort(codeSort); delete s._codes; });

/* ---------- Wording checks on a story title ---------- */
const SPIKE_RE = /спайк|spike|исследован|research/i;
const ROLE_RE = /^\s*(как|as an?|as the)\s/i;
const VALUE_RE = /(чтобы|для того, чтобы|so that|in order to)/i;
const UI_RE = /(^|[^\p{L}])(экран\p{L}*|кнопк\p{L}*|меню|страниц\p{L}*|окн[оа]\p{L}*|вкладк\p{L}*|нажима\p{L}*|кликаю|screen\p{L}*|button\p{L}*|menu|page|tab|dialog|click\p{L}*|tap)(?=[^\p{L}]|$)/iu;
const TASK_RE = /^\s*(создать|сделать|настроить|реализовать|разработать|написать|добавить|мигрировать|create|build|implement|set up|configure|write|develop|migrate)\s/i;
const isSpike = (s) => SPIKE_RE.test(s.pattern + ' ' + s.title);

/* ---------- Metrics ----------
   Cohn (Agile Estimating and Planning, ch. 6): stories for the next iterations are estimated 1, 2, 3, 5, 8;
   13 and above are epics or themes. So 8 is the top of the near-term scale (an edge), and the "too big" line
   sits at 13 by default; the user can move it to fit their velocity. */
const NEAR_MAX = 8;
const isEdge = (s) => s.size >= NEAR_MAX && s.size < state.bigAt;
function storyState(s) {
  const vals = LETTERS.map((l) => s.invest[l]);
  if (vals.includes('bad') || s.size >= state.bigAt) return 'bad';
  if (vals.includes('warn') || isEdge(s) || (s.criteria.length < 2 && !isSpike(s))) return 'warn';
  return 'ok';
}
function computeMetrics(r) {
  const flat = flatten(r.wbs);
  const leaves = flat.filter((n) => !n.children.length);
  const orphanLeaves = leaves.filter((n) => !n.stories.length);
  const unmapped = r.stories.filter((s) => !s.wbs.length);
  const states = r.stories.map(storyState);
  return {
    count: r.stories.length,
    points: r.stories.reduce((a, s) => a + s.size, 0),
    leaves: leaves.length, orphanLeaves, unmapped,
    coverage: leaves.length ? Math.round(100 * (leaves.length - orphanLeaves.length) / leaves.length) : 0,
    ok: states.filter((x) => x === 'ok').length, warn: states.filter((x) => x === 'warn').length, bad: states.filter((x) => x === 'bad').length,
    depth: depth(r.wbs)
  };
}

/* ---------- Retrieval over the library ----------

   without tags still finds its place. A note matches only when it shares at least one tag with what the

const SYN = {
  split: ['нарез', 'раздел', 'делит', 'делю', 'split', 'slice', 'slicing'],
  big: ['крупн', 'больш', 'эпик', 'epic', 'large'],
  invest: ['invest'],
  ready: ['готов', 'ready'],
  value: ['ценност', 'value'],
  vertical: ['вертикал', 'срез', 'слой', 'слои', 'cake', 'vertical'],
  horizontal: ['горизонтал', 'layer'],
  criteria: ['критери', 'приёмк', 'приемк', 'acceptance'],
  gwt: ['дано', 'given'],
  testable: ['тест', 'проверяем', 'testable'],
  spike: ['спайк', 'spike', 'исследован'],
  estimate: ['оценк', 'estimat', 'баллы', 'points'],
  size: ['размер', 'sized', 'size'],
  velocity: ['скорост', 'velocity'],
  dependencies: ['зависим', 'dependen'],
  wbs: ['wbs', 'декомпоз', 'пакет'],
  coverage: ['покрыт', 'coverage'],
  scope: ['скоуп', 'scope'],
  map: ['карта', 'map'],
  horizon: ['горизонт планир', 'horizon'],
  ui: ['интерфейс', 'экран', 'screen'],
  role: ['рол', 'role', 'персон'],
  conversation: ['разговор', 'обсужд', 'conversation']

const SYN_RE = Object.fromEntries(Object.entries(SYN).map(([tag, stems]) => [tag, new RegExp('(^|[^\\p{L}\\p{N}])(' + stems.map(escRe).join('|') + ')', 'iu')]));
function autoTags(text) { return Object.keys(SYN_RE).filter((tag) => SYN_RE[tag].test(text)); }
function retrieve(obs, notes, lang, limit = 5) {
  const weight = { bad: 3, warn: 2, good: 1, info: 1 };
  const want = {};
  obs.forEach((o) => o.tags.forEach((t) => { want[t] = (want[t] || 0) + weight[o.sev]; }));
  const rate = (tags) => {
    const hit = tags.filter((t) => want[t]);
    const top = hit.map((t) => want[t]).sort((a, b) => b - a).slice(0, 3);
    return { hit, s: top.reduce((a, b) => a + b, 0) };
  };
  const kb = KB.map((k) => ({ k: { ...k, mine: false }, ...rate(k.tags) })).filter((x) => x.hit.length);
  const mine = notes.map((n) => {
    const tags = Array.from(new Set(arr(n.tags).concat(autoTags(n.title + ' ' + n.text))));
    const k = { id: n.id, mine: true, tags, src: { ru: n.src, en: n.src }, title: { ru: n.title, en: n.title }, text: { ru: n.text, en: n.text } };
    return { k, ...rate(tags) };
  }).filter((x) => x.hit.length).sort((a, b) => b.s - a.s).slice(0, 2);
  const rest = kb.sort((a, b) => b.s - a.s).slice(0, Math.max(0, limit - mine.length));
  return mine.concat(rest).map((x) => ({ k: x.k, score: x.s, hit: x.hit })).sort((a, b) => b.score - a.score);
}

/* ---------- Exports ---------- */
function wbsText(r) {
  const lines = [];

}
function csvText(r) {
  const q = (v) => { let t = String(v); if (/^[=+\-@\t\r]/.test(t)) t = "'" + t; return '"' + t.replace(/"/g, '""') + '"'; };
  const head = ['ID', 'Summary', 'Acceptance criteria', 'Story points', 'Pattern', 'WBS', 'Status'];
  const rows = r.stories.map((s) => [s.id, s.title, s.criteria.join('\n'), s.size, s.pattern, s.wbs.join(' '), sLabel(storyState(s))]);
  return '﻿' + [head, ...rows].map((row) => row.map(q).join(',')).join('\r\n');
}

- In the WBS, 3 to 6 top-level deliverables and 1 to 5 work packages in each.
- Link the projections: a story's wbs holds work package codes, a package's stories holds story ids. A package with no story is allowed if it is enabling work.
- Write in English.

Return only JSON of this shape:
${SCHEMA}`;
}
function updatePromptView() { $('#prompt-view').textContent = genPrompt(); }

function errorCopy(e) {
  const c = e && e.code;
  if (c === 'cancelled') return '';
  if (c === 'not_granted' || c === 'sampling_disabled' || c === 'not_declared' || c === 'capability_disabled') return L('Claude недоступен для этой страницы. Показан пример.', 'Claude is not available for this page. The sample stays on screen.');
  if (c === 'rate_limited') return L('Слишком много запросов. Подождите немного и нажмите ещё раз.', 'Too many requests. Wait a moment and try again.');
  if (c === 'invalid_json' || c === 'empty_completion') return L('Ответ не удалось разобрать. Нажмите ещё раз или сократите эпик.', 'The answer could not be parsed. Try again or shorten the epic.');
  if (c === 'prompt_too_large') return L('Эпик слишком длинный. Сократите описание.', 'The epic is too long. Shorten the description.');
  return L('Что-то прервалось. Нажмите ещё раз.', 'Something was interrupted. Try again.');
}
function setBusy(on) {
  state.running = on;
  $('#run').disabled = on || !state.sample;
  $('#cancel').hidden = !on;
}

/* ---------- Actions ---------- */
function resetView() {
  state.focus = null; state.reflect = '';
  state.touched = new Set(state.mode === 'both' ? ['stories', 'wbs'] : [state.mode]);
}
function sampleById(id) { return SAMPLES.find((s) => s.id === id); }
function pickSample(id) {
  const s = sampleById(id); if (!s) return;
  state.sampleId = id;
  $('#epic').value = s[state.lang].epic; $('#ctx').value = s[state.lang].ctx;
  $$('[data-sample]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.sample === id)));
  if (id === 'tariff') {
    state.result = normalize(PREBAKED[state.lang]); state.source = 'sample'; state.resultFor = s[state.lang].epic;
    resetView(); render(); setStatus('');
  } else {
    renderSummary(); updatePromptView();
    setStatus(state.sample ? L('Нажмите «Разобрать эпик», чтобы Claude построил истории и WBS.', 'Press "Break down the epic" and Claude will build the stories and the WBS.') : L('Для этого примера нужен Claude: откройте страницу в Claude.', 'This example needs Claude: open the page in Claude.'), 'busy');
  }
}

async function run() {
  const epic = $('#epic').value.trim();
  if (!state.sample) { setStatus(errorCopy({ code: 'not_granted' }), 'err'); return; }
  if (epic.length < 15) { setStatus(L('Опишите эпик хотя бы одним предложением.', 'Describe the epic in at least one sentence.'), 'err'); return; }
  state.ctl = new AbortController(); setBusy(true);
  setStatus(L('Claude разбирает эпик. Обычно это 20–60 секунд.', 'Claude is breaking the epic down. This usually takes 20 to 60 seconds.'), 'busy');
  try {
    const raw = await state.sample.json(genPrompt(), {
      signal: state.ctl.signal,
      onText: ({ text }) => setStatus(L('Claude пишет разбор… ', 'Claude is writing the breakdown… ') + text.length + L(' зн.', ' chars'), 'busy')
    });
    const r = normalize(raw);
    if (!r.stories.length) throw { code: 'invalid_json' };
    if (!r.epic.title) r.epic.title = epic.slice(0, 70);
    r.epic.statement = epic;
    state.result = r; state.source = 'claude'; state.resultFor = epic;
    resetView(); render(); setStatus('');
  } catch (e) { setStatus(errorCopy(e), 'err'); }
  finally { setBusy(false); state.ctl = null; }
}

function stripLinks(nodes) { return nodes.map((n) => ({ code: n.code, name: n.name, stories: [], children: stripLinks(n.children) })); }
async function splitStory(id) {
  const r = state.result, s = r.stories.find((x) => x.id === id);
  if (!s || !state.sample) return;
  const codes = s.wbs.join(', ') || '—';
  const prompt = state.lang === 'ru'
    ? `Ты — Agile-коуч. Раздели одну историю на 2–4 более мелкие вертикальные истории, каждая не больше 5 баллов и с собственной ценностью для пользователя.\nЭпик: ${r.epic.statement || r.epic.title}\nИстория ${s.id}: ${s.title}\nКоды пакетов WBS, которые можно использовать: ${codes}\nФормат каждой истории: title («Как <роль>, я <действие>, чтобы <ценность>»), pattern, size (1, 2, 3, 5), invest (объект с ключами i, n, v, e, s, t и значениями "ok", "warn", "bad"), why, criteria (2 строки вида «Дано: … Когда: … Тогда: …»), wbs (подмножество кодов выше). Пиши на русском.\nВерни только JSON: {"stories":[…]}`
    : `You are an Agile coach. Split one story into 2 to 4 smaller vertical stories, each at most 5 points and each with its own value to a user.\nEpic: ${r.epic.statement || r.epic.title}\nStory ${s.id}: ${s.title}\nWBS codes you may use: ${codes}\nEach story has: title ("As a <role>, I <action>, so that <value>"), pattern, size (1, 2, 3, 5), invest (an object with keys i, n, v, e, s, t and values "ok", "warn", "bad"), why, criteria (2 lines shaped "Given … When … Then …"), wbs (a subset of the codes above). Write in English.\nReturn only JSON: {"stories":[…]}`;
  state.ctl = new AbortController(); setBusy(true);
  setStatus(L('Claude делит ' + id + '…', 'Claude is splitting ' + id + '…'), 'busy');
  try {
    const out = await state.sample.json(prompt, { signal: state.ctl.signal });
    const kids = arr(out && out.stories).slice(0, 4);
    if (kids.length < 2) throw { code: 'invalid_json' };
    /* ids stay stable: the new stories take the next free numbers and text that pointed at the old story points at the new ones */
    const top = Math.max(...r.stories.map((x) => Number((x.id.match(/\d+/) || [0])[0])));
    const kidIds = kids.map((k, i) => 'S' + (top + 1 + i));
    const mention = new RegExp('(^|[^\\p{L}\\p{N}-])' + id + '(?![\\p{L}\\p{N}-])', 'gu');
    const stories = r.stories.flatMap((x) => x.id !== id
      ? [{ ...x, why: x.why.replace(mention, (m, pre) => pre + kidIds.join(' / ')) }]
      : kids.map((k, i) => ({ ...k, id: kidIds[i], wbs: arr(k.wbs).length ? k.wbs : x.wbs })));
    state.result = normalize({ epic: r.epic, stories, wbs: stripLinks(r.wbs) }, { keepIds: true });
    state.result.epic = r.epic;
    if (state.source === 'sample') state.source = 'mixed';
    state.focus = null; state.reflect = ''; render(); setStatus(L('История разделена. Коуч пересчитал выводы.', 'Story split. The coach re-read the breakdown.'));
  } catch (e) { setStatus(errorCopy(e), 'err'); }
  finally { setBusy(false); state.ctl = null; }
}

async function reflect() {
  if (!state.sample || state.reflecting) return;
  const r = state.result, m = computeMetrics(r);
  const list = r.stories.map((s) => `${s.id} (${s.size} ${L('б.', 'pts')}, ${sLabel(storyState(s))}): ${s.title}`).join('\n');
  const obs = state.obs.map((o) => `- ${o.title}: ${o.body}`).join('\n');
  const notes = state.hits.map(({ k }) => `- ${k.title[state.lang]} (${k.src[state.lang]}): ${k.text[state.lang]}`).join('\n');
  const touched = Array.from(state.touched).join(', ');
  const prompt = state.lang === 'ru'
    ? `Ты — Agile-коуч, который работает вопросами. Перед тобой разбор эпика, который сделала команда.\nЭпик: ${r.epic.statement || r.epic.title}\nИстории:\n${list}\nПокрытие WBS: ${m.coverage}%. Проекции, которые смотрел пользователь: ${touched}.\nНаблюдения проверок:\n${obs}\nЗаметки из библиотеки пользователя:\n${notes}\n\nЗадача (до 150 слов, связным текстом, без таблиц): 1) чем разбор силён; 2) главный риск; 3) два вопроса команде, которые стоит обсудить; 4) один шаг на 15 минут. Опирайся на заметки выше и называй источник по имени. Не придумывай цитаты, номера страниц и книги, которых нет в списке.`
    : `You are an Agile coach who works through questions. Below is an epic breakdown a team produced.\nEpic: ${r.epic.statement || r.epic.title}\nStories:\n${list}\nWBS coverage: ${m.coverage}%. Projections the user looked at: ${touched}.\nFindings from the checks:\n${obs}\nNotes from the user's library:\n${notes}\n\nTask (up to 150 words, flowing prose, no tables): 1) what the breakdown does well; 2) the main risk; 3) two questions for the team to discuss; 4) one 15-minute next step. Rely on the notes above and name the source. Do not invent quotes, page numbers or books that are not in the list.`;
  state.rctl = new AbortController(); state.reflecting = true; state.reflect = '';
  renderCoach(); $('#reflect-out').textContent = L('Коуч думает…', 'The coach is thinking…');
  try {
    await state.sample(prompt, { signal: state.rctl.signal, cache: false, onText: ({ text }) => { state.reflect = text; const o = $('#reflect-out'); if (o) { o.hidden = false; o.textContent = text; } } });
  } catch (e) {
    if (e && e.text) state.reflect = e.text;
    const msg = errorCopy(e); if (msg) setStatus(msg, 'err');
  } finally { state.reflecting = false; state.rctl = null; renderCoach(); }
}

/* ---------- Wiring ---------- */
function setLang(lang) {
  state.lang = lang; store.set('lens.lang', lang);
  const s = state.sampleId && sampleById(state.sampleId);
  if (s) { $('#epic').value = s[lang].epic; $('#ctx').value = s[lang].ctx; }
  if (state.source === 'sample') {
    state.result = normalize(PREBAKED[lang]); state.source = 'sample';
    state.resultFor = sampleById('tariff')[lang].epic; state.focus = null;
  }
  applyLang(); render();
}
function boot() {
  const s0 = sampleById('tariff');
  $('#epic').value = s0[state.lang].epic; $('#ctx').value = s0[state.lang].ctx;
  state.result = normalize(PREBAKED[state.lang]); state.resultFor = s0[state.lang].epic;
  $('#run').disabled = true;
  applyLang(); render();
  setStatus(L('Подключаю Claude…', 'Connecting to Claude…'), 'busy');

  $$('[data-lang]').forEach((b) => b.addEventListener('click', () => setLang(b.dataset.lang)));
  $('#epic').addEventListener('input', () => { state.sampleId = null; $$('[data-sample]').forEach((b) => b.setAttribute('aria-pressed', 'false')); renderSummary(); updatePromptView(); });
  $('#ctx').addEventListener('input', updatePromptView);
  $('#lens').addEventListener('change', updatePromptView);
  const bigEl = $('#bigat'); bigEl.value = state.bigAt;
  bigEl.addEventListener('change', () => { const v = Math.round(Number(bigEl.value)); state.bigAt = Number.isFinite(v) && v >= 2 && v <= 100 ? v : 13; bigEl.value = state.bigAt; store.set('lens.bigAt', state.bigAt); render(); });
  $('#run').addEventListener('click', run);
  $('#cancel').addEventListener('click', () => state.ctl && state.ctl.abort());
  $('#copy-wbs').addEventListener('click', copyWbs);
  $('#dl-csv').addEventListener('click', downloadCsv);

  const get = async (name) => { try { return window.claude && window.claude.use ? await window.claude.use(name) : null; } catch (e) { return null; } };
  Promise.all([get('sample'), get('downloads')]).then(([smp, dl]) => {
    state.sample = smp && typeof smp.json === 'function' ? smp : null;
    state.downloads = dl;
    $('#dl-csv').hidden = !state.downloads;
    $('#run').disabled = !state.sample;
    setStatus(state.sample ? '' : L('Показан пример. Чтобы разобрать свой эпик, откройте страницу в Claude.', 'A sample is shown. To break down your own epic, open the page in Claude.'), state.sample ? '' : 'busy');
    renderPanes(); renderCoach();
  });
}
boot();
</script>

</body>
</html>
