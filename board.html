<title>Канбан-доска — Корзина</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
/* Канбан-доска: the operations department's Kanban board under construction.
   A dark band carries the 35 weeks of the programme, with week 18 (four specialists leave for the Food Delivery launch team) in signal orange. */
:root {
  --paper: #E6E8E3;      /* concrete */
  --sheet: #FBFBF9;
  --sheet-2: #F0F1ED;
  --ink: #1D2026;
  --ink-2: #5A6068;
  --rule: #D3D6CF;
  --rule-2: #B4B9B0;
  --band: #20242B;       /* graphite control band, same in both themes */
  --band-ink: #E9EBE6;
  --band-ink-2: #9AA1AB;
  --signal: #F2551D;     /* critical path, launch */
  --signal-tint: #FDE3D8;
  --cobalt: #2D4FE3;     /* teams, adaptive work */
  --cobalt-tint: #E2E7FC;
  --amber: #D9960B;      /* promo windows */
  --violet: #7650C4;
  --green: #2D8A57;
  --cal: #3A414C;        /* calendar works */
  --ok: #23804A; --ok-tint: #DDF0E3;
  --warn: #9A6400; --warn-tint: #F8ECCB;
  --bad: #C42B2B; --bad-tint: #F8DEDC;
  --on-fill: #FFFFFF;
  --c-work: #2D4FE3;     /* chart: work, finished */
  --c-wait: #F2551D;     /* chart: waiting, started */
  --font-display: "Dela Gothic One", "Golos Text", system-ui, sans-serif;
  --font-body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #14161A; --sheet: #1D2026; --sheet-2: #252930; --ink: #ECEDE9; --ink-2: #A2A8B0; --rule: #333840; --rule-2: #4A5059;
    --band: #0C0E11; --band-ink: #ECEDE9; --band-ink-2: #8E959F;
    --signal: #FF7341; --signal-tint: #44231A; --cobalt: #8EA4FF; --cobalt-tint: #232C52; --amber: #F2B84B; --violet: #B79BF0; --green: #6CCB93; --cal: #B9C0CA;
    --ok: #6CCB93; --ok-tint: #173323; --warn: #F2C14E; --warn-tint: #3A2D0E; --bad: #FF8A80; --bad-tint: #401A18;
    --on-fill: #14161A; --c-work: #6F8AF7; --c-wait: #E45A2A; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #14161A; --sheet: #1D2026; --sheet-2: #252930; --ink: #ECEDE9; --ink-2: #A2A8B0; --rule: #333840; --rule-2: #4A5059;
  --band: #0C0E11; --band-ink: #ECEDE9; --band-ink-2: #8E959F;
  --signal: #FF7341; --signal-tint: #44231A; --cobalt: #8EA4FF; --cobalt-tint: #232C52; --amber: #F2B84B; --violet: #B79BF0; --green: #6CCB93; --cal: #B9C0CA;
  --ok: #6CCB93; --ok-tint: #173323; --warn: #F2C14E; --warn-tint: #3A2D0E; --bad: #FF8A80; --bad-tint: #401A18;
  --on-fill: #14161A; --c-work: #6F8AF7; --c-wait: #E45A2A; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; padding-inline: 16px; padding-block: 0 56px; font-variant-numeric: tabular-nums; }
.wrap { max-width: 1320px; margin-inline: auto; }
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2.5px solid var(--cobalt); outline-offset: 2px; }
.mono { font-variant-numeric: tabular-nums; }

/* ---------- Control band: 20 working days of weeks 6–9, committee Thursdays ---------- */
.band { background: var(--band); color: var(--band-ink); margin-inline: -16px; padding-inline: 16px; padding-block: 26px 0; }
.band-top { display: flex; flex-wrap: wrap; gap: 14px 40px; align-items: end; justify-content: space-between; }
.brand { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.brand h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(26px, 4vw, 40px); line-height: 1; letter-spacing: -0.01em; }
.brand p { color: var(--band-ink-2); max-width: 62ch; font-size: 14.5px; }
.casetag { font-size: 13px; color: var(--band-ink-2); border: 1px solid #454b55; border-radius: 999px; padding: 4px 12px; white-space: nowrap; }

.ruler { margin-top: 30px; display: grid; grid-template-columns: repeat(35, minmax(0, 1fr)); gap: 3px; align-items: end; height: 58px; }
.ruler span { height: 12px; border-radius: 3px; background: #343a44; position: relative; }
.ruler span.wk::before { content: attr(data-wk); position: absolute; bottom: 30px; left: 0; font-size: 11.5px; color: var(--band-ink-2); white-space: nowrap; }
.ruler span.mk { height: 28px; }
.ruler span.mk::after { content: attr(data-lab); position: absolute; bottom: 34px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.ruler span.now { background: var(--band-ink); }
.ruler span.now::after { left: 0; color: var(--band-ink); }
.ruler span.leave { background: var(--signal); }
.ruler span.leave::after { left: 50%; transform: translateX(-50%); color: var(--signal); }
.ruler span.launch { background: var(--green); }
.ruler span.launch::after { right: 0; color: var(--green); }
.ruler span.after { background: #4a3a35; }
@media (max-width: 640px) { .ruler span.mk::after { content: attr(data-short); } .ruler span.wk::before { content: none; } }

.steps { position: relative; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); padding-block: 22px 24px; border-top: 1px solid #3a4049; margin-top: 16px; }
.steps::before { content: ""; position: absolute; left: 14px; right: 14px; top: 36px; height: 3px; background: #3e444e; border-radius: 3px; }
.step { appearance: none; position: relative; text-align: left; cursor: pointer; border: 0; background: transparent; color: var(--band-ink); padding: 0 10px 0 0; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.step .dot { width: 31px; height: 31px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; background: var(--band); border: 3px solid #5b626d; color: var(--band-ink-2); position: relative; z-index: 1; }
.step .t { font-weight: 600; font-size: 14px; line-height: 1.25; }
.step .s { font-size: 12.5px; color: var(--band-ink-2); line-height: 1.3; }
.step:hover .dot { border-color: var(--band-ink); }
.step.done .dot { background: var(--green); border-color: var(--green); color: var(--band); }
.step[aria-current="step"] .dot { background: var(--signal); border-color: var(--signal); color: var(--band); box-shadow: 0 0 0 5px rgba(242, 85, 29, .25); }
.step.locked { cursor: not-allowed; }
.step.locked .dot { border-style: dashed; }
.step.locked .t, .step.locked .s { color: #6d7480; }
@media (max-width: 860px) { .step .s { display: none; } .step .t { font-size: 12px; } }
@media (max-width: 520px) { .step .t { display: none; } }

/* ---------- Канбан-доска: work-type tags ---------- */
.type { display: inline-flex; align-items: center; gap: 7px; }
.type i { width: 10px; height: 10px; border-radius: 2px; flex: none; background: var(--ink-2); }
.type.incident i { background: var(--bad); transform: rotate(45deg); }
.type.client i { background: var(--cobalt); border-radius: 50%; }
.type.site i { background: var(--cal); }
.type.planned i { background: var(--green); }
.type.improve i { background: var(--violet); border-radius: 50% 0; }
.note { font-size: 13px; color: var(--ink-2); border-left: 3px solid var(--rule-2); padding-left: 10px; }
.radio-list { display: flex; flex-direction: column; gap: 8px; }
.radio-list label { display: flex; gap: 10px; align-items: baseline; padding: 9px 12px; border: 1.5px solid var(--rule); border-radius: 10px; cursor: pointer; background: var(--sheet); }
.radio-list label:has(input:checked) { border-color: var(--ink); }
.radio-list input { accent-color: var(--signal); }
.compare { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.stat { padding: 12px 14px; background: var(--sheet-2); border-radius: 10px; display: flex; flex-direction: column; gap: 2px; }
.stat b { font-family: var(--font-display); font-weight: 400; font-size: 24px; line-height: 1.15; }
.stat.hot b { color: var(--signal); }
.stat .from { font-size: 13px; color: var(--ink-2); }

/* Numeric question with an always-visible formula */
.nq { display: grid; gap: 6px; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 12px; background: var(--sheet); }
.nq .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.nq input { width: 7em; text-align: center; font-weight: 600; }
.formula { font-size: 13px; color: var(--ink-2); background: var(--sheet-2); border-radius: 8px; padding: 6px 10px; }
.formula b { color: var(--ink); font-weight: 600; }
.nq-list { display: grid; gap: 10px; }

/* Column builder */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { appearance: none; border: 1.5px dashed var(--rule-2); background: var(--sheet); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 14px; }
.chip:hover { border-color: var(--ink); }
.chip[disabled] { opacity: .4; cursor: default; border-style: solid; }
.colrows { display: flex; flex-direction: column; gap: 8px; }
.colrow { display: grid; grid-template-columns: 28px minmax(150px, 220px) minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 10px; background: var(--sheet); }
.colrow .ix { font-weight: 700; color: var(--ink-2); text-align: center; }
.colrow .nm { font-weight: 600; }
.colrow .tools { display: flex; gap: 4px; }
.colrow .tools button { appearance: none; border: 1px solid var(--rule); background: var(--sheet-2); border-radius: 8px; width: 32px; height: 32px; cursor: pointer; }
.colrow .tools button:hover:not([disabled]) { border-color: var(--ink); }
.colrow .tools button[disabled] { opacity: .35; cursor: default; }
@media (max-width: 700px) { .colrow { grid-template-columns: 24px minmax(0, 1fr) auto; } .colrow input { grid-column: 1 / -1; } }
.checkline { display: flex; flex-wrap: wrap; gap: 8px 14px; }
.checkline label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.checkline input { accent-color: var(--signal); }
.verdicts { display: flex; flex-direction: column; gap: 8px; }
.verdict { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; align-items: baseline; }
.verdict .rowhint { grid-column: 2; }

/* Board preview: the department's Kanban board as the learner designed it */
.kb-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid var(--rule); }
.kb { display: grid; min-width: 640px; font-size: 13px; }
.kb > div { padding: 8px 10px; border-bottom: 1px solid var(--rule); border-right: 1px solid var(--rule); min-width: 0; }
.kb-h { background: var(--sheet); font-weight: 600; border-bottom: 2px solid var(--ink) !important; line-height: 1.25; }
.kb-h.cab { color: var(--signal); }
.kb-h.bad { color: var(--bad); text-decoration: line-through; }
.kb-lane { background: var(--sheet); display: flex; flex-direction: column; gap: 2px; border-left: 5px solid var(--rule-2); }
.kb-lane b { font-weight: 600; }
.kb-lane small { color: var(--ink-2); font-size: 11.5px; line-height: 1.3; }
.kb-lane.exp { border-left-color: var(--bad); }
.kb-lane.fix { border-left-color: var(--cal); }
.kb-lane.std { border-left-color: var(--cobalt); }
.kb-lane.int { border-left-color: var(--violet); }
.kb-cell { background: var(--sheet-2); min-height: 52px; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.kb-cell.cab { background: repeating-linear-gradient(135deg, var(--signal-tint) 0 6px, var(--sheet-2) 6px 12px); }
.kb-cell.skip { background: var(--sheet); color: var(--ink-2); font-style: italic; }
.kb-lim { display: inline-block; border: 1.5px solid var(--ink); border-radius: 999px; padding: 0 8px; font-weight: 600; font-size: 12px; background: var(--sheet); }
.kb-lim.over { border-color: var(--bad); color: var(--bad); }
.kb-in { font-size: 12px; color: var(--ink-2); }
.capbar { display: flex; flex-direction: column; gap: 6px; }
.capbar .track { position: relative; height: 14px; border-radius: 999px; background: var(--sheet-2); border: 1px solid var(--rule); overflow: hidden; }
.capbar .fill { position: absolute; inset: 0 auto 0 0; background: var(--cobalt); border-radius: 999px; }
.capbar .fill.over { background: var(--bad); }
.capbar .lab { font-size: 13px; color: var(--ink-2); }
.tri { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
table.rules select { width: auto; min-width: 11em; padding: 6px 8px; }
table.rules input[type="text"] { min-width: 12em; }
table.lims input { width: 4.6em; text-align: center; font-weight: 600; padding: 6px 4px; }
/* ---------- Working area ---------- */
.workspace { display: grid; gap: 22px; grid-template-columns: minmax(0, 1fr); align-items: start; padding-top: 24px; }
@media (min-width: 1100px) { .workspace { grid-template-columns: minmax(0, 1fr) 320px; } }
.panel { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.card { background: var(--sheet); border-radius: 16px; padding: 22px 24px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card > h3, .sec-h { font-family: var(--font-display); font-weight: 400; font-size: 19px; line-height: 1.2; letter-spacing: -0.005em; }
.lead { color: var(--ink-2); max-width: 72ch; }
.lbl { font-size: 13px; color: var(--ink-2); font-weight: 600; }
.grid2 { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 820px) { .grid2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
@media (max-width: 600px) { .card { padding: 18px 16px; border-radius: 12px; } }

.btn { appearance: none; cursor: pointer; border: 1.5px solid var(--ink); background: transparent; border-radius: 999px; padding: 8px 18px; font-weight: 600; line-height: 1.2; }
.btn:hover { background: var(--sheet-2); }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.btn-primary { background: var(--ink); color: var(--sheet); }
.btn-primary:hover { background: var(--ink); filter: brightness(1.25); }
.btn-small { padding: 5px 13px; font-size: 13px; border-width: 1px; border-color: var(--rule-2); font-weight: 500; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.status { min-height: 20px; font-size: 13.5px; color: var(--ink-2); }
.status.err { color: var(--bad); }

textarea, input[type="text"], input[type="number"], select { width: 100%; border: 1.5px solid var(--rule); background: var(--sheet); border-radius: 10px; padding: 9px 12px; }
textarea:hover, input:hover, select:hover { border-color: var(--rule-2); }
textarea { resize: vertical; line-height: 1.55; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field-top { display: flex; justify-content: space-between; gap: 8px 14px; align-items: baseline; flex-wrap: wrap; }
.field .help, .help { font-size: 13px; color: var(--ink-2); }

/* Tables */
table.data { width: 100%; border-collapse: collapse; font-size: 14px; }
table.data th, table.data td { text-align: left; padding: 10px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
table.data th { font-size: 12.5px; color: var(--ink-2); font-weight: 600; border-bottom: 2px solid var(--ink); }
table.data tbody tr:last-child td { border-bottom: 0; }
.tscroll { overflow-x: auto; }
table.mine td { vertical-align: middle; }
table.mine input { width: 4.2em; padding: 6px 4px; text-align: center; border-radius: 8px; font-weight: 600; font-size: 15px; }
table.mine select { width: auto; }
table.mine tr.given td { color: var(--ink-2); }
.rowhint { font-size: 12.5px; color: var(--ink-2); margin-top: 4px; max-width: 34ch; }

/* Case */
.news { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 820px) { .news { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.newsitem { position: relative; padding: 16px 16px 14px; background: var(--signal-tint); border-radius: 4px 14px 14px 14px; display: flex; flex-direction: column; gap: 6px; }
.newsitem b { font-family: var(--font-display); font-weight: 400; font-size: 16px; color: var(--signal); }
.task-list { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; }
.task-list li::marker { font-weight: 700; color: var(--ink-2); }

/* Prompt builder: one form, five rows */
.rctfo { display: flex; flex-direction: column; background: var(--sheet); border-radius: 16px; overflow: hidden; }
.part { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 6px 22px; padding: 18px 24px 18px 20px; border-bottom: 1px solid var(--rule); border-left: 5px solid var(--rule); }
.part:last-child { border-bottom: 0; }
.part > .field-top { grid-column: 1; grid-row: 1 / span 3; flex-direction: column; align-items: start; justify-content: start; gap: 4px; }
.part > textarea, .part > .actions, .part > .checks { grid-column: 2; }
.part.ok { border-left-color: var(--ok); }
.part.warn { border-left-color: var(--amber); }
.part.bad { border-left-color: var(--bad); }
.part-name { font-family: var(--font-display); font-weight: 400; font-size: 17px; }
@media (max-width: 700px) { .part { grid-template-columns: minmax(0, 1fr); padding: 16px; } .part > .field-top, .part > textarea, .part > .actions, .part > .checks { grid-column: 1; grid-row: auto; } }
.checks { display: flex; flex-wrap: wrap; gap: 6px; }
.chk { font-size: 12.5px; padding: 2px 10px 2px 8px; border-radius: 999px; color: var(--ink-2); background: var(--sheet-2); display: inline-flex; align-items: center; gap: 6px; }
.chk::before { content: ""; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid currentColor; flex: none; }
.chk.on { color: var(--ok); background: var(--ok-tint); }
.chk.on::before { background: currentColor; }
.chk.alert { color: var(--bad); background: var(--bad-tint); }
.chk.alert::before { border-radius: 1px; background: currentColor; transform: rotate(45deg); }
.preview { margin: 0; padding: 14px; background: var(--sheet-2); border-radius: 10px; max-height: 340px; overflow: auto; font-family: ui-monospace, Menlo, monospace; font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.svc { color: var(--ink-2); }
details > summary { cursor: pointer; color: var(--ink-2); font-size: 13.5px; }

/* ---------- Roadmap board ---------- */
.gantt-wrap { overflow-x: auto; border-radius: 12px; background: var(--sheet-2); }
.gantt { min-width: 820px; display: grid; grid-template-columns: 200px minmax(0, 1fr); font-size: 13px; }
.g-lab { padding: 6px 12px; border-bottom: 1px solid var(--rule); display: flex; flex-direction: column; justify-content: center; min-width: 0; background: var(--sheet); }
.g-lab .ln { font-size: 11.5px; color: var(--ink-2); }
.g-lab .nm { overflow-wrap: anywhere; line-height: 1.3; font-weight: 500; }
.g-track { position: relative; border-bottom: 1px solid var(--rule); min-height: 44px; display: grid; grid-template-columns: repeat(35, minmax(0, 1fr)); align-items: center;
  background-image: repeating-linear-gradient(90deg, transparent 0, transparent calc(100% / 7 - 1px), var(--rule) calc(100% / 7 - 1px), var(--rule) calc(100% / 7)),
    repeating-linear-gradient(90deg, transparent 0, transparent calc(100% / 35 - 1px), color-mix(in srgb, var(--rule) 45%, transparent) calc(100% / 35 - 1px), color-mix(in srgb, var(--rule) 45%, transparent) calc(100% / 35)); }
.g-head { font-size: 11.5px; color: var(--ink-2); min-height: 30px; background: var(--sheet); border-bottom: 2px solid var(--ink); }
.g-lab.g-head { font-weight: 600; justify-content: end; }
.g-head span { text-align: left; padding-left: 3px; font-weight: 600; }
.bar { grid-row: 1; height: 22px; border-radius: 999px; position: relative; z-index: 2; display: flex; align-items: center; padding: 0 9px; color: var(--on-fill); font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; }
.bar.ms { height: 15px; width: 15px; justify-self: center; transform: rotate(45deg); border-radius: 3px; padding: 0; }
.bar.crit { background: var(--signal) !important; box-shadow: 0 0 0 3px var(--signal-tint); }
.ghost { grid-row: 1; height: 32px; border: 2px dashed var(--ink-2); border-radius: 999px; z-index: 1; }
.ghost.ms { width: 24px; justify-self: center; border-radius: 4px; }
.mark { grid-row: 1; justify-self: end; width: 0; height: 100%; z-index: 0; border-left: 1.5px dashed var(--amber); }
.mark.lane-gate { border-left: 2px solid var(--signal); }

  { k: 'site', n: 'Работы по запуску «Доставки еды»', min: 2, max: 4, f: 'Согласование требований, участие в приёмке интеграций с ресторанами; растёт' },
  { k: 'improve', n: 'Улучшения', min: 1, max: 2, f: 'Автоматизация проверки карточек товаров, устранение причин повторяющихся сбоев; постоянно откладываются' }

const mid = (t) => (t.min + t.max) / 2;
const ENG = 12, LEAVE = 4, ENG18 = ENG - LEAVE, DAYS = 5;

const SITE = mid(TYPES[3]);                                   // 3

const CLASSES = [

  site: 'Работы привязаны к графику партнёров-ресторанов и приёмке интеграций — это фиксированная дата. Если сроки гибкие, допустим и стандартный класс.',
  improve: 'Срочной даты нет, но без улучшений растут повторяющиеся сбои и ночные вызовы дежурных: стоимость задержки растёт незаметно.'
};
const RULE_OPTS = {

};
const RULE_REF = {
  exp: { cab: ['no'], stop: ['yes'], pr: ['r30'] },
  fix: { cab: ['yes', 'pre'], stop: ['no'], pr: ['date'] },
  std: { cab: ['pre'], stop: ['no'], pr: ['d5'] },

};

const COLS = [
  { k: 'in', n: 'Входящие' }, { k: 'triage', n: 'Разбор и оценка' }, { k: 'cab', n: 'Ждёт комитета (чт)' },

];
const colName = (k) => (COLS.find((c) => c.k === k) || {}).n || k;
const EXIT_EX = {
  in: 'заявка заполнена: магазин продавца, товары, желаемая дата', triage: 'понятны объём, класс и нужен ли комитет', cab: 'решение комитета получено',

};
const LANES = [
  ['class', 'По классам обслуживания: четыре дорожки, срочная — сверху'],

/* ================= Numeric questions: formula always visible ================= */
const near = (v, r, t = 0.051) => v != null && Math.abs(v - r) <= t;
const NQ = {
  arr: { s: 3, label: 'Сколько работ в среднем приходит в отдел за неделю?', f: 'Для каждого типа возьмите <b>середину диапазона = (мин + макс) ÷ 2</b>, затем сложите пять чисел. У акций и обновлений каталога диапазона нет — берите 3.',
    ok: (v) => v >= 21 && v <= 22, ans: '5 + 3 + 9 + 3 + 1,5 = 21,5',
    diag: (v) => (v === 18 ? 'Это сумма нижних границ. Возьмите середины диапазонов.' : v === 25 ? 'Это сумма верхних границ. Возьмите середины диапазонов.' : 'Сбои 4–6 → 5; акции и каталог → 3; запросы продавцов 8–10 → 9; запуск «Доставки еды» 2–4 → 3; улучшения 1–2 → 1,5. Сложите.') },
  cap: { s: 3, label: 'Сколько человеко-дней в неделю у отдела?', f: '<b>Человеко-дни = число специалистов × 5 рабочих дней.</b> Руководителя не считаем: он не берёт задачи с доски.',
    ok: (v) => v === CAP, ans: '12 × 5 = 60', diag: (v) => (v === 65 ? 'Руководителя не включаем: 12 специалистов, а не 13.' : 'Специалистов 12, рабочих дней в неделе 5. Перемножьте.') },
  perday: { s: 3, label: 'Сколько запросов продавцов приходит в среднем за один рабочий день?', f: '<b>В день = в неделю ÷ 5.</b> Запросов в неделю — середина диапазона 8–10, то есть 9.',

  sys5: { s: 3, label: 'Сколько запросов может одновременно быть в работе, чтобы в среднем укладываться в 5 дней?', f: '<b>Закон Литтла: в работе = поступление в день × время выполнения в днях.</b> Поступление в день — из вопроса выше.',

    ok: (v) => v === 5, ans: 'четверг — 5-й день срока', diag: () => 'Продолжите счёт рабочих дней до четверга.' },
  fri_left: { s: 2, label: 'Сколько рабочих дней срока останется на саму работу после решения комитета?', f: '<b>Остаток = 5 дней по договору − день, на который пришёлся комитет.</b>',
    ok: (v) => v === 0, ans: '5 − 5 = 0: срок истекает в день комитета', diag: () => 'Из 5 дней по договору вычтите день комитета из вопроса выше.' },

  drop: { s: 5, label: 'На сколько процентов снизится ёмкость?', f: '<b>(было − стало) ÷ было × 100.</b> Делим на прежнюю ёмкость (60), а не на новую.',

  loadB: { s: 5, label: 'Сколько работ в неделю приходится на одного специалиста сейчас?', f: '<b>Поступление в неделю ÷ число специалистов.</b> Поступление — 21,5 (шаг 3). Один знак после запятой.',

      h('p', { class: 'lead', text: 'Закон Литтла связывает три величины: сколько задач в работе, сколько приходит в день и сколько дней задача проходит доску. Если задача должна пройти за 5 дней, в работе не может быть больше, чем поступление × 5.' }),
      h('div', { class: 'nq-list' }, nq('perday'), nq('sys5'), nq('sys4'))),
    h('section', { class: 'card' }, h('h3', { text: '3. Лимиты по дорожкам' }),
      h('p', { class: 'lead', text: 'Лимит — сколько задач этой дорожки может одновременно быть в столбце «В работе». Впишите целые числа и коротко обоснуйте.' }),
      lims, capBar('now'), slot(3, 'sum'),
      h('span', { class: 'lbl', text: 'Пришёл третий сбой, а лимит срочной дорожки уже занят. Что делаем?' }),
      radios('over', OVER, state.over, (v) => { state.over = v; persist(); refresh(); }), slot(3, 'over')),
    h('section', { class: 'card' }, h('h3', { text: 'Ваша доска с лимитами' }),
      state.lanes === 'class' ? null : h('p', { class: 'help', text: 'Лимиты видны на доске, если на шаге 2 выбраны дорожки по классам или по типам.' }),
      h('div', { id: 'board-preview', 'data-mode': 'now' }, boardPreview('now'))),
    checkBar(3, [4, 'Дальше: улучшения']),
    hintCard('wip', 'Лимиты WIP')
  ];
}

/* ---- Step 5: improvements ---- */
function viewImp() {
  const i = state.imp, set = (f) => (v) => { i[f] = v; persist(); refresh(); };
  const sh = num(i.share);
  return [
    h('section', { class: 'card' }, h('h3', { text: '1. Сколько ёмкости отдать улучшениям' }),
      h('p', { class: 'lead', text: 'Улучшения — автоматизация проверки карточек товаров и устранение причин повторяющихся сбоев — по словам руководителя, избавили бы отдел от половины ночных вызовов дежурных. Решите, какую долю недели им гарантировать.' }),
      h('div', { class: 'nq' },
        h('label', { class: 'lbl', for: 'imp-share', text: 'Доля ёмкости на улучшения' }),
        select('imp-share', i.share, SHARES.map((p) => [String(p), p + '%']), 'выберите долю', (v) => { i.share = v; persist(); render(); }),
        h('label', { class: 'lbl', for: 'imp-days', text: 'Сколько это человеко-дней в неделю?' }),
        h('div', { class: 'formula', html: `Как считать: <b>ёмкость отдела × доля ÷ 100</b>. Ёмкость — 12 специалистов × 5 дней = 60 человеко-дней${sh != null ? `. Для ${sh}%: 60 × ${sh} ÷ 100` : ''}.` }),
        h('div', { class: 'row' }, input('imp-days', i.days, set('days'), 'Человеко-дней на улучшения'), slot(4, 'days')))),
    h('section', { class: 'card' }, h('h3', { text: '2. Механизм' }),
      radios('mech', MECH.map((m) => [m[0], m[1]]), i.mech, set('mech')), slot(4, 'mech'),
      h('div', { class: 'tri' },
        h('div', { class: 'field' }, h('label', { class: 'lbl', for: 'imp-n', text: 'Сколько улучшений всегда в работе (минимум)?' }), input('imp-n', i.n, set('n'), 'Минимум улучшений'), slot(4, 'n')),
        h('div', { class: 'field' }, h('label', { class: 'lbl', for: 'imp-owner', text: 'Кто отвечает за правило?' }), select('imp-owner', i.owner, OWNER.map((x) => [x[0], x[1]]), 'выберите', set('owner')), slot(4, 'owner')),
        h('div', { class: 'field' }, h('label', { class: 'lbl', for: 'imp-metric', text: 'Как поймём, что правило работает?' }), select('imp-metric', i.metric, METRIC.map((x) => [x[0], x[1]]), 'выберите', set('metric')), slot(4, 'metric'))),
      h('span', { class: 'lbl', text: 'Сбой занял специалиста, который в эту неделю делал улучшение. Что дальше?' }),
      radios('displ', DISPL.map((x) => [x[0], x[1]]), i.displ, set('displ')), slot(4, 'displ')),
    h('section', { class: 'card' }, h('h3', { text: '3. Правило одной фразой' }),
      h('p', { class: 'lead', text: 'Соберите выбранное выше в правило, которое можно повесить над доской. В нём должно быть число, владелец и что делать при вытеснении.' }),
      (() => { const ta = h('textarea', { id: 'imp-text', rows: 3, placeholder: 'Каждую неделю не менее … человеко-дней (…%) идёт на улучшения; ответственный — …; если слот занят сбоем, …' }); ta.value = i.text; ta.addEventListener('input', () => { i.text = ta.value; persist(); refresh(); }); return ta; })(),
      slot(4, 'text')),
    checkBar(4, [5, 'Дальше: неделя 18']),
    hintCard('imp', 'Правило для улучшений')
  ];
}

/* ---- Step 6: week 18 and summary ---- */
function viewW18() {
  const lims = h('div', { class: 'tscroll' }, h('table', { class: 'data lims' },
    h('thead', {}, h('tr', {}, ['Дорожка', 'Было (шаг 4)', 'С 18-й недели'].map((t) => h('th', { text: t })))),
    h('tbody', {}, CLASSES.map((c) => h('tr', {}, h('td', {}, h('b', { text: c.n })), h('td', { class: 'mono', text: state.lim[c.k] || '—' }),
      h('td', {}, input('l18-' + c.k, state.lim18[c.k], (v) => { state.lim18[c.k] = v; persist(); refresh(); }, `Лимит с 18-й недели: ${c.n}`)))))));
  const dec = h('div', { class: 'radio-list' }, DEC18.map(([k, t]) => {
    const i = h('input', { type: 'checkbox', id: 'd18-' + k }); i.checked = state.dec18.includes(k);
    i.addEventListener('change', () => { state.dec18 = i.checked ? [...state.dec18, k] : state.dec18.filter((x) => x !== k); persist(); refresh(); });
    return h('label', { for: 'd18-' + k }, i, h('span', { text: t }));
  }));
  const f = state.final;
  const fld = (k, label, ph) => { const ta = h('textarea', { id: 'f-' + k, rows: 2, placeholder: ph }); ta.value = f[k]; ta.addEventListener('input', () => { f[k] = ta.value; persist(); }); return h('div', { class: 'field' }, h('label', { class: 'lbl', for: 'f-' + k, text: label }), ta); };
  return [
    h('section', { class: 'card' }, h('h3', { text: '1. Что теряет отдел' }),
      h('div', { class: 'nq-list' }, nq('e18'), nq('cap18'), nq('drop'))),
    h('section', { class: 'card' }, h('h3', { text: '2. Нагрузка на специалиста и время выполнения' }),
      h('div', { class: 'nq-list' }, nq('loadB'), nq('loadA'), nq('factor'), nq('t75')),
      state.chk[5] ? h('div', { class: 'compare' },
        h('div', { class: 'stat' }, h('span', { class: 'lbl', text: 'Специалистов' }), h('b', { text: '12 → 8' })),
        h('div', { class: 'stat' }, h('span', { class: 'lbl', text: 'Ёмкость, человеко-дней' }), h('b', { text: '60 → 40' })),
        h('div', { class: 'stat hot' }, h('span', { class: 'lbl', text: 'Работ на специалиста в неделю' }), h('b', { text: '1,8 → 2,3' })),
        h('div', { class: 'stat hot' }, h('span', { class: 'lbl', text: 'Запрос продавца при старых лимитах' }), h('b', { text: '5 → 7,5 дн.' }))) : null),
    h('section', { class: 'card' }, h('h3', { text: '3. Новые лимиты под 8 специалистов' }),
      h('p', { class: 'lead', text: 'Пересчитайте лимиты «В работе». Работы по запуску «Доставки еды» можно увести на отдельную дорожку четырёх специалистов команды запуска — тогда в фиксированной дате остаются только акции и обновления каталога.' }),
      lims, capBar('w18'), slot(5, 'lim18')),
    h('section', { class: 'card' }, h('h3', { text: '4. Что ещё меняем в системе' }),
      h('p', { class: 'lead', text: 'Отметьте всё, что вы бы сделали. Не все варианты помогают.' }), dec, slot(5, 'dec')),
    h('section', { class: 'card' }, h('h3', { text: 'Доска с 18-й недели' }),
      h('div', { id: 'board-preview', 'data-mode': 'w18' }, boardPreview('w18'))),
    checkBar(5, null),
    hintCard('w18', 'Неделя 18'),
    h('section', { class: 'card' }, h('h3', { text: 'Итог для защиты' }),
      h('p', { class: 'lead', text: 'Три фразы для выступления Айгерим. Опирайтесь на свои расчёты.' }),
      fld('p1', '1. Как устроена доска и почему', 'Например: ожидание комитета вынесено в отдельный столбец, потому что…'),
      fld('p2', '2. Правила и лимиты — с числами', 'Например: лимит запросов продавцов — 7, потому что 1,8 в день × 4 дня…'),
      fld('p3', '3. Что нужно от руководства к 18-й неделе', 'Например: решение о… ёмкость падает на 33%…'),
      h('div', { class: 'actions' },
        h('button', { class: 'btn btn-primary', type: 'button', text: 'Скопировать отчёт', onclick: (e) => copyText(report(), e.currentTarget) }),
        state.downloads ? h('button', { class: 'btn', type: 'button', text: 'Скачать отчёт', onclick: saveReport }) : null),
      h('p', { class: 'help', id: 'rep-status', text: 'Отчёт собирает всё, что вы ввели на шагах 1–6, в формате для документа или чата группы.' }))
  ];
}

/* ---- Report ---- */
function report() {
  const L = [], st = (s) => { const c = stepScore(s); return state.chk[s] ? `(проверка: верно ${c.ok} из ${c.total})` : '(не проверено)'; };
  L.push('# Практическое занятие 2. Канбан-доска отдела операций маркетплейса (кейс «Витрина»)', '');
  L.push(`## 1. Доска ${st(1)}`, '', 'Столбцы:', ...state.cols.map((k, i) => `${i + 1}. ${colName(k)}${k !== 'done' ? ` — выход: ${state.exits[k] || '—'}` : ''}`));
  L.push('', `Дорожки: ${(LANES.find((x) => x[0] === state.lanes) || ['', '—'])[1]}`, `Путь сбоя: ${state.inc.map(colName).join(' → ') || '—'}`, '');
  L.push(`## 2. Классы обслуживания ${st(2)}`, '', '| Тип работы | Класс |', '|---|---|', ...TYPES.map((t) => `| ${t.n} | ${(CLASSES.find((c) => c.k === state.cls[t.k]) || { n: '—' }).n} |`), '');
  L.push('| Класс | Комитет | Прерывает | Обещание | Кто ставит |', '|---|---|---|---|---|', ...CLASSES.map((c) => { const r = state.rules[c.k], o = (f) => (RULE_OPTS[f].find((x) => x[0] === r[f]) || ['', '—'])[1]; return `| ${c.n} | ${o('cab')} | ${o('stop')} | ${o('pr')} | ${r.who || '—'} |`; }), '');
  L.push(`Запрос в пятницу: комитет на ${state.n.fri_day || '—'}-й день срока, на работу остаётся ${state.n.fri_left || '—'} дн.`, '');
  L.push(`## 3. Лимиты WIP ${st(3)}`, '', `Поступление в неделю: ${state.n.arr || '—'}. Ёмкость: ${state.n.cap || '—'} человеко-дней. Запросов в день: ${state.n.perday || '—'}; по закону Литтла на 5 дней — ${state.n.sys5 || '—'}, на 4 дня — ${state.n.sys4 || '—'}.`, '');
  L.push('| Дорожка | Лимит | Обоснование |', '|---|---|---|', ...CLASSES.map((c) => `| ${c.n} | ${state.lim[c.k] || '—'} | ${state.why[c.k] || '—'} |`), '', `Если сбой сверх лимита: ${(OVER.find((x) => x[0] === state.over) || ['', '—'])[1]}`, '');
  const i = state.imp, pk = (list, v) => (list.find((x) => x[0] === v) || ['', '—'])[1];
  L.push(`## 4. Улучшения ${st(4)}`, '', `Доля ёмкости: ${i.share ? i.share + '%' : '—'} = ${i.days || '—'} человеко-дней в неделю. Механизм: ${pk(MECH, i.mech)}. Минимум в работе: ${i.n || '—'}. Владелец: ${pk(OWNER, i.owner)}. Метрика: ${pk(METRIC, i.metric)}. При вытеснении: ${pk(DISPL, i.displ)}.`, '', `Правило: ${i.text || '—'}`, '');
  L.push(`## 5. С 18-й недели ${st(5)}`, '', `Специалистов: ${state.n.e18 || '—'}. Ёмкость: ${state.n.cap18 || '—'} человеко-дней, снижение ${state.n.drop || '—'}%. На специалиста: ${state.n.loadB || '—'} → ${state.n.loadA || '—'} работ в неделю. Время выполнения ×${state.n.factor || '—'}: запрос продавца ${state.n.t75 || '—'} дн.`, '');
  L.push('| Дорожка | Было | С 18-й недели |', '|---|---|---|', ...CLASSES.map((c) => `| ${c.n} | ${state.lim[c.k] || '—'} | ${state.lim18[c.k] || '—'} |`), '', 'Изменения:', ...DEC18.filter((d) => state.dec18.includes(d[0])).map((d) => `- ${d[1]}`), '');
  L.push('## Итог для защиты', '', `1. ${state.final.p1 || '—'}`, `2. ${state.final.p2 || '—'}`, `3. ${state.final.p3 || '—'}`);
  return L.join('\n');
}
async function copyText(t, btn) {
  try { await navigator.clipboard.writeText(t); if (btn) { const o = btn.textContent; btn.textContent = 'Скопировано'; setTimeout(() => (btn.textContent = o), 1600); } }
  catch (e) { const s = $('#rep-status'); if (s) s.textContent = 'Браузер не дал скопировать. Попробуйте кнопку «Скачать отчёт».'; }
}
async function saveReport() {
  try { await state.downloads.save({ filename: 'praktikum-2-kanban-doska.md', data: report() }); }
  catch (e) { const s = $('#rep-status'); if (s && e && e.code !== 'declined') s.textContent = 'Файл не сохранён. Скопируйте отчёт кнопкой рядом.'; }
}

/* ---- Rail ---- */
const GOALS = ['Спроектировали доску', 'Назначили классы и правила', 'Обосновали лимиты числами', 'Защитили улучшения правилом', 'Перестроили систему к 18-й неделе'];
function renderRail() {
  const kids = [h('div', { class: 'rail-sec' }, h('h3', { text: 'Пункты задания' }), ...GOALS.map((t, i) => h('div', { class: 'goal' + (stepDone(i + 1) ? ' on' : '') }, h('span', { class: 'dot' }), h('span', { text: t }))))];
  const tip = railTip();
  if (tip) kids.push(h('div', { class: 'rail-sec tip' }, h('h4', { text: 'Коуч' }), h('p', { text: tip.b }), tip.q ? h('p', { class: 'q', text: tip.q }) : null));
  kids.push(h('div', { class: 'rail-sec' }, h('h4', { text: 'Опорные числа кейса' }),
    h('p', { class: 'legend', text: '12 специалистов · 5 рабочих дней · 60 человеко-дней · релизный комитет по четвергам · запрос продавца — 5 рабочих дней · сбой — реакция 30 минут · с 18-й недели — 8 специалистов' })));
  $('#rail').replaceChildren(...kids);
}
function railTip() {
  const s = state.step;
  if (s === 0) return { b: 'Прочитайте Приложение 4 и запишите прогноз. Потом будет с чем сравнить.', q: 'Какая особенность в таблице сильнее всего влияет на устройство доски?' };
  const c = stepScore(s);
  if (!state.chk[s]) return { b: 'Решите сами, затем нажмите «Проверить». Формулы и подсказки — прямо под вопросами.' };
  if (c.ok < c.total) return { b: 'Проверка показала, где ошибка. Под каждой красной отметкой — подсказка, как исправить.', q: state.chk[s] >= 2 ? 'Ответ можно открыть кнопкой «Показать ответ», но сначала попробуйте ещё раз.' : null };
  return [null,
    { b: 'Доска готова. На следующем шаге дорожки получат классы.', q: 'Что будет с запросом продавца, если ожидание четверга не видно на доске?' },
    { b: 'Классы назначены. Заметили, что запрос продавца не успевает пройти релизный комитет?', q: 'Какие запросы продавцов можно считать типовыми?' },
    { b: 'Лимиты обоснованы. Сравните сумму лимитов с числом специалистов.', q: 'Что произойдёт с лимитами, когда специалистов станет 8?' },
    { b: 'Правило измеримо. Его владелец может проверять его каждую неделю.', q: 'Как правило поможет восьми специалистам после 18-й недели?' },
    { b: 'Система перестроена. Соберите три фразы итога и скопируйте отчёт для защиты.' }][s];
}

/* ================= Boot ================= */
function buildRuler() {
  const r = $('#ruler'); if (!r) return;
  for (let w = 1; w <= 35; w++) {
    const cls = [w === 1 ? 'mk now' : '', w === 18 ? 'mk leave' : '', w === 35 ? 'mk launch' : '', w > 18 && w < 35 ? 'after' : '', (w - 1) % 5 === 0 && ![1, 16, 31].includes(w) ? 'wk' : ''].join(' ').trim();
    const lab = w === 1 ? 'сейчас: неделя 1' : w === 18 ? 'неделя 18: −4 специалиста' : w === 35 ? 'запуск «Доставки еды», неделя 35' : null;
    const short = w === 1 ? 'н.1' : w === 18 ? 'н.18' : w === 35 ? 'н.35' : null;
    r.append(h('span', { class: cls, 'data-lab': lab, 'data-short': short, 'data-wk': (w - 1) % 5 === 0 ? `н.${w}` : null, title: `Неделя ${w}${lab ? ': ' + lab : ''}` }));
  }
}
function boot() {
  buildRuler(); render();
  (async () => { try { if (window.claude && window.claude.use) { state.downloads = await window.claude.use('downloads'); render(); } } catch (e) { /* downloads not available */ } })();
}
boot();

</script>
