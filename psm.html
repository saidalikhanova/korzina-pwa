<title>Подготовка к PSM I — Scrum Way</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
/* Layout: the same control desk as the other practicums. A dark band carries the title, the three stages
   (mode, questions, result) and, during the exam, the clock. Below: the question sheet beside a progress rail.
   Signal orange is reserved for the exam clock running out and for the pass threshold line. */
:root {
  --paper: #E6E8E3;
  --sheet: #FBFBF9;
  --sheet-2: #F0F1ED;
  --ink: #1D2026;
  --ink-2: #5A6068;
  --rule: #D3D6CF;
  --rule-2: #B4B9B0;
  --band: #20242B;
  --band-ink: #E9EBE6;
  --band-ink-2: #9AA1AB;
  --signal: #F2551D;
  --signal-tint: #FDE3D8;
  --cobalt: #2D4FE3;
  --cobalt-tint: #E2E7FC;
  --amber: #D9960B;
  --violet: #7650C4;
  --green: #2D8A57;
  --ok: #23804A; --ok-tint: #DDF0E3;
  --warn: #9A6400; --warn-tint: #F8ECCB;
  --bad: #C42B2B; --bad-tint: #F8DEDC;
  --on-fill: #FFFFFF;
  --font-display: "Dela Gothic One", "Golos Text", system-ui, sans-serif;
  --font-body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #14161A; --sheet: #1D2026; --sheet-2: #252930; --ink: #ECEDE9; --ink-2: #A2A8B0; --rule: #333840; --rule-2: #4A5059;
    --band: #0C0E11; --band-ink: #ECEDE9; --band-ink-2: #8E959F;
    --signal: #FF7341; --signal-tint: #44231A; --cobalt: #8EA4FF; --cobalt-tint: #232C52; --amber: #F2B84B; --violet: #B79BF0; --green: #6CCB93;
    --ok: #6CCB93; --ok-tint: #173323; --warn: #F2C14E; --warn-tint: #3A2D0E; --bad: #FF8A80; --bad-tint: #401A18;
    --on-fill: #14161A; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #14161A; --sheet: #1D2026; --sheet-2: #252930; --ink: #ECEDE9; --ink-2: #A2A8B0; --rule: #333840; --rule-2: #4A5059;
  --band: #0C0E11; --band-ink: #ECEDE9; --band-ink-2: #8E959F;
  --signal: #FF7341; --signal-tint: #44231A; --cobalt: #8EA4FF; --cobalt-tint: #232C52; --amber: #F2B84B; --violet: #B79BF0; --green: #6CCB93;
  --ok: #6CCB93; --ok-tint: #173323; --warn: #F2C14E; --warn-tint: #3A2D0E; --bad: #FF8A80; --bad-tint: #401A18;
  --on-fill: #14161A; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; padding-inline: 16px; padding-block: 0 56px; font-variant-numeric: tabular-nums; margin: 0; }
.wrap { max-width: 1320px; margin-inline: auto; }
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2.5px solid var(--cobalt); outline-offset: 2px; }
.mono { font-variant-numeric: tabular-nums; }

/* ---------- Control band ---------- */
.band { background: var(--band); color: var(--band-ink); margin-inline: -16px; padding-inline: 16px; padding-block: 26px 0; }
.band-top { display: flex; flex-wrap: wrap; gap: 14px 40px; align-items: end; justify-content: space-between; }
.brand { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.brand h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(26px, 4vw, 40px); line-height: 1; letter-spacing: -0.01em; }
.brand p { color: var(--band-ink-2); max-width: 62ch; font-size: 14.5px; }
.casetag { font-size: 13px; color: var(--band-ink-2); border: 1px solid #454b55; border-radius: 999px; padding: 4px 12px; white-space: nowrap; }
.band-meta { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.clock { font-family: var(--font-display); font-size: 26px; line-height: 1; color: var(--band-ink); padding: 6px 14px; border-radius: 10px; background: #2b3038; }
.clock.low { color: var(--signal); background: rgba(242, 85, 29, .18); }
.clock small { font-family: var(--font-body); font-size: 12px; color: var(--band-ink-2); display: block; margin-top: 4px; }

/* Ruler: 80 question marks, filled as answered */
.ruler { margin-top: 22px; display: grid; grid-template-columns: repeat(var(--cols, 40), minmax(0, 1fr)); gap: 3px; align-items: end; height: 20px; }
.ruler span { height: 10px; border-radius: 3px; background: #343a44; }
.ruler span.done { background: var(--band-ink-2); }
.ruler span.ok { background: var(--green); }
.ruler span.bad { background: var(--signal); }
.ruler span.now { outline: 2px solid var(--band-ink); outline-offset: 2px; }
@media (max-width: 640px) { .ruler { grid-template-columns: repeat(20, minmax(0, 1fr)); } .ruler span:nth-child(n+21) { display: none; } }

.steps { position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding-block: 22px 24px; border-top: 1px solid #3a4049; margin-top: 16px; }
.steps::before { content: ""; position: absolute; left: 14px; right: 14px; top: 36px; height: 3px; background: #3e444e; border-radius: 3px; }
.step { appearance: none; position: relative; text-align: left; cursor: pointer; border: 0; background: transparent; color: var(--band-ink); padding: 0 10px 0 0; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.step .dot { width: 31px; height: 31px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; background: var(--band); border: 3px solid #5b626d; color: var(--band-ink-2); position: relative; z-index: 1; }
.step .t { font-weight: 600; font-size: 14px; line-height: 1.25; }
.step .s { font-size: 12.5px; color: var(--band-ink-2); line-height: 1.3; }
.step:hover .dot { border-color: var(--band-ink); }
.step.done .dot { background: var(--green); border-color: var(--green); color: var(--band); }
.step[aria-current="step"] .dot { background: var(--signal); border-color: var(--signal); color: var(--band); box-shadow: 0 0 0 5px rgba(242, 85, 29, .25); }
.step.locked { cursor: not-allowed; }
.step.locked .dot { border-style: dashed; }
.step.locked .t, .step.locked .s { color: #6d7480; }
@media (max-width: 860px) { .step .s { display: none; } .step .t { font-size: 12px; } }
@media (max-width: 520px) { .step .t { display: none; } }

/* ---------- Working area ---------- */
.workspace { display: grid; gap: 22px; grid-template-columns: minmax(0, 1fr); align-items: start; padding-top: 24px; }
@media (min-width: 1100px) { .workspace { grid-template-columns: minmax(0, 1fr) 320px; } }
.panel { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.card { background: var(--sheet); border-radius: 16px; padding: 22px 24px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card > h3, .sec-h { font-family: var(--font-display); font-weight: 400; font-size: 19px; line-height: 1.2; letter-spacing: -0.005em; }
.lead { color: var(--ink-2); max-width: 72ch; }
.lbl { font-size: 13px; color: var(--ink-2); font-weight: 600; }
.grid2 { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 820px) { .grid2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
@media (max-width: 600px) { .card { padding: 18px 16px; border-radius: 12px; } }

.btn { appearance: none; cursor: pointer; border: 1.5px solid var(--ink); background: transparent; border-radius: 999px; padding: 8px 18px; font-weight: 600; line-height: 1.2; color: var(--ink); }
.btn:hover { background: var(--sheet-2); }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.btn-primary { background: var(--ink); color: var(--sheet); }
.btn-primary:hover { background: var(--ink); filter: brightness(1.25); }
.btn-small { padding: 5px 13px; font-size: 13px; border-width: 1px; border-color: var(--rule-2); font-weight: 500; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.status { min-height: 20px; font-size: 13.5px; color: var(--ink-2); }
.status.err { color: var(--bad); }

textarea, input[type="text"], input[type="number"], select { width: 100%; border: 1.5px solid var(--rule); background: var(--sheet); border-radius: 10px; padding: 9px 12px; }
textarea:hover, input:hover, select:hover { border-color: var(--rule-2); }
textarea { resize: vertical; line-height: 1.55; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.help { font-size: 13px; color: var(--ink-2); }
details > summary { cursor: pointer; color: var(--ink-2); font-size: 13.5px; }

/* Mode cards */
.modes { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 720px) { .modes { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.mode { position: relative; display: flex; flex-direction: column; gap: 10px; padding: 20px 22px; border-radius: 14px; background: var(--sheet-2); border: 1.5px solid transparent; }
.mode h4 { font-family: var(--font-display); font-weight: 400; font-size: 20px; }
.mode .facts { display: flex; flex-wrap: wrap; gap: 6px; }
.mode.exam { border-color: var(--rule-2); }
.fact { font-size: 12.5px; padding: 2px 10px; border-radius: 999px; background: var(--sheet); color: var(--ink-2); }
.tagline { display: flex; flex-wrap: wrap; gap: 6px; }
.tagpill { font-size: 12.5px; padding: 3px 10px; border-radius: 999px; background: var(--sheet-2); color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; }
.tagpill b { color: var(--ink); font-weight: 600; }

/* Question */
.q-meta { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 13px; color: var(--ink-2); }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; padding: 2px 10px 2px 8px; border-radius: 999px; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.ok { color: var(--ok); background: var(--ok-tint); }
.pill.warn { color: var(--warn); background: var(--warn-tint); }
.pill.bad { color: var(--bad); background: var(--bad-tint); }
.pill.bad::before { border-radius: 1px; transform: rotate(45deg); }
.pill.info { color: var(--ink-2); background: var(--sheet-2); }
.pill.topic { color: var(--cobalt); background: var(--cobalt-tint); }
.q-text { font-size: 18px; font-weight: 500; line-height: 1.45; }
.multi-note { font-size: 13px; color: var(--signal); font-weight: 600; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { display: flex; gap: 12px; align-items: flex-start; padding: 11px 14px; border: 1.5px solid var(--rule); border-radius: 12px; cursor: pointer; background: var(--sheet); text-align: left; width: 100%; line-height: 1.45; }
.opt:hover { border-color: var(--rule-2); background: var(--sheet-2); }
.opt .let { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 12.5px; font-weight: 700; border: 1.5px solid var(--rule-2); color: var(--ink-2); margin-top: 1px; }
.opt.sel { border-color: var(--ink); }
.opt.sel .let { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.opt.right { border-color: var(--ok); background: var(--ok-tint); }
.opt.right .let { background: var(--ok); color: var(--on-fill); border-color: var(--ok); }
.opt.wrong { border-color: var(--bad); background: var(--bad-tint); }
.opt.wrong .let { background: var(--bad); color: var(--on-fill); border-color: var(--bad); }
.opt.miss { border-color: var(--ok); border-style: dashed; }
.opt[disabled] { cursor: default; }
.opt[disabled]:hover { background: inherit; }
.opt.right[disabled]:hover { background: var(--ok-tint); } .opt.wrong[disabled]:hover { background: var(--bad-tint); }
.multi .opt .let { border-radius: 7px; }
.explain { padding: 14px 16px; background: var(--cobalt-tint); border-radius: 4px 14px 14px 14px; display: flex; flex-direction: column; gap: 6px; }
.explain .ref { font-size: 13px; color: var(--ink-2); }
.explain b { font-family: var(--font-display); font-weight: 400; font-size: 15px; }
.nav { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }

/* Result */
.bigline { display: flex; flex-wrap: wrap; gap: 6px 22px; align-items: baseline; }
.bignum { font-family: var(--font-display); font-size: 44px; line-height: 1.1; }
.bignum.bad { color: var(--signal); } .bignum.ok { color: var(--ok); }
.compare { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
.stat { padding: 12px 14px; background: var(--sheet-2); border-radius: 10px; display: flex; flex-direction: column; gap: 2px; }
.stat b { font-family: var(--font-display); font-weight: 400; font-size: 24px; line-height: 1.15; }
.stat.hot b { color: var(--signal); }
.topics { display: flex; flex-direction: column; gap: 12px; }
.topic-row { display: grid; gap: 4px 14px; grid-template-columns: minmax(0, 1fr) 64px; align-items: center; }
.topic-row .bar { grid-column: 1; height: 12px; border-radius: 999px; background: var(--rule); position: relative; overflow: hidden; }
.topic-row .bar i { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: var(--ok); }
.topic-row .bar i.warn { background: var(--amber); } .topic-row .bar i.bad { background: var(--bad); }
.topic-row .bar::after { content: ""; position: absolute; top: -2px; bottom: -2px; left: 85%; width: 2px; background: var(--signal); }
.topic-row .pct { grid-column: 2; grid-row: 1 / span 2; font-family: var(--font-display); font-size: 20px; text-align: right; }
.topic-row .nm { font-weight: 600; font-size: 14px; }
.topic-row .adv { grid-column: 1 / span 2; font-size: 13px; color: var(--ink-2); }
.review { display: flex; flex-direction: column; gap: 12px; }
.rv { padding: 14px 16px; border-radius: 12px; background: var(--sheet-2); display: flex; flex-direction: column; gap: 8px; border-left: 4px solid var(--bad); }
.rv.ok { border-left-color: var(--ok); }
.rv .q { font-weight: 500; }
.rv .a { font-size: 14px; }
.rv .a span { color: var(--ink-2); }
.note { font-size: 13px; color: var(--ink-2); border-left: 3px solid var(--rule-2); padding-left: 10px; }

/* ---------- Rail ---------- */
.rail { background: var(--sheet); border-radius: 16px; display: flex; flex-direction: column; min-width: 0; border-top: 6px solid var(--band); }
@media (min-width: 1100px) { .rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 14px); max-height: calc(100vh - 28px); overflow: auto; } }
.rail-sec { padding: 16px 18px; border-bottom: 1px solid var(--rule); display: flex; flex-direction: column; gap: 10px; }
.rail-sec:last-child { border-bottom: 0; }
.rail h3 { font-family: var(--font-display); font-weight: 400; font-size: 16px; }
.rail h4 { font-size: 13px; color: var(--ink-2); font-weight: 600; }
.goal { display: flex; gap: 10px; align-items: baseline; font-size: 14px; }
.goal .dot { flex: none; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--rule-2); transform: translateY(1px); }
.goal.on .dot { background: var(--green); border-color: var(--green); }
.meter { display: flex; gap: 4px; }
.meter i { flex: 1; height: 10px; border-radius: 999px; background: var(--rule); }
.meter i.ok { background: var(--ok); } .meter i.warn { background: var(--amber); } .meter i.bad { background: var(--bad); }
.attempts { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.attempt { display: flex; gap: 8px; justify-content: space-between; padding: 6px 10px; background: var(--sheet-2); border-radius: 8px; }
.tip { font-size: 14px; background: var(--cobalt-tint); }
.tip .q { color: var(--ink-2); font-style: italic; }
.empty { padding: 26px 18px; text-align: center; color: var(--ink-2); border: 2px dashed var(--rule-2); border-radius: 14px; }
.qgrid { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; }
.qgrid button { appearance: none; border: 1px solid var(--rule); background: var(--sheet-2); border-radius: 6px; font-size: 11px; padding: 4px 0; cursor: pointer; color: var(--ink-2); }
.qgrid button.done { background: var(--rule-2); color: var(--ink); }
.qgrid button.ok { background: var(--ok-tint); color: var(--ok); border-color: var(--ok); }
.qgrid button.bad { background: var(--bad-tint); color: var(--bad); border-color: var(--bad); }
.qgrid button.now { outline: 2px solid var(--ink); outline-offset: 1px; }
.custom-list { display: flex; flex-direction: column; gap: 8px; }
.custom-item { display: flex; gap: 10px; justify-content: space-between; align-items: flex-start; padding: 10px 12px; background: var(--sheet-2); border-radius: 10px; font-size: 13.5px; }
.chk-row { display: flex; gap: 8px; align-items: center; }
.chk-row input { accent-color: var(--signal); margin: 0; }
.optfield { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 8px; align-items: center; }
.optfield label { display: grid; place-items: center; }
@media (prefers-reduced-motion: no-preference) { .btn, .step .dot, .opt { transition: background-color .15s ease, border-color .15s ease, box-shadow .15s ease; } }
</style>

<header class="band">
  <div class="wrap">
    <div class="band-top">
      <div class="brand">
        <h1>Подготовка к PSM I</h1>
        <p>Практикум 0: тренажёр экзамена Scrum.org. 80 вопросов за 60 минут, проходной балл 85 %. Вопросы сценарные, как на реальном экзамене.</p>
      </div>
      <div class="band-meta" id="band-meta"></div>
    </div>
    <div class="ruler" id="ruler" aria-hidden="true"></div>

  </div>
</header>

<div class="wrap">
  <div class="workspace">
    <main class="panel" id="main"></main>
    <aside class="rail" id="rail" aria-label="Прогресс"></aside>
  </div>
</div>

<script>
/* ================= Банк вопросов ================= */
/* tag: T теория и ценности, K Scrum-команда, E события, A артефакты и обязательства, S масштабирование, F самоуправление и фокус */
const TAGS = {
  T: { n: 'Теория и ценности Scrum', read: '«Определение Scrum», «Теория Scrum», «Ценности Scrum»' },
  K: { n: 'Scrum-команда', read: '«Scrum-команда», «Разработчики», «Владелец Продукта», «Scrum-мастер»' },
  E: { n: 'События', read: '«События Scrum», «Спринт», «Планирование Спринта», «Ежедневный Скрам», «Обзор Спринта», «Ретроспектива Спринта»' },
  A: { n: 'Артефакты и обязательства', read: '«Артефакты Scrum», «Бэклог Продукта», «Бэклог Спринта», «Инкремент» и три обязательства' },
  S: { n: 'Масштабирование и несколько команд', read: '«Владелец Продукта», «Бэклог Продукта», «Инкремент», «Обязательство: Определение Готовности»' },
  F: { n: 'Самоуправление и фокус', read: '«Scrum-команда», «Разработчики», «Бэклог Спринта», «Ежедневный Скрам», «Заключительное слово»' }
};
const QUESTIONS = [
  /* ---- Банк первой версии тренажёра (20), формулировки отредактированы ---- */
  { tag: 'A', text: 'Кто несёт ответственность за управление Бэклогом Продукта?',
    options: ['Scrum-мастер', 'Разработчики', 'Владелец Продукта', 'Вся Scrum-команда поровну'], correct: 2,
    explanation: 'Владелец Продукта отвечает за управление Бэклогом Продукта: его содержимое, упорядочивание и прозрачность. Он может делегировать часть работы другим, но ответственность остаётся за ним.',
    ref: 'Scrum Guide 2020, раздел «Владелец Продукта»' },
  { tag: 'E', text: 'Какова максимальная длительность Спринта?',
    options: ['2 недели', '3 недели', '1 месяц', '6 недель'], correct: 2,
    explanation: 'Спринт — контейнер для всех остальных событий, его длительность не более одного месяца. Чем длиннее Спринт, тем выше риск, что Цель Спринта устареет, и тем ниже предсказуемость.',
    ref: 'Scrum Guide 2020, раздел «Спринт»' },
  { tag: 'T', text: 'Каковы три столпа эмпиризма, на которых построен Scrum?',
    options: ['Планирование, исполнение, контроль', 'Прозрачность, инспекция, адаптация', 'Коммуникация, сотрудничество, доверие', 'Роли, события, артефакты'], correct: 1,
    explanation: 'Scrum основан на эмпиризме: знание берётся из опыта, а решения принимаются по наблюдаемым фактам. Три столпа — прозрачность, инспекция и адаптация. Без прозрачности инспекция вводит в заблуждение, без адаптации инспекция бессмысленна.',
    ref: 'Scrum Guide 2020, раздел «Теория Scrum»' },
  { tag: 'E', text: 'Каков таймбокс Ежедневного Скрама?',
    options: ['5 минут', '15 минут', '30 минут', 'Зависит от длины Спринта'], correct: 1,
    explanation: 'Ежедневный Скрам — событие Разработчиков длительностью 15 минут, в одно и то же время и в одном месте каждый рабочий день Спринта. В отличие от других событий, его длина не зависит от длины Спринта.',
    ref: 'Scrum Guide 2020, раздел «Ежедневный Скрам»' },
  { tag: 'E', text: 'Кто может отменить Спринт?',
    options: ['Scrum-мастер', 'Разработчики', 'Владелец Продукта', 'Любой член Scrum-команды'], correct: 2,
    explanation: 'Спринт можно отменить, если Цель Спринта потеряла смысл. Полномочия отменить Спринт есть только у Владельца Продукта.',
    ref: 'Scrum Guide 2020, раздел «Спринт»' },
  { tag: 'E', text: 'Каков таймбокс Планирования Спринта для Спринта длиной один месяц?',
    options: ['2 часа', '4 часа', '6 часов', '8 часов'], correct: 3,
    explanation: 'Планирование Спринта ограничено восемью часами для месячного Спринта. Для более коротких Спринтов событие обычно короче.',
    ref: 'Scrum Guide 2020, раздел «Планирование Спринта»' },
  { tag: 'K', text: 'Какой размер Scrum-команды рекомендует Scrum Guide?',
    options: ['3–5 человек', '5–9 человек', '10 человек или меньше', 'Размер не ограничен'], correct: 2,
    explanation: 'Scrum-команда обычно состоит из 10 человек или меньше: достаточно мала, чтобы оставаться гибкой, и достаточно велика, чтобы делать значимую работу за Спринт. Формулировка «7 ± 2» в Scrum Guide 2020 отсутствует.',
    ref: 'Scrum Guide 2020, раздел «Scrum-команда»' },
  { tag: 'A', text: 'Что такое Определение Готовности?',
    options: ['Критерии приёмки конкретного элемента Бэклога Продукта', 'Формальное описание состояния Инкремента, при котором он соответствует требованиям к качеству продукта', 'Критерии завершения Спринта', 'Список задач, которые Разработчики обязались выполнить'], correct: 1,
    explanation: 'Определение Готовности — формальное описание состояния Инкремента, при котором он соответствует мерам качества продукта. Пока элемент Бэклога Продукта не соответствует Определению Готовности, он не является частью Инкремента.',
    ref: 'Scrum Guide 2020, раздел «Обязательство: Определение Готовности»' },
  { tag: 'T', text: 'Каковы пять ценностей Scrum?',
    options: ['Честность, целостность, уважение, фокус, смелость', 'Обязательство, фокус, открытость, уважение, смелость', 'Прозрачность, инспекция, адаптация, фокус, смелость', 'Коммуникация, сотрудничество, фокус, уважение, обязательство'], correct: 1,
    explanation: 'Пять ценностей Scrum: обязательство, фокус, открытость, уважение и смелость. Когда команда живёт этими ценностями, столпы прозрачности, инспекции и адаптации оживают и формируют доверие.',
    ref: 'Scrum Guide 2020, раздел «Ценности Scrum»' },
  { tag: 'E', text: 'Какова цель Обзора Спринта?',
    options: ['Спланировать следующий Спринт', 'Проинспектировать результат Спринта и определить будущие адаптации', 'Проанализировать процессы и взаимодействие в команде', 'Провести демонстрацию и принять работу у Разработчиков'], correct: 1,
    explanation: 'Обзор Спринта нужен, чтобы проинспектировать результат Спринта и определить будущие адаптации. Scrum-команда и стейкхолдеры обсуждают сделанное и изменения в окружении, по итогам может быть скорректирован Бэклог Продукта. Это не приёмка и не демонстрация.',
    ref: 'Scrum Guide 2020, раздел «Обзор Спринта»' },
  { tag: 'A', text: 'Из чего состоит Бэклог Спринта?',
    options: ['Только из выбранных элементов Бэклога Продукта', 'Из Цели Спринта, выбранных элементов Бэклога Продукта и плана поставки Инкремента', 'Из всех задач, необходимых для завершения проекта', 'Из выбранных элементов Бэклога Продукта и их оценок'], correct: 1,
    explanation: 'Бэклог Спринта состоит из Цели Спринта (зачем), выбранных элементов Бэклога Продукта (что) и плана поставки Инкремента (как). Это план Разработчиков и для Разработчиков.',
    ref: 'Scrum Guide 2020, раздел «Бэклог Спринта»' },
  { tag: 'K', text: 'Кому принадлежит Бэклог Спринта и кто его формирует?',
    options: ['Владельцу Продукта', 'Scrum-мастеру', 'Разработчикам', 'Стейкхолдерам'], correct: 2,
    explanation: 'Бэклог Спринта создают Разработчики на Планировании Спринта и уточняют в ходе Спринта. Только они решают, как превратить выбранные элементы в Инкремент.',
    ref: 'Scrum Guide 2020, разделы «Бэклог Спринта», «Разработчики»' },
  { tag: 'A', text: 'Что такое Инкремент?',
    options: ['Сумма всех выполненных за Спринт задач', 'Конкретный шаг к Цели Продукта, пригодный к использованию и соответствующий Определению Готовности', 'Скорость команды за Спринт', 'Отчёт о прогрессе для стейкхолдеров'], correct: 1,
    explanation: 'Инкремент — конкретная ступень к Цели Продукта. Каждый Инкремент дополняет предыдущие и проверяется вместе с ними. Чтобы приносить ценность, Инкремент должен быть пригоден к использованию, то есть соответствовать Определению Готовности.',
    ref: 'Scrum Guide 2020, раздел «Инкремент»' },
  { tag: 'K', text: 'Кто отвечает за эффективность Scrum-команды?',
    options: ['Владелец Продукта', 'Разработчики', 'Scrum-мастер', 'Руководитель подразделения'], correct: 2,
    explanation: 'Scrum-мастер отвечает за эффективность Scrum-команды: помогает ей улучшать практики в рамках Scrum, устраняет препятствия и следит, чтобы события проходили продуктивно и в рамках таймбокса.',
    ref: 'Scrum Guide 2020, раздел «Scrum-мастер»' },
  { tag: 'E', text: 'Когда заканчивается Спринт?',
    options: ['Когда все элементы Бэклога Спринта выполнены', 'Когда истекает таймбокс', 'Когда достигнута Цель Спринта', 'Когда Владелец Продукта принимает Инкремент'], correct: 1,
    explanation: 'Спринт имеет фиксированную длительность и заканчивается по истечении таймбокса. Новый Спринт начинается сразу после завершения предыдущего. Досрочно завершить Спринт нельзя, его можно только отменить решением Владельца Продукта.',
    ref: 'Scrum Guide 2020, раздел «Спринт»' },
  { tag: 'E', text: 'Какова цель Ежедневного Скрама?',
    options: ['Отчитаться о прогрессе перед Scrum-мастером', 'Проинспектировать прогресс к Цели Спринта и при необходимости адаптировать Бэклог Спринта', 'Синхронизировать работу со стейкхолдерами', 'Обновить диаграмму сгорания'], correct: 1,
    explanation: 'Ежедневный Скрам проводится, чтобы проинспектировать прогресс к Цели Спринта и адаптировать Бэклог Спринта, скорректировав план на следующий день. Формат выбирают сами Разработчики.',
    ref: 'Scrum Guide 2020, раздел «Ежедневный Скрам»' },
  { tag: 'E', text: 'Кто участвует в Обзоре Спринта?',
    options: ['Только Scrum-команда', 'Scrum-команда и ключевые стейкхолдеры', 'Вся организация', 'Только Владелец Продукта и стейкхолдеры'], correct: 1,
    explanation: 'Обзор Спринта — рабочая сессия Scrum-команды и ключевых стейкхолдеров. Вместе они обсуждают результаты Спринта, прогресс к Цели Продукта и то, что делать дальше.',
    ref: 'Scrum Guide 2020, раздел «Обзор Спринта»' },
  { tag: 'K', text: 'Как Scrum-мастер служит Владельцу Продукта?',
    options: ['Пишет элементы Бэклога Продукта и оценивает их', 'Помогает находить техники определения Цели Продукта и управления Бэклогом Продукта, содействует взаимодействию со стейкхолдерами', 'Упорядочивает Бэклог Продукта вместо него', 'Принимает решение о выпуске Инкремента'], correct: 1,
    explanation: 'Scrum-мастер помогает Владельцу Продукта находить техники эффективного определения Цели Продукта и управления Бэклогом Продукта, помогает команде понимать потребность в ясных элементах Бэклога и содействует сотрудничеству со стейкхолдерами по запросу.',
    ref: 'Scrum Guide 2020, раздел «Scrum-мастер»' },
  { tag: 'A', text: 'Какое обязательство связано с Бэклогом Продукта?',
    options: ['Цель Спринта', 'Цель Продукта', 'Определение Готовности', 'Критерии приёмки'], correct: 1,
    explanation: 'У каждого артефакта своё обязательство: Бэклог Продукта — Цель Продукта, Бэклог Спринта — Цель Спринта, Инкремент — Определение Готовности. Обязательства повышают прозрачность и фокус.',
    ref: 'Scrum Guide 2020, раздел «Артефакты Scrum»' },
  { tag: 'E', text: 'Каков таймбокс Ретроспективы Спринта для Спринта длиной один месяц?',
    options: ['1 час', '2 часа', '3 часа', '4 часа'], correct: 2,
    explanation: 'Ретроспектива Спринта ограничена тремя часами для месячного Спринта и обычно короче для коротких Спринтов. Это последнее событие Спринта.',
    ref: 'Scrum Guide 2020, раздел «Ретроспектива Спринта»' },

  /* ---- Из авторских разборов, видео 11–30 ---- */
  { tag: 'K', text: 'В Scrum-команде 14 человек, и руководство предлагает добавить ещё троих, «чтобы быстрее закрыть Бэклог Продукта». Что ближе всего к позиции Scrum Guide?',
    options: ['Чем больше людей, тем быстрее результат: добавить', 'Оптимально 7 ± 2 человека, поэтому команду нужно сократить ровно до девяти', 'Команда обычно состоит из 10 человек или меньше; если людей больше, стоит переформировать её в несколько сплочённых команд на один продукт', 'Размер команды определяет Scrum-мастер по своему усмотрению'], correct: 2,
    explanation: 'Рост команды растит число связей и согласований, а не результат. Scrum Guide говорит о 10 человеках или меньше; если команда больше, её переформируют в несколько Scrum-команд, работающих над одним продуктом с общей Целью Продукта, Бэклогом и Владельцем Продукта. «7 ± 2» — формулировка из устаревших материалов.',
    ref: 'Scrum Guide 2020, раздел «Scrum-команда»' },
  { tag: 'K', text: 'Из чего состоит Scrum-команда согласно Scrum Guide 2020?',
    options: ['Из Владельца Продукта, Scrum-мастера и команды разработки как отдельной подкоманды', 'Из трёх ролей: менеджер проекта, аналитик, тестировщики', 'Из трёх подотчётностей — Владелец Продукта, Scrum-мастер и Разработчики — без подкоманд и иерархий', 'Из Владельца Продукта и Разработчиков; Scrum-мастер — внешний консультант'], correct: 2,
    explanation: 'В Scrum Guide 2020 слово «роли» заменено на «подотчётности», а идея «команда разработки внутри команды» убрана. Scrum-команда — единое целое из Владельца Продукта, Scrum-мастера и Разработчиков, без подкоманд и начальников внутри.',
    ref: 'Scrum Guide 2020, раздел «Scrum-команда»' },
  { tag: 'A', text: 'Новая Scrum-команда спорит, кто должен написать Определение Готовности. Что соответствует Scrum Guide?',
    options: ['Пишет Владелец Продукта, потому что он принимает работу', 'Задаёт Scrum-мастер как хранитель процесса', 'Если в организации есть стандарт готовности, команда следует ему как минимуму; если нет, Scrum-команда создаёт своё Определение Готовности для продукта', 'Диктует заказчик в договоре'], correct: 2,
    explanation: 'Определение Готовности — не личное решение одного человека. Если оно является частью стандартов организации, все Scrum-команды обязаны следовать ему как минимуму. Если такого стандарта нет, Scrum-команда создаёт Определение Готовности, подходящее для продукта.',
    ref: 'Scrum Guide 2020, раздел «Обязательство: Определение Готовности»' },
  { tag: 'E', text: 'На какие три темы отвечает Scrum-команда на Планировании Спринта?',
    options: ['Кто виноват, что делать и кто отвечает за срыв', 'Почему этот Спринт ценен, что может быть сделано в этом Спринте и как будет сделана выбранная работа', 'Бюджет, сроки и ресурсы Спринта', 'Что было в прошлом Спринте, что не успели и что переносим'], correct: 1,
    explanation: 'Планирование Спринта раскрывает три темы: зачем (Цель Спринта), что (выбранные элементы Бэклога Продукта) и как (план поставки Инкремента). Без ответа «зачем» команда набирает работу, не понимая, ради чего.',
    ref: 'Scrum Guide 2020, раздел «Планирование Спринта»' },
  { tag: 'T', text: 'Команда показывает стейкхолдерам только удачные части работы и скрывает проблемы, а потом удивляется, что решения по продукту оказываются неверными. Какой столп эмпиризма подорван в первую очередь?',
    options: ['Адаптация', 'Прозрачность', 'Планирование', 'Контроль'], correct: 1,
    explanation: 'Столпы работают только вместе: без прозрачности инспекция вводит в заблуждение, а решения на основе такой инспекции ведут к потерям и рискам. Первая проблема здесь — непрозрачность процесса и артефактов.',
    ref: 'Scrum Guide 2020, раздел «Теория Scrum»' },
  { tag: 'T', text: 'Разработчик видит, что принятое командой техническое решение ведёт в тупик, но молчит, чтобы «не портить отношения». Какой ценности Scrum здесь недостаёт?',
    options: ['Смелости', 'Фокуса', 'Обязательства', 'Уважения'], correct: 0,
    explanation: 'Члены Scrum-команды должны иметь смелость поступать правильно и работать над сложными проблемами, в том числе открыто говорить о них. Пять ценностей — обязательство, фокус, открытость, уважение, смелость — это конкретный набор, а не любые «хорошие слова».',
    ref: 'Scrum Guide 2020, раздел «Ценности Scrum»' },
  { tag: 'A', text: 'Что такое Цель Продукта?',
    options: ['Список всех функций продукта', 'Будущее состояние продукта, долгосрочная цель Scrum-команды и обязательство Бэклога Продукта', 'То же, что Цель Спринта', 'Дата выпуска очередного релиза'], correct: 1,
    explanation: 'Цель Продукта описывает будущее состояние продукта и служит долгосрочной целью для планирования Scrum-команды. Это обязательство Бэклога Продукта: весь Бэклог существует, чтобы приближать команду к этой цели, а Спринты — шаги к ней.',
    ref: 'Scrum Guide 2020, раздел «Обязательство: Цель Продукта»' },
  { tag: 'A', text: 'В середине Спринта Инкремент готов и соответствует Определению Готовности. Стейкхолдеры просят поставить его сейчас. Когда это допустимо?',
    options: ['Только в конце Спринта', 'В любой момент, как только Инкремент соответствует Определению Готовности', 'Только после одобрения на Обзоре Спринта', 'Не чаще одного раза за Спринт'], correct: 1,
    explanation: 'Инкремент может быть поставлен стейкхолдерам до окончания Спринта, и за Спринт может быть создано несколько Инкрементов. Обзор Спринта — это инспекция и обратная связь, а не ворота для выпуска.',
    ref: 'Scrum Guide 2020, раздел «Инкремент»' },
  { tag: 'F', text: 'Руководитель требует, чтобы оценки элементов Бэклога Продукта ставил Владелец Продукта и обязательно в стори-поинтах, «как положено в Scrum». Что верно?',
    options: ['Верно: Владелец Продукта оценивает, а стори-поинты обязательны', 'Оценивают Разработчики, которые будут делать работу; конкретную технику оценки Scrum не предписывает', 'Оценивает Scrum-мастер на основе скорости команды', 'Оценивает руководитель в человеко-часах'], correct: 1,
    explanation: 'За оценку размера отвечают Разработчики, которые выполняют работу. Ни стори-поинты, ни покер планирования, ни скорость команды в Scrum Guide не прописаны: это популярные практики, а не требования фреймворка.',
    ref: 'Scrum Guide 2020, раздел «Бэклог Продукта»' },
  { tag: 'A', text: 'Команда поставила в календарь еженедельное «уточнение Бэклога» и называет его шестым событием Scrum. Что верно?',
    options: ['Уточнение Бэклога Продукта — шестое официальное событие Scrum', 'Уточнение Бэклога Продукта — постоянная деятельность по разбиению и детализации элементов, а не отдельное событие', 'Уточнение Бэклога — часть Обзора Спринта', 'Уточнение Бэклога — обязанность только Scrum-мастера'], correct: 1,
    explanation: 'В Scrum ровно пять событий: Спринт, Планирование Спринта, Ежедневный Скрам, Обзор Спринта и Ретроспектива Спринта. Уточнение Бэклога Продукта — непрерывная деятельность, в ходе которой элементы разбиваются и уточняются; команда сама решает, как и когда это делать.',
    ref: 'Scrum Guide 2020, раздел «Бэклог Продукта»' },
  { tag: 'E', text: 'Чем по сути является Обзор Спринта?',
    options: ['Формальной приёмкой с подписанием акта', 'Рабочей сессией, на которой Scrum-команда и стейкхолдеры вместе инспектируют результат и решают, что делать дальше', 'Презентацией, где команда показывает слайды', 'Встречей только для руководства'], correct: 1,
    explanation: 'Обзор Спринта — рабочая сессия, и Scrum Guide прямо предостерегает от сведения его к презентации. Команда и стейкхолдеры обсуждают Инкремент, изменения в окружении и следующие шаги; по итогам может быть скорректирован Бэклог Продукта.',
    ref: 'Scrum Guide 2020, раздел «Обзор Спринта»' },
  { tag: 'F', text: 'Через три дня после Планирования Разработчики поняли, что часть плана не работает и нужны другие задачи. Может ли Бэклог Спринта меняться в ходе Спринта?',
    options: ['Нет, после Планирования он заморожен до конца Спринта', 'Да, Разработчики уточняют его на протяжении Спринта по мере того, как узнают новое, сохраняя Цель Спринта', 'Да, но менять его может только Владелец Продукта', 'Нет, любое изменение — нарушение Scrum'], correct: 1,
    explanation: 'Бэклог Спринта — живой план Разработчиков, он уточняется в течение всего Спринта по мере поступления новых знаний. Меняться может объём и способ работы, а Цель Спринта остаётся неизменной; если объём нужно пересмотреть, Разработчики договариваются с Владельцем Продукта.',

  { tag: 'K', text: 'Кому служит Scrum-мастер?',

    explanation: 'Scrum-мастер служит на трёх уровнях: Scrum-команде (самоуправление, кросс-функциональность, качество), Владельцу Продукта (Цель Продукта, управление Бэклогом, работа со стейкхолдерами) и организации (внедрение Scrum, устранение барьеров, объяснение эмпирического подхода).',
    ref: 'Scrum Guide 2020, раздел «Scrum-мастер»' },
  { tag: 'E', text: 'Спринт завершён: прошли Обзор и Ретроспектива. Когда начинается следующий Спринт?',
    options: ['Сразу после завершения предыдущего', 'Через несколько дней паузы на подготовку', 'Когда Владелец Продукта подготовит Бэклог Продукта', 'Когда руководство согласует старт'], correct: 0,
    explanation: 'Новый Спринт начинается немедленно после окончания предыдущего. Между Спринтами нет промежутков: Scrum — непрерывный ритм, а не серия отдельных проектов с перерывами.',
    ref: 'Scrum Guide 2020, раздел «Спринт»' },
  { tag: 'T', text: 'Является ли скорость команды (velocity) обязательной частью Scrum?',

    explanation: 'Scrum — фреймворк, описанный в Scrum Guide. Скорость, стори-поинты, покер планирования, доски — популярные дополняющие практики, которые команда может использовать, но они не являются частью Scrum. На экзамене важно отделять фреймворк от практик.',
    ref: 'Scrum Guide 2020, раздел «Определение Scrum»' },
  { tag: 'K', text: 'Что означает, что Scrum-команда кросс-функциональна?',
    options: ['Каждый участник умеет делать всё', 'У команды есть все навыки, необходимые для создания ценности в каждом Спринте, без зависимости от внешних людей', 'В команде смешаны сотрудники разных отделов', 'Команда подчиняется нескольким руководителям'], correct: 1,
    explanation: 'Кросс-функциональность означает, что внутри команды в сумме есть все навыки для создания ценности каждый Спринт, и ей не нужно ждать другие отделы. Это не требование, чтобы каждый умел всё.',
    ref: 'Scrum Guide 2020, раздел «Scrum-команда»' },
  { tag: 'K', text: 'Инкремент вышел с дефектами и не по стандарту качества. Кто отвечает за то, чтобы Инкремент соответствовал Определению Готовности?',
    options: ['Владелец Продукта, потому что он принимает работу', 'Разработчики', 'Scrum-мастер, потому что он следит за процессом', 'Отдельный отдел тестирования'], correct: 1,
    explanation: 'Разработчики несут ответственность за то, чтобы каждый Инкремент соответствовал Определению Готовности. Качество встраивается в работу, а не проверяется кем-то после. Владелец Продукта отвечает за ценность, Scrum-мастер — за эффективность команды.',

  { tag: 'S', text: 'Над одним продуктом работают четыре Scrum-команды. Сколько у них Владельцев Продукта, Бэклогов Продукта и Целей Продукта?',

    explanation: 'Один продукт — один Бэклог Продукта, один Владелец Продукта и одна Цель Продукта, сколько бы команд над ним ни работало. Иначе источники приоритетов расходятся и команды тянут продукт в разные стороны.',
    ref: 'Scrum Guide 2020, разделы «Владелец Продукта», «Бэклог Продукта»' },
  { tag: 'A', multi: true, text: 'Какие пары «артефакт — обязательство» верны? Выберите три.',
    options: ['Бэклог Продукта — Цель Продукта', 'Бэклог Спринта — Определение Готовности', 'Бэклог Спринта — Цель Спринта', 'Инкремент — Определение Готовности', 'Инкремент — Цель Продукта'], correct: [0, 2, 3],
    explanation: 'Артефакты и обязательства работают парами: Бэклог Продукта — Цель Продукта, Бэклог Спринта — Цель Спринта, Инкремент — Определение Готовности. Бэклог без цели — просто список, Инкремент без Определения Готовности — непонятно, готов ли он.',

  { tag: 'F', text: 'Scrum-мастер слышит от Разработчиков: «План менять нельзя до завтрашнего Ежедневного Скрама». Что верно?',
    options: ['Верно: корректировать план можно только на Ежедневном Скраме', 'Неверно: Ежедневный Скрам улучшает коммуникацию, но Разработчики могут корректировать план в любой момент дня', 'Верно, иначе нарушается ритм Спринта', 'Неверно: план меняется только на Планировании Спринта'], correct: 1,
    explanation: 'Ежедневный Скрам — не единственный момент, когда Разработчики могут корректировать план. Они часто общаются в течение дня и адаптируют работу по мере необходимости. Самоуправление не работает по расписанию.',
    ref: 'Scrum Guide 2020, раздел «Ежедневный Скрам»' },

  /* ---- Оригинальные сценарные вопросы: теория и ценности ---- */
  { tag: 'T', text: 'Руководство маркетплейса просит Scrum-мастера «адаптировать Scrum»: убрать Ретроспективу и сделать Спринт шесть недель, «потому что у нас своя специфика». Как это соотносится со Scrum Guide?',
    options: ['Это допустимо: Scrum — гибкий фреймворк, и каждая часть необязательна', 'Удаление элементов Scrum скрывает проблемы и ограничивает пользу; результат уже не Scrum, хотя его можно так называть', 'Допустимо убрать Ретроспективу, но Спринт не может быть длиннее месяца', 'Scrum-мастер обязан выполнить любое решение руководства'], correct: 1,
    explanation: 'Scrum Guide содержит минимум правил. Изменение сути Scrum, пропуск элементов или несоблюдение правил скрывают проблемы и ограничивают пользу, потенциально делая Scrum бесполезным. Фреймворк неполон намеренно: его дополняют практиками, а не урезают.',
    ref: 'Scrum Guide 2020, разделы «Определение Scrum», «Заключительное слово»' },
  { tag: 'T', text: 'Scrum-команда пропускает Обзор Спринта, когда «показывать нечего». Какой принцип Scrum она нарушает?',
    options: ['Принцип фиксированного таймбокса', 'Каждое событие — формальная возможность инспекции и адаптации; пропуск события снижает прозрачность и упускает возможность улучшения', 'Принцип единого Владельца Продукта', 'Ничего не нарушает: события проводятся по необходимости'], correct: 1,
    explanation: 'Все события Scrum — формальные возможности для инспекции и адаптации артефактов. Если проводить их не так, как задумано, теряется прозрачность и упускается возможность инспекции и адаптации. Отсутствие результата как раз и стоит проинспектировать со стейкхолдерами.',

  { tag: 'T', text: 'На Ретроспективе команда честно обсудила провалы Спринта, но ничего не поменяла в работе. Какой столп эмпиризма здесь не работает?',
    options: ['Прозрачность', 'Инспекция', 'Адаптация', 'Все три работают нормально'], correct: 2,
    explanation: 'Инспекция без адаптации бессмысленна: если процесс или продукт отклоняются от приемлемых пределов, корректировка должна быть сделана как можно скорее. Обсуждение без изменений — это инспекция без адаптации.',
    ref: 'Scrum Guide 2020, раздел «Теория Scrum»' },
  { tag: 'T', text: 'Чем Scrum в первую очередь описан в Scrum Guide?',
    options: ['Методологией с подробными инструкциями для каждого случая', 'Лёгким фреймворком, намеренно неполным, в рамках которого применяются различные процессы и техники', 'Набором лучших практик разработки программного обеспечения', 'Стандартом управления проектами'], correct: 1,
    explanation: 'Scrum — лёгкий фреймворк, который помогает людям, командам и организациям создавать ценность через адаптивные решения сложных проблем. Он намеренно неполон и определяет только то, что нужно для реализации теории Scrum.',
    ref: 'Scrum Guide 2020, раздел «Определение Scrum»' },
  { tag: 'T', text: 'Команда взяла в Спринт столько работы, что к концу недели параллельно открыто двенадцать задач и ни одна не закончена. Какая ценность Scrum страдает прежде всего?',
    options: ['Открытость', 'Уважение', 'Фокус', 'Смелость'], correct: 2,
    explanation: 'Основной фокус Scrum-команды — работа Спринта ради максимального продвижения к его цели. Множество параллельно открытых задач рассеивает фокус и мешает достижению Цели Спринта.',
    ref: 'Scrum Guide 2020, раздел «Ценности Scrum»' },
  { tag: 'T', text: 'Какие утверждения о Scrum верны? Выберите два.', multi: true,

    explanation: 'Scrum основан на эмпиризме и бережливом мышлении (сокращение потерь, фокус на главном) и использует итеративно-инкрементальный подход. Он не предписывает инженерных практик и применяется далеко за пределами разработки программного обеспечения.',
    ref: 'Scrum Guide 2020, разделы «Определение Scrum», «Теория Scrum»' },
  { tag: 'T', text: 'Разработчик с опытом в другой команде настаивает, что «в Scrum нужно обязательно вести диаграмму сгорания». Что ответит Scrum-мастер, опираясь на Scrum Guide?',
    options: ['Да, диаграмма сгорания — обязательный артефакт Scrum', 'Диаграмма сгорания — полезная практика прогнозирования, но Scrum не требует её; команда сама решает, что использовать', 'Диаграммы сгорания запрещены, потому что это инструмент классического управления проектами', 'Вести диаграмму обязан Владелец Продукта'], correct: 1,
    explanation: 'Scrum Guide упоминает, что для прогнозирования прогресса используются различные практики, но подчёркивает, что они не заменяют эмпиризм. Scrum не требует ни одну конкретную технику; ценность имеет только то, что уже произошло.',

  { tag: 'T', text: 'Какие из перечисленного относятся к пяти ценностям Scrum? Выберите все верные.', multi: true,

    explanation: 'Ценности Scrum: обязательство, фокус, открытость, уважение и смелость. Прозрачность — столп эмпиризма, а не ценность; эффективность в списке отсутствует. Экзамен часто смешивает столпы и ценности в одном вопросе.',

  { tag: 'T', text: 'Владелец Продукта на каждом Обзоре Спринта говорит стейкхолдерам «всё по плану», хотя команда отстаёт от Цели Продукта. Что должен сделать Scrum-мастер?',
    options: ['Ничего: общение со стейкхолдерами — зона ответственности Владельца Продукта', 'Помочь Владельцу Продукта и команде сделать реальное состояние продукта прозрачным: без прозрачности решения стейкхолдеров будут ошибочными', 'Самому доложить руководству об отставании, минуя Владельца Продукта', 'Предложить сократить Цель Продукта, чтобы отчёт стал правдой'], correct: 1,

  { tag: 'T', text: 'Что из перечисленного Scrum Guide называет результатом применения ценностей Scrum членами команды?',
    options: ['Рост скорости команды каждый Спринт', 'Оживление столпов прозрачности, инспекции и адаптации и формирование доверия', 'Сокращение числа событий', 'Повышение зарплат участников'], correct: 1,
    explanation: 'Когда Scrum-команда воплощает пять ценностей, столпы эмпиризма оживают и формируют доверие. Ценности определяют работу, действия и поведение участников.',
    ref: 'Scrum Guide 2020, раздел «Ценности Scrum»' },
  { tag: 'T', text: 'Инкремент получился хуже, чем ожидали стейкхолдеры. Scrum-мастер предлагает «не выносить это на Обзор, чтобы не расстраивать людей». Какое утверждение верно?',
    options: ['Это разумная защита команды', 'Это противоречит открытости и прозрачности: Scrum-команда и стейкхолдеры открыты в отношении работы и её вызовов', 'Решение правильное, если его одобрит Владелец Продукта', 'Scrum Guide не регулирует общение со стейкхолдерами'], correct: 1,
    explanation: 'Ценность открытости требует, чтобы команда и стейкхолдеры были открыты в отношении работы и вызовов. Скрывая проблемы, Scrum-мастер лишает стейкхолдеров возможности принять верные решения на Обзоре Спринта.',
    ref: 'Scrum Guide 2020, разделы «Ценности Scrum», «Обзор Спринта»' },

  /* ---- Scrum-команда ---- */
  { tag: 'K', text: 'Стейкхолдер приходит прямо к Разработчикам и просит «по-быстрому» добавить функцию в текущий Спринт. Что должен сделать Scrum-мастер?',
    options: ['Разрешить, если Разработчики не против', 'Помочь стейкхолдеру понять, что изменения в Бэклог Продукта идут через Владельца Продукта, и организовать их разговор', 'Самостоятельно добавить функцию в Бэклог Спринта', 'Запретить стейкхолдерам общаться с командой'], correct: 1,

  { tag: 'K', text: 'Владелец Продукта уходит в отпуск на две недели и назначает трёх человек из отдела маркетинга «коллективно отвечать за Бэклог». Что верно?',
    options: ['Это допустимо: Владелец Продукта может быть комитетом', 'Владелец Продукта — один человек, а не комитет; он может делегировать работу, но ответственность остаётся за ним', 'Scrum-мастер автоматически становится Владельцем Продукта', 'Разработчики сами упорядочивают Бэклог до его возвращения'], correct: 1,

  { tag: 'K', text: 'Какие виды ответственности Scrum Guide закрепляет за Разработчиками? Выберите все верные.', multi: true,

    explanation: 'Разработчики отвечают за создание Бэклога Спринта, за качество через Определение Готовности, за ежедневную адаптацию плана к Цели Спринта и за то, чтобы держать друг друга ответственными как профессионалы. Упорядочивание Бэклога Продукта — у Владельца Продукта, отмена Спринта — тоже его полномочие.',
    ref: 'Scrum Guide 2020, раздел «Разработчики»' },
  { tag: 'K', text: 'Руководитель отдела просит Scrum-мастера каждую неделю присылать отчёт, кто из Разработчиков сколько задач закрыл. Как поступить Scrum-мастеру?',

      h('p', { class: 'lead', text: resultMessage(s) }),
      h('div', { class: 'actions' },
        h('button', { class: 'btn btn-primary', type: 'button', text: 'Новая попытка', onclick: reset }),
        h('button', { class: 'btn', type: 'button', text: 'Скопировать отчёт', onclick: (e) => copyText(report(), e.currentTarget) }),
        state.downloads ? h('button', { class: 'btn', type: 'button', text: 'Скачать отчёт', onclick: saveReport }) : null),
      h('div', { class: 'status', id: 'status', role: 'status', 'aria-live': 'polite' })),
    h('section', { class: 'card' }, h('h3', { text: 'Разбор по темам' }),
      h('p', { class: 'lead', text: 'Оранжевая отметка на шкале — проходной балл 85 %. Темы ниже порога стоит перечитать в Scrum Guide 2020 перед следующей попыткой.' }),
      h('div', { class: 'topics' }, ...rows)),
    h('section', { class: 'card' }, h('h3', { text: 'Разбор вопросов' }),
      h('div', { class: 'actions' },
        h('button', { class: 'btn btn-small' + (state.filter === 'wrong' ? ' btn-primary' : ''), type: 'button', text: `Только ошибки (${wrong.length})`, onclick: () => { state.filter = 'wrong'; render(); } }),
        h('button', { class: 'btn btn-small' + (state.filter === 'all' ? ' btn-primary' : ''), type: 'button', text: `Все вопросы (${state.qs.length})`, onclick: () => { state.filter = 'all'; render(); } })),
      review.length ? h('div', { class: 'review' }, ...review) : h('div', { class: 'empty', text: 'Ошибок нет. Все ответы верны.' }))
  ];
}
function resultMessage(s) {
  if (s.pct === 100) return 'Все ответы верны. Попробуйте режим экзамена с таймером, если ещё не пробовали: на реальном экзамене давление времени меняет восприятие вопросов.';
  if (s.pct >= EXAM.pass) return 'Результат выше проходного балла. Разберите оставшиеся ошибки: на экзамене вопросы по тем же темам будут сформулированы иначе.';
  if (s.pct >= 70) return 'Вы близко к проходному баллу. Сосредоточьтесь на двух самых слабых темах ниже и прочитайте указанные разделы Scrum Guide, затем повторите попытку.';
  return 'Пока ниже порога. Прочитайте Scrum Guide 2020 целиком (это 13 страниц), затем пройдите режим обучения несколько раз, разбирая каждое объяснение.';
}

/* ================= Отчёт ================= */
function report() {
  const s = score(), v = verdict(s.pct, state.mode);
  const L = ['# Подготовка к PSM I: результат попытки', '', `Режим: ${state.mode === 'exam' ? 'экзамен' : 'обучение'}. Дата: ${new Date(state.finishedAt || Date.now()).toLocaleString('ru-RU')}.`, '',
    `**Результат: ${s.pct} %** (${s.ok} из ${s.total}). Проходной балл ${EXAM.pass} %. Вердикт: ${v.t}.${state.timedOut ? ' Время истекло.' : ''}`, '',
    '## По темам', '', '| Тема | Верно | Процент | Что перечитать |', '|---|---|---|---|'];
  Object.keys(TAGS).forEach((t) => { const x = s.tags[t]; if (!x || !x.n) return; const pct = Math.round(100 * x.ok / x.n); L.push(`| ${TAGS[t].n} | ${x.ok} из ${x.n} | ${pct} % | ${TAGS[t].read} |`); });
  L.push('', '## Ошибки', '');
  const wrong = state.qs.map((q, i) => ({ q, i })).filter((x) => !isRight(x.q, state.answers[x.i]));
  if (!wrong.length) L.push('Ошибок нет.');
  wrong.forEach(({ q, i }) => {
    const a = state.answers[i]; const chosen = Array.isArray(a) ? a : a == null ? [] : [a];
    L.push(`### ${i + 1}. ${q.text}`, '', `Тема: ${TAGS[q.tag].n}`, '', `Ваш ответ: ${chosen.length ? chosen.map((k) => `${LETTERS[k]}. ${q.options[k]}`).join('; ') : 'не дан'}`, '', `Верно: ${corr(q).map((k) => `${LETTERS[k]}. ${q.options[k]}`).join('; ')}`, '', q.explanation, '', `_${q.ref}_`, '');
  });
  return L.join('\n');
}
async function saveReport() {
  try { await state.downloads.save({ filename: `psm1-rezultat-${new Date().toISOString().slice(0, 10)}.md`, data: report() }); }
  catch (e) { if (e && e.code !== 'declined') setStatus('Файл не сохранён. Скопируйте отчёт кнопкой рядом.', 'err'); }
}
function setStatus(t, cls) { const el = $('#status'); if (el) { el.textContent = t; el.className = 'status' + (cls ? ' ' + cls : ''); } }
async function copyText(t, btn) {
  try { await navigator.clipboard.writeText(t); if (btn) { const o = btn.textContent; btn.textContent = 'Скопировано'; setTimeout(() => (btn.textContent = o), 1600); } }
  catch (e) { setStatus('Браузер не дал скопировать. Скачайте отчёт или выделите текст разбора вручную.', 'err'); }
}

/* ================= Админ-панель: свои вопросы ================= */
function blankDraft() { return { tag: 'T', text: '', options: ['', '', '', ''], multi: false, correct: [], explanation: '', ref: '' }; }
function adminCard() {
  const d = state.adminDraft || (state.adminDraft = blankDraft());
  const det = h('details', { open: state.adminOpen || null, ontoggle: (e) => { state.adminOpen = e.currentTarget.open; } });
  det.append(h('summary', { text: `Свои вопросы (${CUSTOM.length}). Добавить или удалить` }));
  const body = h('div', { style: 'display:flex;flex-direction:column;gap:14px;padding-top:14px' });
  body.append(h('p', { class: 'help', text: 'Собственные вопросы хранятся только в этом браузере и попадают в общий банк для обоих режимов. Формулируйте сценарно и указывайте раздел Scrum Guide.' }));
  const sel = h('select', { onchange: (e) => { d.tag = e.target.value; } }, Object.keys(TAGS).map((t) => h('option', { value: t, selected: d.tag === t || null, text: TAGS[t].n })));
  const text = h('textarea', { rows: 2, placeholder: 'Текст вопроса', oninput: (e) => { d.text = e.target.value; } }); text.value = d.text;
  const optsBox = h('div', { style: 'display:flex;flex-direction:column;gap:8px' });
  const drawOpts = () => {
    optsBox.replaceChildren(...d.options.map((o, k) => {
      const mark = h('input', { type: d.multi ? 'checkbox' : 'radio', name: 'adm-correct', checked: d.correct.includes(k) || null, title: 'Верный ответ', onchange: () => { if (d.multi) { const at = d.correct.indexOf(k); if (at >= 0) d.correct.splice(at, 1); else d.correct.push(k); } else d.correct = [k]; } });
      const inp = h('input', { type: 'text', placeholder: `Вариант ${LETTERS[k]}`, oninput: (e) => { d.options[k] = e.target.value; } }); inp.value = o;
      return h('div', { class: 'optfield' }, h('label', {}, mark), inp);
    }));
  };
  drawOpts();
  const multi = h('label', { class: 'chk-row' }, h('input', { type: 'checkbox', checked: d.multi || null, onchange: (e) => { d.multi = e.target.checked; d.correct = d.multi ? d.correct : d.correct.slice(0, 1); drawOpts(); } }), 'Несколько верных ответов');
  const five = h('button', { class: 'btn btn-small', type: 'button', text: d.options.length < 5 ? 'Добавить пятый вариант' : 'Убрать пятый вариант', onclick: (e) => { if (d.options.length < 5) d.options.push(''); else { d.options.pop(); d.correct = d.correct.filter((k) => k < 4); } e.currentTarget.textContent = d.options.length < 5 ? 'Добавить пятый вариант' : 'Убрать пятый вариант'; drawOpts(); } });
  const expl = h('textarea', { rows: 3, placeholder: 'Объяснение своими словами', oninput: (e) => { d.explanation = e.target.value; } }); expl.value = d.explanation;
  const ref = h('input', { type: 'text', placeholder: 'Например: Scrum Guide 2020, раздел «Спринт»', oninput: (e) => { d.ref = e.target.value; } }); ref.value = d.ref;
  const st = h('div', { class: 'status', role: 'status' });
  body.append(
    h('div', { class: 'grid2' }, h('div', { class: 'field' }, h('span', { class: 'lbl', text: 'Тема' }), sel), h('div', { class: 'field' }, h('span', { class: 'lbl', text: 'Тип' }), multi)),
    h('div', { class: 'field' }, h('span', { class: 'lbl', text: 'Вопрос' }), text),
    h('div', { class: 'field' }, h('span', { class: 'lbl', text: 'Варианты (отметьте верные)' }), optsBox, h('div', { class: 'actions' }, five)),
    h('div', { class: 'field' }, h('span', { class: 'lbl', text: 'Объяснение' }), expl),
    h('div', { class: 'field' }, h('span', { class: 'lbl', text: 'Ссылка на Scrum Guide' }), ref),
    h('div', { class: 'actions' }, h('button', { class: 'btn btn-primary', type: 'button', text: 'Сохранить вопрос', onclick: () => {
      const err = validateDraft(d); if (err) { st.textContent = err; st.className = 'status err'; return; }
      CUSTOM.push({ tag: d.tag, text: d.text.trim(), options: d.options.map((o) => o.trim()), multi: d.multi, correct: d.multi ? d.correct.slice().sort((a, b) => a - b) : d.correct[0], explanation: d.explanation.trim(), ref: d.ref.trim(), custom: true });
      store.set('kz.psm.custom', CUSTOM); state.adminDraft = blankDraft(); state.adminOpen = true; render();
    } }), CUSTOM.length ? h('button', { class: 'btn', type: 'button', text: 'Экспорт своих вопросов (JSON)', onclick: (e) => copyText(JSON.stringify(CUSTOM, null, 2), e.currentTarget) }) : null), st);
  if (CUSTOM.length) body.append(h('div', { class: 'custom-list' }, ...CUSTOM.map((q, k) => h('div', { class: 'custom-item' }, h('span', {}, h('b', { text: TAGS[q.tag].n + ': ' }), q.text), h('button', { class: 'btn btn-small', type: 'button', text: 'Удалить', onclick: () => { CUSTOM.splice(k, 1); store.set('kz.psm.custom', CUSTOM); state.adminOpen = true; render(); } })))));
  det.append(body);
  return h('section', { class: 'card' }, h('h3', { text: 'Банк вопросов' }), h('p', { class: 'lead', text: `Встроенных вопросов: ${QUESTIONS.length}. Своих: ${CUSTOM.length}.` }), det);
}
function validateDraft(d) {
  if (d.text.trim().length < 15) return 'Текст вопроса слишком короткий.';
  if (d.options.some((o) => !o.trim())) return 'Заполните все варианты ответа.';
  if (d.multi && d.correct.length < 2) return 'Для вопроса с несколькими ответами отметьте не меньше двух верных.';
  if (!d.multi && d.correct.length !== 1) return 'Отметьте один верный вариант.';
  if (d.explanation.trim().length < 20) return 'Напишите объяснение: оно показывается в разборе.';
  if (!d.ref.trim()) return 'Укажите раздел Scrum Guide.';
  return '';
}

/* ================= Rail ================= */
function renderRail() {
  const kids = [];
  const s = score();
  kids.push(h('div', { class: 'rail-sec' }, h('h3', { text: 'Чему учит практикум' }),
    ...[['Отличать Scrum от популярных практик', state.history.length > 0], ['Знать подотчётности трёх ролей', s.tags.K && s.tags.K.n > 0 && s.tags.K.ok === s.tags.K.n && state.finished], ['Понимать события и таймбоксы', s.tags.E && s.tags.E.n > 0 && s.tags.E.ok === s.tags.E.n && state.finished], ['Связывать артефакты с обязательствами', s.tags.A && s.tags.A.n > 0 && s.tags.A.ok === s.tags.A.n && state.finished], ['Набирать 85 % в режиме экзамена', state.history.some((x) => x.mode === 'exam' && x.pct >= EXAM.pass)]]
      .map(([k, on]) => h('div', { class: 'goal' + (on ? ' on' : '') }, h('span', { class: 'dot' }), h('span', { text: k })))));
  if (state.step === 1 && state.qs.length) {
    const grid = h('div', { class: 'qgrid' }, state.qs.map((q, i) => {
      const a = state.answers[i]; const has = a != null && !(Array.isArray(a) && !a.length);
      let cls = has ? 'done' : ''; if (has && state.mode === 'learn' && state.checked[i]) cls = isRight(q, a) ? 'ok' : 'bad'; if (i === state.cur) cls += ' now';
      return h('button', { class: cls.trim(), type: 'button', text: String(i + 1), title: `Вопрос ${i + 1}`, onclick: () => { state.cur = i; persist(); render(); } });
    }));
    kids.push(h('div', { class: 'rail-sec' }, h('h4', { text: `Отвечено ${s.answered} из ${s.total}` }), grid,
      state.mode === 'learn' ? h('p', { class: 'help', text: `Верно: ${s.ok} из ${state.checked.filter(Boolean).length} проверенных.` }) : h('p', { class: 'help', text: 'Серые — отвечены. Процент узнаете после завершения.' })));
  }
  if (state.step === 2 && state.finished) {
    const m = Object.keys(TAGS).filter((t) => s.tags[t] && s.tags[t].n).map((t) => { const p = 100 * s.tags[t].ok / s.tags[t].n; return h('i', { class: p >= 85 ? 'ok' : p >= 70 ? 'warn' : 'bad', title: TAGS[t].n }); });
    kids.push(h('div', { class: 'rail-sec' }, h('h4', { text: 'Темы' }), h('div', { class: 'meter' }, ...m), h('p', { class: 'help', text: 'Теория · Команда · События · Артефакты · Масштабирование · Самоуправление' })));
  }
  const tip = railTip(s);
  if (tip) kids.push(h('div', { class: 'rail-sec tip' }, h('h4', { text: 'Коуч' }), h('p', { text: tip.b }), tip.q ? h('p', { class: 'q', text: tip.q }) : null));
  if (state.history.length) kids.push(h('div', { class: 'rail-sec' }, h('h4', { text: 'Попытки' }),
    h('div', { class: 'attempts' }, state.history.slice(-6).reverse().map((t) => h('div', { class: 'attempt' }, h('span', { text: `${t.mode === 'exam' ? 'Экзамен' : 'Обучение'} · ${new Date(t.at).toLocaleDateString('ru-RU')}` }), h('span', { class: 'mono', text: `${t.pct} % · ${t.ok}/${t.total}` })))),
    h('div', { class: 'actions' }, h('button', { class: 'btn btn-small', type: 'button', text: 'Очистить историю', onclick: () => { state.history = []; persist(); render(); } }))));
  $('#rail').replaceChildren(...kids);
}
function railTip(s) {
  if (state.step === 0) return { b: 'Начните с режима обучения: он показывает логику верного ответа. Экзамен берите, когда в обучении стабильно выше 85 %.', q: 'Какую тему вы считаете самой слабой до начала?' };
  if (state.step === 1) {
    const q = state.qs[state.cur];
    if (state.mode === 'exam') return { b: 'Не застревайте: на вопрос в среднем 45 секунд. Сомневаетесь — ответьте и вернитесь к нему по сетке справа.', q: q && q.multi ? 'Сколько верных ответов требует этот вопрос?' : 'Есть ли в вариантах слова «только» или «обязан»?' };
    if (q && q.multi) return { b: 'Вопрос с несколькими ответами засчитывается, только если выбраны все верные и ни одного лишнего.' };
    return { b: 'Прежде чем нажать «Проверить», сформулируйте про себя, почему остальные варианты неверны. Это и есть подготовка к экзамену.', q: q ? `Какая подотчётность отвечает за это по Scrum Guide: ${TAGS[q.tag].n.toLowerCase()}?` : '' };
  }
  const weak = Object.keys(TAGS).filter((t) => s.tags[t] && s.tags[t].n && 100 * s.tags[t].ok / s.tags[t].n < 85).sort((a, b) => (s.tags[a].ok / s.tags[a].n) - (s.tags[b].ok / s.tags[b].n));
  if (!weak.length) return { b: 'Все темы выше порога. Сделайте перерыв и повторите экзамен через день: устойчивость результата важнее одного удачного прохода.' };
  return { b: `Самая слабая тема: ${TAGS[weak[0]].n.toLowerCase()}. Перечитайте разделы ${TAGS[weak[0]].read} и пройдите обучение ещё раз.`, q: 'Какие ошибки повторяются: про «кто отвечает» или про «когда»?' };
}

/* ================= Boot ================= */
function boot() {
  if (!unlocked(state.step)) state.step = 0;
  if (state.mode === 'exam' && !state.finished && state.deadline && state.deadline <= Date.now() && state.qs.length) { state.timedOut = true; state.finished = true; state.finishedAt = state.deadline; const s = score(); state.history.push({ at: state.finishedAt, mode: 'exam', pct: s.pct, ok: s.ok, total: s.total, timedOut: true }); state.step = 2; persist(); }
  render();
  if (state.step === 1) startTimer();
  const get = async (name) => { try { return window.claude && window.claude.use ? await window.claude.use(name) : null; } catch (e) { return null; } };
  get('downloads').then((dl) => { state.downloads = dl || null; if (state.step === 2) render(); });
}
boot();
</script>
