<title>Освоенный объём — Корзина</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
/* Освоенный объём: earned value for the Food Delivery launch programme at the Korzina marketplace.
   The dark band carries 42 weeks: 35 planned, 7 forecast; week 20 (today) is signal orange, week 35 is the launch. */
:root {
  --paper: #E6E8E3;
  --sheet: #FBFBF9;
  --sheet-2: #F0F1ED;
  --ink: #1D2026;
  --ink-2: #5A6068;
  --rule: #D3D6CF;
  --rule-2: #B4B9B0;
  --band: #20242B;
  --band-ink: #E9EBE6;
  --band-ink-2: #9AA1AB;
  --signal: #F2551D;
  --signal-tint: #FDE3D8;
  --cobalt: #2D4FE3;
  --cobalt-tint: #E2E7FC;
  --amber: #D9960B;
  --violet: #7650C4;
  --green: #2D8A57;
  --ok: #23804A; --ok-tint: #DDF0E3;
  --warn: #9A6400; --warn-tint: #F8ECCB;
  --bad: #C42B2B; --bad-tint: #F8DEDC;
  --on-fill: #FFFFFF;
  --c-pv: #2D8A57;      /* chart: planned value */
  --c-ev: #2D4FE3;      /* chart: earned value */
  --c-ac: #F2551D;      /* chart: actual cost */
  --c-grid: #D3D6CF;
  --font-display: "Dela Gothic One", "Golos Text", system-ui, sans-serif;
  --font-body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #14161A; --sheet: #1D2026; --sheet-2: #252930; --ink: #ECEDE9; --ink-2: #A2A8B0; --rule: #333840; --rule-2: #4A5059;
    --band: #0C0E11; --band-ink: #ECEDE9; --band-ink-2: #8E959F;
    --signal: #FF7341; --signal-tint: #44231A; --cobalt: #8EA4FF; --cobalt-tint: #232C52; --amber: #F2B84B; --violet: #B79BF0; --green: #6CCB93;
    --ok: #6CCB93; --ok-tint: #173323; --warn: #F2C14E; --warn-tint: #3A2D0E; --bad: #FF8A80; --bad-tint: #401A18;
    --on-fill: #14161A; --c-pv: #3FA66E; --c-ev: #6F8AF7; --c-ac: #E45A2A; --c-grid: #333840; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #14161A; --sheet: #1D2026; --sheet-2: #252930; --ink: #ECEDE9; --ink-2: #A2A8B0; --rule: #333840; --rule-2: #4A5059;
  --band: #0C0E11; --band-ink: #ECEDE9; --band-ink-2: #8E959F;
  --signal: #FF7341; --signal-tint: #44231A; --cobalt: #8EA4FF; --cobalt-tint: #232C52; --amber: #F2B84B; --violet: #B79BF0; --green: #6CCB93;
  --ok: #6CCB93; --ok-tint: #173323; --warn: #F2C14E; --warn-tint: #3A2D0E; --bad: #FF8A80; --bad-tint: #401A18;
  --on-fill: #14161A; --c-pv: #3FA66E; --c-ev: #6F8AF7; --c-ac: #E45A2A; --c-grid: #333840; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; padding-inline: 16px; padding-block: 0 56px; font-variant-numeric: tabular-nums; }
.wrap { max-width: 1320px; margin-inline: auto; }
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2.5px solid var(--cobalt); outline-offset: 2px; }
.mono { font-variant-numeric: tabular-nums; }

/* ---------- Control band: 42 weeks ---------- */
.band { background: var(--band); color: var(--band-ink); margin-inline: -16px; padding-inline: 16px; padding-block: 26px 0; }
.band-top { display: flex; flex-wrap: wrap; gap: 14px 40px; align-items: end; justify-content: space-between; }
.brand { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.brand h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(26px, 4vw, 40px); line-height: 1; letter-spacing: -0.01em; }
.brand p { color: var(--band-ink-2); max-width: 62ch; font-size: 14.5px; }
.casetag { font-size: 13px; color: var(--band-ink-2); border: 1px solid #454b55; border-radius: 999px; padding: 4px 12px; white-space: nowrap; }

.ruler { margin-top: 30px; display: grid; grid-template-columns: repeat(42, minmax(0, 1fr)); gap: 3px; align-items: end; height: 58px; }
.ruler span { height: 12px; border-radius: 3px; background: #343a44; position: relative; }
.ruler span.wk::before { content: attr(data-wk); position: absolute; bottom: 30px; left: 0; font-size: 11.5px; color: var(--band-ink-2); white-space: nowrap; }
.ruler span.mk { height: 28px; }
.ruler span.mk::after { content: attr(data-lab); position: absolute; bottom: 34px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.ruler span.past { background: #4b525d; }
.ruler span.now { background: var(--signal); }
.ruler span.now::after { left: 50%; transform: translateX(-50%); color: var(--signal); }
.ruler span.launch { background: var(--green); }
.ruler span.launch::after { left: 50%; transform: translateX(-50%); color: var(--green); }
.ruler span.fc { background: #4a3a35; }
.ruler span.fcend { background: var(--amber); }
.ruler span.fcend::after { right: 0; color: var(--amber); }
@media (max-width: 640px) { .ruler span.mk::after { content: attr(data-short); } .ruler span.wk::before { content: none; } }

.steps { position: relative; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); padding-block: 22px 24px; border-top: 1px solid #3a4049; margin-top: 16px; }
.steps::before { content: ""; position: absolute; left: 14px; right: 14px; top: 36px; height: 3px; background: #3e444e; border-radius: 3px; }
.step { appearance: none; position: relative; text-align: left; cursor: pointer; border: 0; background: transparent; color: var(--band-ink); padding: 0 10px 0 0; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.step .dot { width: 31px; height: 31px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; background: var(--band); border: 3px solid #5b626d; color: var(--band-ink-2); position: relative; z-index: 1; }
.step .t { font-weight: 600; font-size: 14px; line-height: 1.25; }
.step .s { font-size: 12.5px; color: var(--band-ink-2); line-height: 1.3; }
.step:hover .dot { border-color: var(--band-ink); }
.step.done .dot { background: var(--green); border-color: var(--green); color: var(--band); }
.step[aria-current="step"] .dot { background: var(--signal); border-color: var(--signal); color: var(--band); box-shadow: 0 0 0 5px rgba(242, 85, 29, .25); }
.step.locked { cursor: not-allowed; }
.step.locked .dot { border-style: dashed; }
.step.locked .t, .step.locked .s { color: #6d7480; }
@media (max-width: 860px) { .step .s { display: none; } .step .t { font-size: 12px; } }
@media (max-width: 520px) { .step .t { display: none; } }

/* ---------- Working area ---------- */
.workspace { display: grid; gap: 22px; grid-template-columns: minmax(0, 1fr); align-items: start; padding-top: 24px; }
@media (min-width: 1100px) { .workspace { grid-template-columns: minmax(0, 1fr) 320px; } }
.panel { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.card { background: var(--sheet); border-radius: 16px; padding: 22px 24px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card > h3, .sec-h { font-family: var(--font-display); font-weight: 400; font-size: 19px; line-height: 1.2; letter-spacing: -0.005em; }
.lead { color: var(--ink-2); max-width: 72ch; }
.lbl { font-size: 13px; color: var(--ink-2); font-weight: 600; }
.note { font-size: 13px; color: var(--ink-2); border-left: 3px solid var(--rule-2); padding-left: 10px; }
.help { font-size: 13px; color: var(--ink-2); }
.grid2 { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 820px) { .grid2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
@media (max-width: 600px) { .card { padding: 18px 16px; border-radius: 12px; } }

.btn { appearance: none; cursor: pointer; border: 1.5px solid var(--ink); background: transparent; border-radius: 999px; padding: 8px 18px; font-weight: 600; line-height: 1.2; }
.btn:hover { background: var(--sheet-2); }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.btn-primary { background: var(--ink); color: var(--sheet); }
.btn-primary:hover { background: var(--ink); filter: brightness(1.25); }
.btn-small { padding: 5px 13px; font-size: 13px; border-width: 1px; border-color: var(--rule-2); font-weight: 500; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.status { min-height: 20px; font-size: 13.5px; color: var(--ink-2); }
.status.err { color: var(--bad); }

textarea, input[type="text"], input[type="number"], select { width: 100%; border: 1.5px solid var(--rule); background: var(--sheet); border-radius: 10px; padding: 9px 12px; }
textarea:hover, input:hover, select:hover { border-color: var(--rule-2); }
textarea { resize: vertical; line-height: 1.55; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field-top { display: flex; justify-content: space-between; gap: 8px 14px; align-items: baseline; flex-wrap: wrap; }

/* Tables */
table.data { width: 100%; border-collapse: collapse; font-size: 14px; }
table.data th, table.data td { text-align: left; padding: 10px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
table.data th { font-size: 12.5px; color: var(--ink-2); font-weight: 600; border-bottom: 2px solid var(--ink); }
table.data tbody tr:last-child td { border-bottom: 0; }
table.data tfoot td { border-top: 2px solid var(--ink); font-weight: 600; }
table.data td.num, table.data th.num { text-align: right; }
.tscroll { overflow-x: auto; }
table.mine td { vertical-align: middle; }
table.mine input { width: 5.2em; padding: 6px 4px; text-align: center; border-radius: 8px; font-weight: 600; font-size: 15px; }
.rowhint { font-size: 12.5px; color: var(--ink-2); margin-top: 4px; max-width: 36ch; }

/* Numeric question with an always-visible formula */
.nq { display: grid; gap: 6px; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 12px; background: var(--sheet); }
.nq .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.nq input { width: 7em; text-align: center; font-weight: 600; }
.nq .unit { font-size: 13px; color: var(--ink-2); }
.formula { font-size: 13px; color: var(--ink-2); background: var(--sheet-2); border-radius: 8px; padding: 6px 10px; }
.formula b { color: var(--ink); font-weight: 600; }
.nq-list { display: grid; gap: 10px; }
.nq-grid { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 820px) { .nq-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }

.radio-list { display: flex; flex-direction: column; gap: 8px; }
.radio-list label { display: flex; gap: 10px; align-items: baseline; padding: 9px 12px; border: 1.5px solid var(--rule); border-radius: 10px; cursor: pointer; background: var(--sheet); }
.radio-list label:has(input:checked) { border-color: var(--ink); }
.radio-list input { accent-color: var(--signal); }
.compare { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.stat { padding: 12px 14px; background: var(--sheet-2); border-radius: 10px; display: flex; flex-direction: column; gap: 2px; }
.stat b { font-family: var(--font-display); font-weight: 400; font-size: 24px; line-height: 1.15; }
.stat.hot b { color: var(--signal); }
.stat.good b { color: var(--ok); }
.stat .from { font-size: 13px; color: var(--ink-2); }

.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; padding: 2px 10px 2px 8px; border-radius: 999px; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.ok { color: var(--ok); background: var(--ok-tint); }
.pill.warn { color: var(--warn); background: var(--warn-tint); }
.pill.bad { color: var(--bad); background: var(--bad-tint); }
.pill.bad::before { border-radius: 1px; transform: rotate(45deg); }
.pill.info { color: var(--ink-2); background: var(--sheet-2); }
.pick { display: flex; flex-wrap: wrap; gap: 8px; }
.pick label { display: inline-flex; gap: 7px; align-items: center; border: 1.5px solid var(--rule); border-radius: 999px; padding: 5px 13px 5px 10px; font-size: 13.5px; cursor: pointer; background: var(--sheet); }
.pick label:has(input:checked) { border-color: var(--ink); background: var(--ink); color: var(--sheet); }
.pick input { margin: 0; accent-color: var(--signal); }
.bigline { display: flex; flex-wrap: wrap; gap: 6px 22px; align-items: baseline; }
.bignum { font-family: var(--font-display); font-size: 30px; line-height: 1.1; }
.bignum.bad { color: var(--signal); } .bignum.ok { color: var(--ok); }
.task-list { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; }
.task-list li::marker { font-weight: 700; color: var(--ink-2); }
.hintrow { display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 1px solid var(--rule); }
.hintrow b { font-weight: 600; }
.src { font-size: 12.5px; color: var(--ink-2); font-style: italic; }
.reflect { white-space: pre-wrap; overflow-wrap: anywhere; padding: 14px 16px; background: var(--cobalt-tint); border-radius: 4px 14px 14px 14px; min-height: 40px; }
.news { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 820px) { .news { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.newsitem { position: relative; padding: 16px 16px 14px; background: var(--signal-tint); border-radius: 4px 14px 14px 14px; display: flex; flex-direction: column; gap: 6px; }
.newsitem b { font-family: var(--font-display); font-weight: 400; font-size: 16px; color: var(--signal); }
.ai-answer { display: flex; flex-direction: column; gap: 0; border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; }
.ai-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; padding: 12px 14px; border-bottom: 1px solid var(--rule); align-items: start; }
.ai-row:last-child { border-bottom: 0; }
.ai-row .txt { line-height: 1.5; }
.ai-row .txt .ix { color: var(--ink-2); font-weight: 600; margin-right: 6px; }
.ai-row .ctl { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; min-width: 0; }
.ai-row .why { grid-column: 1 / -1; }
.ai-row .why select { width: 100%; font-size: 13px; padding: 6px 10px; }
.ai-row .verdict { grid-column: 1 / -1; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
.ai-row.flag { background: var(--sheet-2); }
@media (max-width: 600px) { .ai-row { grid-template-columns: minmax(0, 1fr); } .ai-row .ctl { align-items: flex-start; } }
.checkitems { display: flex; flex-direction: column; gap: 6px; }
.checkitem { display: flex; gap: 10px; align-items: baseline; font-size: 14px; }
.checkitem .dot { flex: none; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--rule-2); transform: translateY(1px); }
.checkitem.on .dot { background: var(--green); border-color: var(--green); }
details > summary { cursor: pointer; color: var(--ink-2); font-size: 13.5px; }

/* ---------- Chart ---------- */
.chart-wrap { position: relative; width: 100%; }
.chart-wrap svg { width: 100%; height: auto; display: block; font-family: var(--font-body); }
.chart-wrap .grid line { stroke: var(--c-grid); stroke-width: 1; }
.chart-wrap .axis text { fill: var(--ink-2); font-size: 11px; }
.chart-wrap .axis line, .chart-wrap .axis path { stroke: var(--rule-2); stroke-width: 1; }
.chart-wrap .ln { fill: none; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart-wrap .ln.pv { stroke: var(--c-pv); }
.chart-wrap .ln.ev { stroke: var(--c-ev); }
.chart-wrap .ln.ac { stroke: var(--c-ac); }
.chart-wrap .ln.fc { stroke-dasharray: 6 5; stroke-width: 2; }
.chart-wrap .pt { stroke: var(--sheet); stroke-width: 2; }
.chart-wrap .pt.pv { fill: var(--c-pv); } .chart-wrap .pt.ev { fill: var(--c-ev); } .chart-wrap .pt.ac { fill: var(--c-ac); }
.chart-wrap .lab { font-size: 11.5px; font-weight: 600; fill: var(--ink); }
.chart-wrap .lab.muted { fill: var(--ink-2); font-weight: 500; }
.chart-wrap .vline { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 3 4; }
.chart-wrap .vline.now { stroke: var(--signal); stroke-dasharray: none; stroke-width: 1.5; }
.chart-wrap .hline { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 2 4; }
.chart-wrap .cross { stroke: var(--ink); stroke-width: 1; opacity: .5; }
.chart-wrap .hit { fill: transparent; cursor: crosshair; }
.tooltip { position: absolute; pointer-events: none; background: var(--ink); color: var(--sheet); font-size: 12.5px; line-height: 1.4; padding: 8px 10px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, calc(-100% - 10px)); z-index: 3; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
.tooltip b { font-weight: 600; }
.tooltip i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12.5px; color: var(--ink-2); align-items: center; }
.legend i { display: inline-block; width: 22px; height: 0; border-top: 2.5px solid currentColor; margin-right: 7px; vertical-align: 3px; }
.legend i.dash { border-top-style: dashed; }
.legend .pv { color: var(--c-pv); } .legend .ev { color: var(--c-ev); } .legend .ac { color: var(--c-ac); }
.legend span span { color: var(--ink-2); }

/* ---------- Rail ---------- */
.rail { background: var(--sheet); border-radius: 16px; display: flex; flex-direction: column; min-width: 0; border-top: 6px solid var(--band); }
@media (min-width: 1100px) { .rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 14px); max-height: calc(100vh - 28px); overflow: auto; } }
.rail-sec { padding: 16px 18px; border-bottom: 1px solid var(--rule); display: flex; flex-direction: column; gap: 10px; }
.rail-sec:last-child { border-bottom: 0; }
.rail h3 { font-family: var(--font-display); font-weight: 400; font-size: 16px; }
.rail h4 { font-size: 13px; color: var(--ink-2); font-weight: 600; }
.goal { display: flex; gap: 10px; align-items: baseline; font-size: 14px; }
.goal .dot { flex: none; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--rule-2); transform: translateY(1px); }
.goal.on .dot { background: var(--green); border-color: var(--green); }
.tip { font-size: 14px; background: var(--cobalt-tint); }
.tip .q { color: var(--ink-2); font-style: italic; }
.score { display: flex; align-items: baseline; gap: 8px; }
.score b { font-family: var(--font-display); font-weight: 400; font-size: 26px; }
.empty { padding: 26px 18px; text-align: center; color: var(--ink-2); border: 2px dashed var(--rule-2); border-radius: 14px; }
@media (prefers-reduced-motion: no-preference) { .btn, .step .dot, .pick label { transition: background-color .15s ease, border-color .15s ease, box-shadow .15s ease; } }
</style>

<header class="band">
  <div class="wrap">
    <div class="band-top">
      <div class="brand">
        <h1>Освоенный объём</h1>
        <p>Практикум 7: освоенный объём — скажите правлению правду цифрами. Вы считаете показатели сами, читаете график, находите ошибки в готовом расчёте ИИ и формулируете решение.</p>
      </div>
      <span class="casetag">Кейс «Витрина», вымышленные данные</span>
    </div>
    <div class="ruler" id="ruler" aria-hidden="true"></div>
    <nav class="steps" aria-label="Шаги практикума" id="steps"></nav>
  </div>
</header>

<div class="wrap">
  <div class="workspace">
    <main class="panel" id="main"></main>
    <aside class="rail" id="rail" aria-label="Прогресс и коуч"></aside>
  </div>
</div>

<script>
/* ================= Data: programme «Доставка еды», week 20 of 35 ================= */
const BAC = 120, WEEKS = 35, NOW = 20;

function chart() {

  const X = (w) => L + (W - L - R) * w / 42, Y = (v) => T + (H - T - B) * (1 - v / 160);
  const fcAC = [[NOW, AC], [42, EAC]], fcEV = [[NOW, EV], [42, BAC]];

  const svg = s('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'График освоенного объёма: плановый объём, освоенный объём и фактические затраты по неделям, с прогнозом до недели 42' });

  for (let w = 0; w <= 42; w += 5) ax.append(s('text', { x: X(w), y: H - B + 18, 'text-anchor': 'middle', text: String(w) }));
  ax.append(s('text', { x: X(42) + 8, y: H - B + 18, 'text-anchor': 'start', text: '42' }));
  ax.append(s('text', { x: (L + W - R) / 2, y: H - 8, 'text-anchor': 'middle', text: 'неделя программы' }));
  ax.append(s('text', { x: 14, y: T - 10, 'text-anchor': 'start', text: 'млн ₸, нарастающим итогом' }));
  svg.append(ax);
  // BAC line and markers
  svg.append(s('line', { class: 'hline', x1: L, x2: W - R, y1: Y(BAC), y2: Y(BAC) }));
  svg.append(s('text', { class: 'lab muted', x: L + 4, y: Y(BAC) - 5, text: 'BAC 120' }));
  svg.append(s('line', { class: 'vline now', x1: X(NOW), x2: X(NOW), y1: T, y2: H - B }));
  svg.append(s('text', { class: 'lab', x: X(NOW) - 5, y: T + 10, 'text-anchor': 'end', text: 'сегодня: неделя 20', style: 'fill: var(--signal)' }));
  svg.append(s('line', { class: 'vline', x1: X(WEEKS), x2: X(WEEKS), y1: T, y2: H - B }));
  svg.append(s('text', { class: 'lab muted', x: X(WEEKS) + 4, y: T + 10, text: 'запуск: 35' }));
  // lines
  svg.append(s('path', { class: 'ln pv', d: path(PLAN) }));
  svg.append(s('path', { class: 'ln ev fc', d: path(fcEV) }));
  svg.append(s('path', { class: 'ln ac fc', d: path(fcAC) }));
  svg.append(s('path', { class: 'ln ev', d: path(FACT_EV) }));
  svg.append(s('path', { class: 'ln ac', d: path(FACT_AC) }));
  // points
  [['pv', PLAN], ['ev', FACT_EV], ['ac', FACT_AC]].forEach(([c, pts]) => pts.forEach((p) => svg.append(s('circle', { class: 'pt ' + c, cx: X(p[0]), cy: Y(p[1]), r: 4 }))));
  // direct labels
  svg.append(s('text', { class: 'lab', x: X(WEEKS) + 6, y: Y(BAC) + 14, text: 'PV (план)', style: 'fill: var(--c-pv)' }));
  svg.append(s('text', { class: 'lab', x: X(NOW) + 7, y: Y(AC) - 6, text: `AC ${AC}`, style: 'fill: var(--c-ac)' }));
  svg.append(s('text', { class: 'lab', x: X(NOW) + 7, y: Y(EV) + 16, text: `EV ${EV}`, style: 'fill: var(--c-ev)' }));
  svg.append(s('text', { class: 'lab', x: X(42) + 6, y: Y(EAC) + 4, text: `EAC ≈ ${fmt(EAC, 0)}`, style: 'fill: var(--c-ac)' }));
  svg.append(s('text', { class: 'lab muted', x: X(42) + 6, y: Y(BAC) + 22, text: '≈ 42 нед.' }));
  // SV bracket at week 20
  svg.append(s('line', { class: 'cross', x1: X(NOW) + 2, x2: X(NOW) + 2, y1: Y(EV), y2: Y(PV) }));
  svg.append(s('text', { class: 'lab muted', x: X(NOW) - 5, y: (Y(EV) + Y(PV)) / 2 + 4, 'text-anchor': 'end', text: 'SV −12' }));
  // hover layer
  const cross = s('line', { class: 'cross', x1: 0, x2: 0, y1: T, y2: H - B, visibility: 'hidden' });

  svg.append(hit);

  const interp = (pts, w) => { for (let i = 1; i < pts.length; i++) { if (w <= pts[i][0]) { const [a, b] = [pts[i - 1], pts[i]]; return a[1] + (b[1] - a[1]) * (w - a[0]) / (b[0] - a[0]); } } return null; };
  const show = (ev) => {
    const r = svg.getBoundingClientRect(), sx = W / r.width, w = Math.round(Math.min(42, Math.max(0, ((ev.clientX - r.left) * sx - L) / (W - L - R) * 42)));

      h('span', {}, h('i', { style: 'background:var(--c-ev)' }), `EV ${fmt(evv, 0)}`, h('br')),
      h('span', {}, h('i', { style: 'background:var(--c-ac)' }), `AC ${fmt(acv, 0)}`));
    tip.hidden = false; tip.style.left = `${X(w) / sx}px`; tip.style.top = `${Y(Math.max(acv, pv || 0)) / sx}px`;
  };
  hit.addEventListener('mousemove', show); hit.addEventListener('touchstart', (e) => { if (e.touches[0]) show(e.touches[0]); }, { passive: true });

}

        state.downloads ? h('button', { class: 'btn', type: 'button', text: 'Скачать отчёт', onclick: saveReport }) : null,
        h('button', { class: 'btn btn-small', type: 'button', text: 'Начать заново', onclick: resetAll })),
      h('p', { class: 'help', id: 'rep-status', text: 'Отчёт собирает всё, что вы ввели на шагах 1–6, в формате markdown для документа или чата группы.' }))
  ];
}
function finalCard() {
  const checks = finalChecks();
  return [h('h3', { text: 'Что должно быть в докладе' }),
    h('div', { class: 'checkitems' }, checks.map((c) => h('div', { class: 'checkitem' + (c.on ? ' on' : '') }, h('span', { class: 'dot' }), h('span', { text: c.t })))),
    h('p', { class: 'help', text: 'Отметки обновляются по мере написания. Это подсказка о структуре, а не оценка стиля.' })];
}
function refreshFinal() {
  const el = $('#final-checks'); if (el) el.replaceChildren(...finalCard());
  const f = state.final, ready = ['p1', 'p2', 'p3'].every((k) => words(f[k]) >= 6);
  const b = $('#etalon-btn'); if (b && !state.etalon) b.disabled = !ready;
  const hp = $('#final-help'); if (hp) hp.hidden = ready;
  renderSteps(); renderRail();
}
function resetAll() {
  if (!window.confirm('Удалить все ответы и начать практикум заново?')) return;
  store.del(KEY);
  Object.assign(state, { step: 0, unlocked: 0, guess: { budget: '', eac: '', time: '' }, n: {}, chk: {}, shown: {}, hints: {}, mc: {}, mcChecked: false, marks: {}, mtype: {}, markRevealed: false, final: { p1: '', p2: '', p3: '' }, etalon: false });
  render(); window.scrollTo({ top: 0 });
}

/* ---- Report ---- */
function report() {
  const L = [], v = (k) => state.n[k] || '—', p = points(), m = markStatus();
  const st = (i) => { const c = stepScore(i); return state.chk[i] ? `(проверка: верно ${c.ok} из ${c.total})` : '(не проверено)'; };
  L.push('# Практикум 7. Освоенный объём — программа «Доставка еды» (кейс «Витрина»)', '');
  L.push('## 1. Прогноз до расчёта', '', `Уложимся в бюджет: ${(GBUDGET.find((x) => x[0] === state.guess.budget) || ['', '—'])[1]}. Ожидаемая стоимость: ${state.guess.eac || '—'} млн ₸. Ожидаемый запуск: неделя ${state.guess.time || '—'}.`, '');
  L.push(`## 2. Мой расчёт ${st(1)}`, '', '| Пакет | Бюджет | Выполнено, % | Потрачено | EV (мой) |', '|---|---|---|---|---|', ...PK.map((pk) => `| ${pk.n} | ${pk.bac} | ${pk.pct} | ${pk.ac} | ${v('ev_' + pk.k)} |`), '');
  L.push(`EV = ${v('ev')}; PV = 72; AC = 78.`, `SV = ${v('sv')}; CV = ${v('cv')}; SPI = ${v('spi')}; CPI = ${v('cpi')}.`, `EAC = ${v('eac')}; ETC = ${v('etc')}; VAC = ${v('vac')}; TCPI = ${v('tcpi')}; прогноз срока = ${v('dur')} недель.`, '');
  L.push(`## 3. Диаграмма ${st(2)}`, '', `План предусматривал нынешний EV на неделе ${v('es')}; отставание ${v('lag')} недели.`, '');
  L.push('## 4. Чтение показателей', '', ...MC.map((mc) => `- ${mc.q} — ${(mc.opts.find((o) => o[0] === state.mc[mc.k]) || ['', '—'])[1]}${state.mcChecked ? (mcStatus()[mc.k].st === 'ok' ? ' (верно)' : ' (неверно)') : ''}`), '');
  L.push('## 5. Ошибки в расчёте ИИ', '', state.markRevealed ? `Найдено ${m.found} из ${TOTAL_ERR}, причина названа верно: ${m.typed}, ложных тревог: ${m.falseAlarm}.` : 'Не сверено.', '',
    ...AI_ROWS.map((r, i) => `${i + 1}. ${state.marks[r.k] === 'bad' ? 'ОШИБКА' : state.marks[r.k] === 'ok' ? 'верно' : '—'}${state.mtype[r.k] ? ` — ${(ERR_TYPES.find((e) => e[0] === state.mtype[r.k]) || ['', ''])[1]}` : ''}: ${r.t}`), '');
  L.push('## 6. Доклад правлению', '', `1. ${state.final.p1 || '—'}`, `2. ${state.final.p2 || '—'}`, `3. ${state.final.p3 || '—'}`, '', 'Чек-лист: ' + finalChecks().map((c) => `${c.on ? '[x]' : '[ ]'} ${c.t}`).join('; '), '');
  L.push('## Итог', '', `Баллы: ${p.total} из ${p.max} (расчёт ${p.calc}/16, диаграмма ${p.chart}/2, чтение ${p.read}/4, ошибки ИИ ${p.ai}/8, выводы ${p.final}/6).`);
  return L.join('\n');
}
async function copyText(t, btn) {
  try { await navigator.clipboard.writeText(t); if (btn) { const o = btn.textContent; btn.textContent = 'Скопировано'; setTimeout(() => (btn.textContent = o), 1600); } }
  catch (e) { const el = $('#rep-status'); if (el) el.textContent = 'Браузер не дал скопировать. Попробуйте кнопку «Скачать отчёт».'; }
}
async function saveReport() {
  try { await state.downloads.save({ filename: 'praktikum-7-osvoennyj-obem.md', data: report() }); }
  catch (e) { const el = $('#rep-status'); if (el && e && e.code !== 'declined') el.textContent = 'Файл не сохранён. Скопируйте отчёт кнопкой рядом.'; }
}

/* ---- Rail ---- */
const GOALS = ['Посчитали EV, отклонения и индексы', 'Прочитали отставание по графику', 'Объяснили показатели словами', 'Нашли четыре ошибки ИИ', 'Написали доклад правлению'];
function renderRail() {
  const p = points();
  const kids = [h('div', { class: 'rail-sec' }, h('h3', { text: 'Пункты задания' }), ...GOALS.map((t, i) => h('div', { class: 'goal' + (stepDone(i + 1) ? ' on' : '') }, h('span', { class: 'dot' }), h('span', { text: t }))),
    h('div', { class: 'score' }, h('b', { text: `${p.total}` }), h('span', { class: 'help', text: `из ${p.max} баллов` })))];
  const tip = railTip();
  if (tip) kids.push(h('div', { class: 'rail-sec tip' }, h('h4', { text: 'Коуч' }), h('p', { text: tip.b }), tip.q ? h('p', { class: 'q', text: tip.q }) : null));
  kids.push(h('div', { class: 'rail-sec' }, h('h4', { text: 'Опорные числа кейса' }),
    h('p', { class: 'legend', text: 'BAC 120 млн ₸ · срок 35 недель · сегодня неделя 20 · PV 72 · AC 78 · шесть пакетов работ' })));
  $('#rail').replaceChildren(...kids);
}
function railTip() {
  const st = state.step;
  if (st === 0) return { b: 'Прочитайте оба приложения и запишите прогноз. «65% бюджета за 57% срока» — не ответ: без освоенного объёма неизвестно, сколько работы сделано.', q: 'Что из таблицы пакетов отличает EV от AC?' };
  if (st === 1 || st === 2) {
    const c = stepScore(st);
    if (!state.chk[st]) return { b: 'Решите сами, затем нажмите «Проверить». Формулы — прямо под вопросами, подсказки — внизу.' };
    if (c.ok < c.total) return { b: 'Проверка показала, где ошибка. Под каждой красной отметкой — подсказка, в чём путаница.', q: state.chk[st] >= 2 ? 'Ответ можно открыть кнопкой «Показать ответ», но сначала попробуйте ещё раз.' : null };
    return st === 1 ? { b: 'Расчёт сходится. Обратите внимание на пару ETC 78 против остатка бюджета 42.', q: 'Какое из десяти чисел вы бы назвали правлению первым?' } : { b: 'Отставание 3 недели сегодня превращается в 7 недель к запуску: SPI растягивает весь остаток.', q: 'Почему пунктир EV доходит до 120 только на неделе 42?' };
  }
  if (st === 3) return state.mcChecked ? { b: 'Индексы переведены в смысл. Теперь посмотрите, как с теми же числами обошёлся ИИ.' } : { b: 'Каждый индекс — отношение «получили ÷ ожидали». Проверяйте каждый вариант ответа этой фразой.', q: 'Чем TCPI отличается от CPI по смыслу?' };
  if (st === 4) return state.markRevealed ? { b: 'Каждую найденную ошибку можно превратить в уточняющий вопрос к ИИ: «покажи формулу и порядок операндов».' } : { b: 'Держите рядом свой расчёт с шага 2. Сверяйте не выводы, а формулы: порядок вычитания и деления.', q: 'Какая строка звучит уверенно, но не следует из чисел?' };
  return state.etalon ? { b: 'Сравните с эталоном: есть ли у вас цена каждого варианта и срок, до которого нужно решение?' } : { b: 'Правлению нужны три вещи: где мы, куда идём, что решить. По одному предложению на каждую.', q: 'Какой вопрос финансового директора будет самым неудобным?' };
}

/* ================= Boot ================= */
function buildRuler() {
  const r = $('#ruler'); if (!r) return;
  for (let w = 1; w <= 42; w++) {
    const cls = [w < NOW ? 'past' : '', w === NOW ? 'mk now' : '', w === WEEKS ? 'mk launch' : '', w > WEEKS && w < 42 ? 'fc' : '', w === 42 ? 'mk fcend' : '', w % 5 === 0 && w !== NOW && w !== WEEKS && w !== 40 ? 'wk' : ''].join(' ').trim();
    const lab = w === NOW ? 'сегодня: неделя 20' : w === WEEKS ? 'запуск по плану: 35' : w === 42 ? 'прогноз: 42' : null;
    const short = w === NOW ? 'н.20' : w === WEEKS ? 'н.35' : w === 42 ? 'н.42' : null;
    r.append(h('span', { class: cls, 'data-lab': lab, 'data-short': short, 'data-wk': w % 5 === 0 ? `н.${w}` : null, title: `Неделя ${w}${lab ? ': ' + lab : ''}` }));
  }
}
function boot() {
  if (state.step > state.unlocked) state.step = state.unlocked;
  buildRuler(); render();
  (async () => { try { if (window.claude && window.claude.use) { state.downloads = await window.claude.use('downloads'); render(); } } catch (e) { /* downloads not available */ } })();
}
boot();
</script>
