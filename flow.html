<title>Метрики потока — Корзина</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
/* Layout: the marketplace operations board's control desk. A dark band carries the 20 working days of weeks 6–9,
   with the Thursday release committee marked in signal orange; below, a working sheet beside a logbook rail.
   Signal orange is reserved for waiting and the committee: that is where this flow loses its time. */
:root {
  --paper: #E6E8E3;      /* concrete */
  --sheet: #FBFBF9;
  --sheet-2: #F0F1ED;
  --ink: #1D2026;
  --ink-2: #5A6068;
  --rule: #D3D6CF;
  --rule-2: #B4B9B0;
  --band: #20242B;       /* graphite control band, same in both themes */
  --band-ink: #E9EBE6;
  --band-ink-2: #9AA1AB;
  --signal: #F2551D;     /* critical path, launch */
  --signal-tint: #FDE3D8;
  --cobalt: #2D4FE3;     /* teams, adaptive work */
  --cobalt-tint: #E2E7FC;
  --amber: #D9960B;      /* billing windows */
  --violet: #7650C4;
  --green: #2D8A57;
  --cal: #3A414C;        /* calendar works */
  --ok: #23804A; --ok-tint: #DDF0E3;
  --warn: #9A6400; --warn-tint: #F8ECCB;
  --bad: #C42B2B; --bad-tint: #F8DEDC;
  --on-fill: #FFFFFF;
  --c-work: #2D4FE3;     /* chart: work, finished */
  --c-wait: #F2551D;     /* chart: waiting, started */
  --font-display: "Dela Gothic One", "Golos Text", system-ui, sans-serif;
  --font-body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #14161A; --sheet: #1D2026; --sheet-2: #252930; --ink: #ECEDE9; --ink-2: #A2A8B0; --rule: #333840; --rule-2: #4A5059;
    --band: #0C0E11; --band-ink: #ECEDE9; --band-ink-2: #8E959F;
    --signal: #FF7341; --signal-tint: #44231A; --cobalt: #8EA4FF; --cobalt-tint: #232C52; --amber: #F2B84B; --violet: #B79BF0; --green: #6CCB93; --cal: #B9C0CA;
    --ok: #6CCB93; --ok-tint: #173323; --warn: #F2C14E; --warn-tint: #3A2D0E; --bad: #FF8A80; --bad-tint: #401A18;
    --on-fill: #14161A; --c-work: #6F8AF7; --c-wait: #E45A2A; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #14161A; --sheet: #1D2026; --sheet-2: #252930; --ink: #ECEDE9; --ink-2: #A2A8B0; --rule: #333840; --rule-2: #4A5059;
  --band: #0C0E11; --band-ink: #ECEDE9; --band-ink-2: #8E959F;
  --signal: #FF7341; --signal-tint: #44231A; --cobalt: #8EA4FF; --cobalt-tint: #232C52; --amber: #F2B84B; --violet: #B79BF0; --green: #6CCB93; --cal: #B9C0CA;
  --ok: #6CCB93; --ok-tint: #173323; --warn: #F2C14E; --warn-tint: #3A2D0E; --bad: #FF8A80; --bad-tint: #401A18;
  --on-fill: #14161A; --c-work: #6F8AF7; --c-wait: #E45A2A; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; padding-inline: 16px; padding-block: 0 56px; font-variant-numeric: tabular-nums; }
.wrap { max-width: 1320px; margin-inline: auto; }
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2.5px solid var(--cobalt); outline-offset: 2px; }
.mono { font-variant-numeric: tabular-nums; }

/* ---------- Control band: 20 working days of weeks 6–9, committee Thursdays ---------- */
.band { background: var(--band); color: var(--band-ink); margin-inline: -16px; padding-inline: 16px; padding-block: 26px 0; }
.band-top { display: flex; flex-wrap: wrap; gap: 14px 40px; align-items: end; justify-content: space-between; }
.brand { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.brand h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(26px, 4vw, 40px); line-height: 1; letter-spacing: -0.01em; }
.brand p { color: var(--band-ink-2); max-width: 62ch; font-size: 14.5px; }
.casetag { font-size: 13px; color: var(--band-ink-2); border: 1px solid #454b55; border-radius: 999px; padding: 4px 12px; white-space: nowrap; }

.ruler { margin-top: 26px; display: grid; grid-template-columns: repeat(20, minmax(0, 1fr)); gap: 3px; align-items: end; height: 54px; }
.ruler span { height: 12px; border-radius: 3px; background: #343a44; position: relative; }
.ruler span.wk::before { content: attr(data-wk); position: absolute; bottom: 30px; left: 0; font-size: 11.5px; color: var(--band-ink-2); white-space: nowrap; }
.ruler span.thu { height: 26px; background: var(--signal); }
.ruler span.thu::after { content: "комитет"; position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); font-size: 11px; font-weight: 600; color: var(--signal); white-space: nowrap; }
.ruler span.now { outline: 2px solid var(--band-ink); outline-offset: 2px; }
@media (max-width: 640px) { .ruler span.thu::after { content: "К"; } .ruler span.wk::before { content: attr(data-short); } }

.steps { position: relative; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); padding-block: 22px 24px; border-top: 1px solid #3a4049; margin-top: 16px; }
.steps::before { content: ""; position: absolute; left: 14px; right: 14px; top: 36px; height: 3px; background: #3e444e; border-radius: 3px; }
.step { appearance: none; position: relative; text-align: left; cursor: pointer; border: 0; background: transparent; color: var(--band-ink); padding: 0 10px 0 0; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.step .dot { width: 31px; height: 31px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; background: var(--band); border: 3px solid #5b626d; color: var(--band-ink-2); position: relative; z-index: 1; }
.step .t { font-weight: 600; font-size: 14px; line-height: 1.25; }
.step .s { font-size: 12.5px; color: var(--band-ink-2); line-height: 1.3; }
.step:hover .dot { border-color: var(--band-ink); }
.step.done .dot { background: var(--green); border-color: var(--green); color: var(--band); }
.step[aria-current="step"] .dot { background: var(--signal); border-color: var(--signal); color: var(--band); box-shadow: 0 0 0 5px rgba(242, 85, 29, .25); }
.step.locked { cursor: not-allowed; }
.step.locked .dot { border-style: dashed; }
.step.locked .t, .step.locked .s { color: #6d7480; }
@media (max-width: 860px) { .step .s { display: none; } .step .t { font-size: 12px; } }
@media (max-width: 520px) { .step .t { display: none; } }

/* ---------- Flow specific ---------- */
table.calc td { vertical-align: middle; }
table.calc input { width: 4.6em; padding: 6px 4px; text-align: center; border-radius: 8px; font-weight: 600; font-size: 15px; }
table.calc tr.wip td:nth-child(2) { font-style: italic; }
.type { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.type i { width: 10px; height: 10px; border-radius: 2px; flex: none; background: var(--ink-2); }
.type.incident i { background: var(--bad); transform: rotate(45deg); }
.type.client i { background: var(--cobalt); border-radius: 50%; }
.type.site i { background: var(--cal); }
.type.planned i { background: var(--green); }
.type.improve i { background: var(--violet); border-radius: 50% 0; }
.kind { font-size: 12px; color: var(--ink-2); }
.inline-inputs { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.inline-inputs input { text-align: center; font-weight: 600; }

/* Timeline of 16 tasks over 20 days */
.tl-wrap { overflow-x: auto; border-radius: 12px; background: var(--sheet-2); }
.tl { min-width: 680px; display: grid; grid-template-columns: 200px minmax(0, 1fr); font-size: 12.5px; }
.tl-lab .type { white-space: normal; line-height: 1.25; }
.tl-lab { padding: 4px 10px; border-bottom: 1px solid var(--rule); background: var(--sheet); display: flex; gap: 8px; align-items: center; min-width: 0; }
.tl-lab b { font-variant-numeric: tabular-nums; width: 2.2em; flex: none; }
.tl-track { position: relative; display: grid; grid-template-columns: repeat(20, minmax(0, 1fr)); align-items: center; border-bottom: 1px solid var(--rule); min-height: 30px;
  background-image: repeating-linear-gradient(90deg, transparent 0, transparent calc(100% / 4 - 1px), var(--rule-2) calc(100% / 4 - 1px), var(--rule-2) calc(100% / 4)); }
.tl-head { min-height: 26px; background-color: var(--sheet); border-bottom: 2px solid var(--ink); font-size: 11.5px; color: var(--ink-2); font-weight: 600; }
.tl-head span { grid-row: 1; padding-left: 3px; }
.tl-thu { grid-row: 1; height: 100%; width: 0; justify-self: center; border-left: 2px solid var(--signal); opacity: .55; z-index: 0; }
.seg { grid-row: 1; height: 16px; z-index: 1; }
.seg.work { background: var(--c-work); border-radius: 0 999px 999px 0; }
.seg.work.solo { border-radius: 999px; }
.seg.wait { border: 1.5px solid var(--c-wait); background: repeating-linear-gradient(135deg, var(--c-wait) 0 2.5px, transparent 2.5px 6px); border-radius: 999px 0 0 999px; }
.seg.wait.solo { border-radius: 999px; }
.seg.open { background: transparent; border: 1.5px dashed var(--c-work); border-left: 0; border-radius: 0 4px 4px 0; }
.seg.open.solo { border-left: 1.5px dashed var(--c-work); border-radius: 4px; }
.seg.sla { grid-row: 1; height: 100%; width: 0; border-left: 2px dashed var(--ink); justify-self: end; z-index: 2; }
.lg { display: inline-block; width: 22px; height: 10px; margin-right: 6px; vertical-align: -1px; border-radius: 999px; }
.lg.work { background: var(--c-work); }
.lg.wait { border: 1.5px solid var(--c-wait); background: repeating-linear-gradient(135deg, var(--c-wait) 0 2.5px, transparent 2.5px 6px); }
.lg.open { border: 1.5px dashed var(--c-work); }
.lg.thu { width: 0; height: 14px; border-left: 2px solid var(--signal); border-radius: 0; }

/* Cumulative flow diagram */
.cfd-grid { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 900px) { .cfd-grid { grid-template-columns: 260px minmax(0, 1fr); } }
table.cum input { width: 4em; padding: 5px 4px; text-align: center; border-radius: 8px; font-weight: 600; }
table.cum td, table.cum th { padding: 7px 8px; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--ink-2); font-size: 12px; font-family: var(--font-body); }
.chart .lab { font-weight: 600; fill: var(--ink); }
.chart .grid line { stroke: var(--rule); stroke-width: 1; }
.chart .axis { stroke: var(--ink-2); stroke-width: 1; }
.chart .hit { fill: transparent; }
.chart .hit:hover { fill: color-mix(in srgb, var(--ink) 6%, transparent); }
.chart-wrap { position: relative; min-width: 0; }
.tooltip { position: absolute; pointer-events: none; background: var(--band); color: var(--band-ink); font-size: 12.5px; padding: 7px 10px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, -110%); line-height: 1.4; }
.compare { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
.stat { padding: 12px 14px; background: var(--sheet-2); border-radius: 10px; display: flex; flex-direction: column; gap: 2px; }
.stat b { font-family: var(--font-display); font-weight: 400; font-size: 24px; line-height: 1.15; }
.stat.hot b { color: var(--signal); }
.radio-list { display: flex; flex-direction: column; gap: 8px; }
.radio-list label { display: flex; gap: 10px; align-items: baseline; padding: 9px 12px; border: 1.5px solid var(--rule); border-radius: 10px; cursor: pointer; background: var(--sheet); }
.radio-list label:has(input:checked) { border-color: var(--ink); }
.radio-list input { accent-color: var(--signal); }
.note { font-size: 13px; color: var(--ink-2); border-left: 3px solid var(--rule-2); padding-left: 10px; }
.optrow3 { display: grid; gap: 10px; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1fr); }
@media (max-width: 700px) { .optrow3 { grid-template-columns: minmax(0, 1fr); } }
table.read select { width: auto; min-width: 10em; padding: 6px 8px; }
table.read td:first-child { white-space: nowrap; }
/* ---------- Working area ---------- */
.workspace { display: grid; gap: 22px; grid-template-columns: minmax(0, 1fr); align-items: start; padding-top: 24px; }
@media (min-width: 1100px) { .workspace { grid-template-columns: minmax(0, 1fr) 320px; } }
.panel { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.card { background: var(--sheet); border-radius: 16px; padding: 22px 24px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card > h3, .sec-h { font-family: var(--font-display); font-weight: 400; font-size: 19px; line-height: 1.2; letter-spacing: -0.005em; }
.lead { color: var(--ink-2); max-width: 72ch; }
.lbl { font-size: 13px; color: var(--ink-2); font-weight: 600; }
.grid2 { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 820px) { .grid2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
@media (max-width: 600px) { .card { padding: 18px 16px; border-radius: 12px; } }

.btn { appearance: none; cursor: pointer; border: 1.5px solid var(--ink); background: transparent; border-radius: 999px; padding: 8px 18px; font-weight: 600; line-height: 1.2; }
.btn:hover { background: var(--sheet-2); }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.btn-primary { background: var(--ink); color: var(--sheet); }
.btn-primary:hover { background: var(--ink); filter: brightness(1.25); }
.btn-small { padding: 5px 13px; font-size: 13px; border-width: 1px; border-color: var(--rule-2); font-weight: 500; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.status { min-height: 20px; font-size: 13.5px; color: var(--ink-2); }
.status.err { color: var(--bad); }

textarea, input[type="text"], input[type="number"], select { width: 100%; border: 1.5px solid var(--rule); background: var(--sheet); border-radius: 10px; padding: 9px 12px; }
textarea:hover, input:hover, select:hover { border-color: var(--rule-2); }
textarea { resize: vertical; line-height: 1.55; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field-top { display: flex; justify-content: space-between; gap: 8px 14px; align-items: baseline; flex-wrap: wrap; }
.field .help, .help { font-size: 13px; color: var(--ink-2); }

/* Tables */
table.data { width: 100%; border-collapse: collapse; font-size: 14px; }
table.data th, table.data td { text-align: left; padding: 10px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
table.data th { font-size: 12.5px; color: var(--ink-2); font-weight: 600; border-bottom: 2px solid var(--ink); }
table.data tbody tr:last-child td { border-bottom: 0; }
.tscroll { overflow-x: auto; }
table.mine td { vertical-align: middle; }
table.mine input { width: 4.2em; padding: 6px 4px; text-align: center; border-radius: 8px; font-weight: 600; font-size: 15px; }
table.mine select { width: auto; }
table.mine tr.given td { color: var(--ink-2); }
.rowhint { font-size: 12.5px; color: var(--ink-2); margin-top: 4px; max-width: 34ch; }

/* Case */
.news { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 820px) { .news { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.newsitem { position: relative; padding: 16px 16px 14px; background: var(--signal-tint); border-radius: 4px 14px 14px 14px; display: flex; flex-direction: column; gap: 6px; }
.newsitem b { font-family: var(--font-display); font-weight: 400; font-size: 16px; color: var(--signal); }
.task-list { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; }
.task-list li::marker { font-weight: 700; color: var(--ink-2); }

/* Prompt builder: one form, five rows */
.rctfo { display: flex; flex-direction: column; background: var(--sheet); border-radius: 16px; overflow: hidden; }
.part { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 6px 22px; padding: 18px 24px 18px 20px; border-bottom: 1px solid var(--rule); border-left: 5px solid var(--rule); }
.part:last-child { border-bottom: 0; }
.part > .field-top { grid-column: 1; grid-row: 1 / span 3; flex-direction: column; align-items: start; justify-content: start; gap: 4px; }
.part > textarea, .part > .actions, .part > .checks { grid-column: 2; }
.part.ok { border-left-color: var(--ok); }
.part.warn { border-left-color: var(--amber); }
.part.bad { border-left-color: var(--bad); }
.part-name { font-family: var(--font-display); font-weight: 400; font-size: 17px; }
@media (max-width: 700px) { .part { grid-template-columns: minmax(0, 1fr); padding: 16px; } .part > .field-top, .part > textarea, .part > .actions, .part > .checks { grid-column: 1; grid-row: auto; } }
.checks { display: flex; flex-wrap: wrap; gap: 6px; }
.chk { font-size: 12.5px; padding: 2px 10px 2px 8px; border-radius: 999px; color: var(--ink-2); background: var(--sheet-2); display: inline-flex; align-items: center; gap: 6px; }
.chk::before { content: ""; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid currentColor; flex: none; }
.chk.on { color: var(--ok); background: var(--ok-tint); }
.chk.on::before { background: currentColor; }
.chk.alert { color: var(--bad); background: var(--bad-tint); }
.chk.alert::before { border-radius: 1px; background: currentColor; transform: rotate(45deg); }
.preview { margin: 0; padding: 14px; background: var(--sheet-2); border-radius: 10px; max-height: 340px; overflow: auto; font-family: ui-monospace, Menlo, monospace; font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.svc { color: var(--ink-2); }
details > summary { cursor: pointer; color: var(--ink-2); font-size: 13.5px; }

/* ---------- Roadmap board ---------- */
.gantt-wrap { overflow-x: auto; border-radius: 12px; background: var(--sheet-2); }
.gantt { min-width: 820px; display: grid; grid-template-columns: 200px minmax(0, 1fr); font-size: 13px; }
.g-lab { padding: 6px 12px; border-bottom: 1px solid var(--rule); display: flex; flex-direction: column; justify-content: center; min-width: 0; background: var(--sheet); }
.g-lab .ln { font-size: 11.5px; color: var(--ink-2); }
.g-lab .nm { overflow-wrap: anywhere; line-height: 1.3; font-weight: 500; }
.g-track { position: relative; border-bottom: 1px solid var(--rule); min-height: 44px; display: grid; grid-template-columns: repeat(35, minmax(0, 1fr)); align-items: center;
  background-image: repeating-linear-gradient(90deg, transparent 0, transparent calc(100% / 7 - 1px), var(--rule) calc(100% / 7 - 1px), var(--rule) calc(100% / 7)),
    repeating-linear-gradient(90deg, transparent 0, transparent calc(100% / 35 - 1px), color-mix(in srgb, var(--rule) 45%, transparent) calc(100% / 35 - 1px), color-mix(in srgb, var(--rule) 45%, transparent) calc(100% / 35)); }
.g-head { font-size: 11.5px; color: var(--ink-2); min-height: 30px; background: var(--sheet); border-bottom: 2px solid var(--ink); }
.g-lab.g-head { font-weight: 600; justify-content: end; }
.g-head span { text-align: left; padding-left: 3px; font-weight: 600; }
.bar { grid-row: 1; height: 22px; border-radius: 999px; position: relative; z-index: 2; display: flex; align-items: center; padding: 0 9px; color: var(--on-fill); font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; }
.bar.ms { height: 15px; width: 15px; justify-self: center; transform: rotate(45deg); border-radius: 3px; padding: 0; }
.bar.crit { background: var(--signal) !important; box-shadow: 0 0 0 3px var(--signal-tint); }
.ghost { grid-row: 1; height: 32px; border: 2px dashed var(--ink-2); border-radius: 999px; z-index: 1; }
.ghost.ms { width: 24px; justify-self: center; border-radius: 4px; }
.mark { grid-row: 1; justify-self: end; width: 0; height: 100%; z-index: 0; border-left: 1.5px dashed var(--amber); }
.mark.lane-gate { border-left: 2px solid var(--signal); }
.mark.lane-win, .mark.lane-gate { background: none !important; }
.lane-cal { background: var(--cal); } .lane-agile { background: var(--cobalt); } .lane-gate { background: var(--signal); }
.lane-win { background: var(--amber); } .lane-legal { background: var(--violet); } .lane-mkt { background: var(--green); } .lane-teal { background: var(--ink-2); }
.g-row { display: contents; }
.g-row.bad .g-lab { box-shadow: inset 5px 0 0 var(--bad); }

/* ================= Data: case «Витрина», Appendix 4 and 5 ================= */
const TYPES = {

/* n, type, start day, finish day (null = in progress), days waiting for the release committee */
const TASKS = [

const THURSDAYS = [4, 9, 14, 19];
const CUM = { days: [5, 10, 15, 20], started: [7, 12, 15, 16], finished: [2, 6, 9, 12] };
const SLA = 5;
/* Reading the cumulative flow diagram period by period (slide 96 of the deck) */
const PERIODS = CUM.days.map((d, i) => {
  const s0 = i ? CUM.started[i - 1] : 0, f0 = i ? CUM.finished[i - 1] : 0;
  const ds = CUM.started[i] - s0, df = CUM.finished[i] - f0;
  const prevDf = i ? CUM.finished[i - 1] - (i > 1 ? CUM.finished[i - 2] : 0) : 0;
  return { from: i ? CUM.days[i - 1] : 0, to: d, ds, df, wip: CUM.started[i] - CUM.finished[i],
    pat: ds > df ? 'wide' : ds === df ? 'par' : 'narrow', why: ds < df ? (df > prevDf ? 'clear' : 'stopped') : '' };
});
const PATTERNS = [
  ['par', 'Линии параллельны: сколько начинаем, столько завершаем'],
  ['wide', 'Полоса расширяется: начинаем больше, чем завершаем'],
  ['narrow', 'Полоса сужается']
];
const WHYS = [
  ['clear', 'Разгребаем очередь: завершаем быстрее, чем раньше'],
  ['stopped', 'Перестали брать новое: начинаем меньше, чем раньше']
];

/* Reference answers, computed from the table */
const DONE = TASKS.filter((t) => t.e);
const OPEN = TASKS.filter((t) => !t.e);
const cycleOf = (t) => t.e - t.s + 1;
const ageOf = (t) => TODAY - t.s + 1;
const REF = (() => {
  const cycle = Object.fromEntries(DONE.map((t) => [t.n, cycleOf(t)]));
  const sum = DONE.reduce((a, t) => a + cycleOf(t), 0);
  const tp = [0, 0, 0, 0]; DONE.forEach((t) => tp[Math.ceil(t.e / 5) - 1]++);
  const age = Object.fromEntries(OPEN.map((t) => [t.n, ageOf(t)]));
  const wait = DONE.reduce((a, t) => a + t.w, 0);
  const cl = DONE.filter((t) => t.type === 'client');
  return {
    cycle, sum, avg: sum / DONE.length, tp, age, wait, waitShare: 100 * wait / sum,
    clientActive: cl.reduce((a, t) => a + cycleOf(t) - t.w, 0) / cl.length,
    slaOk: cl.filter((t) => cycleOf(t) <= SLA).length, clientDone: cl.length, wip15: 6
  };
})();
const fmt1 = (x) => (Math.round(x * 10) / 10).toString().replace('.', ',');

const CASE_TEXT = `Кейс «Витрина» (вымышленные данные). Маркетплейс «Корзина», отдел операций: руководитель и 12 специалистов обслуживают 12 городов, где маркетплейс принимает и выдаёт заказы, и работают по Канбану. Руководитель отдела: «Доску мы перестроили, но запросы продавцов снова выполняются дольше, чем положено по договору. Люди работают на пределе, а очередь не уменьшается». С 18-й недели четыре специалиста переходят в команду запуска направления «Доставка еды».

Приложение 4. Типы работ отдела в типичную неделю:
- Сбои и инциденты на витрине: 4–6 в неделю; реагирование не позже 30 минут; за простой витрины продавцам начисляются компенсации по договору.
- Акции и обновления каталога: 3; распродажи, сезонные коллекции, обновление витрины; дата согласуется с продавцами за 2 недели.
- Запросы продавцов: 8–10; подключение нового продавца, заведение карточек товаров, настройка доставки; срок по договору — 5 рабочих дней.
- Работы по запуску «Доставки еды»: 2–4, растёт.
- Улучшения: 1–2; автоматизация проверки карточек товаров, устранение причин повторяющихся сбоев; постоянно откладываются.
Все работы, кроме устранения сбоев, согласуются на релизном комитете. Комитет собирается раз в неделю, по четвергам.

Приложение 5. Данные доски за недели 6–9. Рабочие дни пронумерованы с 1 по 20, текущий день — 20-й. «Дней в ожидании согласования» — сколько дней задача ждала решения комитета (для незавершённых — на текущий момент).
№ | Тип работы | День начала | День завершения | Дней в ожидании согласования
${TASKS.map((t) => `${t.n} | ${TYPES[t.type]} | ${t.s} | ${t.e || '—'} | ${t.w}`).join('\n')}

Накопительные итоги (день: начато всего / завершено всего / в работе): 5: 7/2/5; 10: 12/6/6; 15: 15/9/6; 20: 16/12/4.
Время цикла = день завершения − день начала + 1. Неделя — 5 рабочих дней.`;

const TEMPLATE = {

const SERVICE = `

---

Ответь только JSON такого вида, без текста вокруг:
{"cycle_times":[{"task":1,"days":0}],"avg_cycle_time":0,"throughput_by_week":[0,0,0,0],"ages":[{"task":10,"days":0}],"most_worrying":{"task":0,"why":"…"},"wip_day15":0,"cfd_reading":"…","bottleneck":"…","wait_share_percent":0,"proposals":[{"change":"…","effect":"…","cost":"…"}],"assumptions":["…"]}
throughput_by_week — четыре числа для недель 6, 7, 8, 9 (дни 1–5, 6–10, 11–15, 16–20). wait_share_percent — доля дней ожидания согласования в сумме времени цикла завершённых задач. Если чего-то не просили или данных нет, оставь поле пустым и не выдумывай. Пиши на русском.`;

/* A deliberately flawed answer for practice without Claude */
const FLAWED = {
  cycle_times: DONE.map((t) => ({ task: t.n, days: t.e - t.s })),
  avg_cycle_time: 5.1,
  throughput_by_week: [7, 3, 2, 0],
  ages: OPEN.map((t) => ({ task: t.n, days: TODAY - t.s })),
  most_worrying: { task: 16, why: 'Запрос продавца: срок по договору 5 дней, а задача в работе уже 4 дня.' },
  wip_day15: 6,
  cfd_reading: 'Первые две недели полоса расширяется, потом линии идут параллельно, а в последнюю неделю полоса сужается: отдел ускорился и разгребает очередь.',

    { change: 'Ввести общий лимит незавершённой работы: 3 задачи на отдел', effect: 'Меньше переключений между задачами', cost: 'Часть задач будет ждать дольше' }

};

/* ================= Helpers ================= */
const $ = (s, r = document) => r.querySelector(s);
const str = (v) => (v == null ? '' : String(v)).trim();
const arr = (v) => (Array.isArray(v) ? v : []);

const SVGNS = 'http://www.w3.org/2000/svg';
function s(tag, attrs, ...kids) {

  for (const [k, v] of Object.entries(attrs || {})) { if (v == null || v === false) continue; if (k === 'text') el.textContent = v; else if (k.startsWith('on')) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v); }

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },

const num = (v) => { if (v === '' || v == null) return null; const n = Number(String(v).replace(',', '.').replace('%', '').trim()); return Number.isFinite(n) ? n : null; };
const daysWord = (n) => { const a = Math.abs(n) % 100, b = a % 10; if (a > 10 && a < 20) return 'дней'; if (b === 1) return 'день'; if (b >= 2 && b <= 4) return 'дня'; return 'дней'; };
const typeTag = (t) => h('span', { class: 'type ' + t.type }, h('i', {}), TYPES[t.type]);

/* ================= State ================= */
const saved = store.get('fl.state', {});
const state = {
  step: Number.isInteger(saved.step) ? saved.step : 0,
  guess: { avg: '', cause: '', ...(saved.guess || {}) },
  calc: saved.calc || {}, avg: saved.avg || '', tp: saved.tp || ['', '', '', ''],
  worry: { task: '', why: '', ...(saved.worry || {}) },
  checks2: saved.checks2 || 0, shown2: !!saved.shown2,
  cum: saved.cum || { started: ['', '', '', ''], finished: ['', '', '', ''] },
  q3: { wip: '', cause: '', share: '', active: '', sla: '', ...(saved.q3 || {}) },

function persist() {
  store.set('fl.state', { step: state.step, guess: state.guess, calc: state.calc, avg: state.avg, tp: state.tp, worry: state.worry, checks2: state.checks2, shown2: state.shown2,

    answer: state.answer, raw: state.raw.slice(0, 20000), source: state.source, lastPrompt: state.lastPrompt, attempts: state.attempts.slice(-12),

}

/* ================= Step 2 status: the learner's own calculation ================= */
/* Среднее: принимаем целое число (6) и значение с одним знаком (6,1) */
function avgOk(a) { return Math.abs(a - REF.avg) <= 0.06 || (Number.isInteger(a) && a === Math.round(REF.avg)); }
function avgHint() {
  const a = num(state.avg); if (a == null || avgOk(a)) return null;
  const vals = DONE.map((t) => num(state.calc[t.n]));
  const base = `Среднее = сумма времени цикла завершённых задач ÷ их число. Завершено ${DONE.length} задач (№${DONE.map((t) => t.n).join(', ')}); незавершённые (возраст) в среднее не входят.`;
  if (vals.every((v) => v != null)) {
    const sum = vals.reduce((x, y) => x + y, 0), mine = sum / DONE.length;
    if (Math.abs(a - mine) <= 0.06 || (Number.isInteger(a) && a === Math.round(mine)))
      return `${base} Ваше среднее совпадает с вашей таблицей (${sum} : ${DONE.length}), значит, ошибка в одной из строк «время цикла» выше — сначала исправьте их.`;
    return `${base} По вашему столбцу сумма ${sum} — разделите её на ${DONE.length}. Округлять можно до целого или до одного знака.`;
  }
  return `${base} Сначала заполните время цикла по всем завершённым задачам: сумма берётся из вашего столбца.`;
}
function calcStatus() {
  const rows = {}; let ok = 0;
  TASKS.forEach((t) => {
    const v = num(state.calc[t.n]);
    if (v == null) { rows[t.n] = 'empty'; return; }
    const ref = t.e ? REF.cycle[t.n] : REF.age[t.n];
    rows[t.n] = v === ref ? 'ok' : 'bad'; if (v === ref) ok++;
  });
  const a = num(state.avg);
  const avg = a == null ? 'empty' : avgOk(a) ? 'ok' : 'bad';
  const tp = state.tp.map((x, i) => (num(x) == null ? 'empty' : num(x) === REF.tp[i] ? 'ok' : 'bad'));
  const total = TASKS.length + 1 + 4;
  const okAll = ok + (avg === 'ok') + tp.filter((x) => x === 'ok').length;
  const offByOne = TASKS.filter((t) => rows[t.n] === 'bad' && num(state.calc[t.n]) === (t.e ? REF.cycle[t.n] : REF.age[t.n]) - 1).length;
  return { rows, avg, tp, ok: okAll, total, offByOne, checked: state.checks2 > 0 };
}
function readRow(i) {
  const v = state.read[i], p = PERIODS[i];
  if ([v.ds, v.df, v.wip].some((x) => num(x) == null) || !v.pat || (v.pat === 'narrow' && !v.why)) return 'empty';
  return num(v.ds) === p.ds && num(v.df) === p.df && num(v.wip) === p.wip && v.pat === p.pat && (p.pat !== 'narrow' || v.why === p.why) ? 'ok' : 'bad';
}

Кейс (вымышленный): отдел операций маркетплейса, 12 специалистов, Канбан. За 4 недели (20 рабочих дней) завершено 12 задач, среднее время цикла ${fmt1(REF.avg)} дня, пропускная способность ${REF.tp.join(', ')} задачи в неделю. ${Math.round(REF.waitShare)}% времени цикла завершённых задач — ожидание релизного комитета, который собирается раз в неделю по четвергам. Запрос продавца в работе ровно 3 дня, в срок 5 рабочих дней уложились ${REF.slaOk} из ${REF.clientDone}. Незавершённые: улучшение 13 дней, работы по запуску «Доставки еды» 11, акция / каталог 8, запрос продавца 5 (срок истекает). С 18-й недели 4 специалиста уходят в команду запуска «Доставки еды».
Выводы участника:
1) ${d.p1 || '—'}
2) ${d.p2 || '—'}
3) ${d.p3 || '—'}
Предложенные изменения: ${d.opts.filter((o) => o.name).map((o) => `${o.name} (эффект: ${o.effect || 'не указан'}; цена: ${o.cost || 'не названа'})`).join('; ') || '—'}

Задача: до 150 слов, связным текстом без таблиц и списков: 1) чем выводы сильны; 2) главный риск; 3) два вопроса, которые зададут на защите; 4) один шаг, чтобы усилить выводы за 5 минут. Критерии сильного ответа: опора на числа, причина из данных (ожидание согласования), у каждого изменения названы эффект и цена, сбои не попадают под общий лимит, явный запрос решения. Не пиши готовый ответ за участника. Пиши на русском.`;
  state.reflecting = true; state.reflect = ''; const btn = $('#reflect-btn'); if (btn) { btn.disabled = true; btn.textContent = 'Коуч думает…'; }
  const out = $('#reflect-out'); if (out) { out.hidden = false; out.textContent = 'Коуч думает…'; }
  let err = '';
  try { await state.sample(prompt, { cache: false, onText: ({ text }) => { state.reflect = text; const o = $('#reflect-out'); if (o) o.textContent = text; } }); }
  catch (e) { if (e && e.text) state.reflect = e.text; err = errorCopy(e); }
  finally { state.reflecting = false; persist(); render(); if (err) setStatus(err, 'err'); }
}
function report() {
  const d = state.dec, a = state.answer, L = [];
  L.push('# Практикумы 5 и 6: анализ потока работ отдела операций маркетплейса (кейс «Витрина»)', '');
  L.push('## Мой расчёт', '', '| № | Тип | Что считаем | Мой ответ |', '|---|---|---|---|');
  TASKS.forEach((t) => L.push(`| ${t.n} | ${TYPES[t.type]} | ${t.e ? 'время цикла' : 'возраст'} | ${state.calc[t.n] || '—'} |`));
  L.push('', `Среднее время цикла: ${state.avg || '—'}. Пропускная способность по неделям 6–9: ${state.tp.map((x) => x || '—').join(', ')}.`);
  L.push(`Самая тревожная задача: ${state.worry.task ? '№' + state.worry.task : '—'}. ${state.worry.why || ''}`, '');
  L.push('## Чтение диаграммы', '', '| Дни | Начато | Завершено | В работе | Полоса |', '|---|---|---|---|---|', ...PERIODS.map((p, i) => { const v = state.read[i]; return `| ${p.from + 1}–${p.to} | ${v.ds || '—'} | ${v.df || '—'} | ${v.wip || '—'} | ${(PATTERNS.find((z) => z[0] === v.pat) || ['', '—'])[1].split(':')[0]}${v.why ? ', ' + WHYS.find((z) => z[0] === v.why)[1].split(':')[0].toLowerCase() : ''} |`; }), '');
  L.push('## Затор', '', `В работе на 15-й день: ${state.q3.wip || '—'}. Доля ожидания: ${state.q3.share || '—'}%. Работа над запросом продавца без ожидания: ${state.q3.active || '—'} дн. В срок уложились: ${state.q3.sla || '—'} из ${REF.clientDone}.`, '');
  L.push('## Запрос к ИИ', '', '```', state.lastPrompt || compiled(), '```', '', `Полнота запроса по структуре: ${promptChecks().score}%. Попыток: ${state.attempts.length}.`, '');
  if (a) { L.push('## Сверка ответа ИИ', '', '| Что | ИИ | По данным | Итог |', '|---|---|---|---|'); verify(a).forEach((r) => L.push(`| ${r.area} | ${r.ai.replace(/\|/g, '/')} | ${r.fact.replace(/\|/g, '/')} | ${r.st === 'ok' ? 'верно' : 'ошибка'} |`)); L.push(''); }
  L.push('## Выводы', '', `1. ${d.p1 || '—'}`, `2. ${d.p2 || '—'}`, `3. ${d.p3 || '—'}`, '', 'Изменения:', ...d.opts.filter((o) => o.name).map((o) => `- ${o.name}. Эффект: ${o.effect || 'не указан'}. Цена: ${o.cost || 'не названа'}`), '');
  if (state.reflect) L.push('## Разбор коуча', '', state.reflect, '');
  return L.join('\n');
}
async function saveReport() {
  try { await state.downloads.save({ filename: 'praktikum-5-6-metriki-potoka.md', data: report() }); }
  catch (e) { if (e && e.code !== 'declined') setStatus('Файл не сохранён. Скопируйте отчёт кнопкой рядом.', 'err'); }
}

/* ---- Rail ---- */
function renderRail() {
  const c = promptChecks(), g = goals(), kids = [];
  kids.push(h('div', { class: 'rail-sec' }, h('h3', { text: 'Чему учит практикум' }), ...g.map((x) => h('div', { class: 'goal' + (x.on ? ' on' : '') }, h('span', { class: 'dot' }), h('span', { text: x.k })))));
  kids.push(h('div', { class: 'rail-sec' }, h('h4', { text: `Запрос по структуре · ${c.score}%` }),
    h('div', { class: 'meter' }, ['role', 'ctx', 'task', 'fmt', 'lim'].map((k) => h('i', { class: c[k].st, title: PARTS.find((p) => p.k === k).n }))),
    h('div', { class: 'legend' }, 'Роль · Контекст · Задача · Формат · Ограничения')));
  const tip = railTip(c);
  if (tip) kids.push(h('div', { class: 'rail-sec tip' }, h('h4', { text: 'Коуч' }), h('p', { text: tip.b }), tip.q ? h('p', { class: 'q', text: tip.q }) : null));
  if (state.attempts.length) kids.push(h('div', { class: 'rail-sec' }, h('h4', { text: 'Попытки' }),
    h('div', { class: 'attempts' }, state.attempts.slice(-6).map((t) => h('div', { class: 'attempt' }, h('span', { text: `#${t.n} · ${t.source}` }), h('span', { class: 'mono', text: `запрос ${t.score}% · ошибок ${t.errors}` })))),
    h('p', { class: 'legend', text: 'Сравните: чем точнее правила расчёта в запросе, тем меньше ошибок в ответе.' })));
  $('#rail').replaceChildren(...kids);
}
function railTip(c) {
  const m = calcStatus();
  if (state.step === 0) return { b: 'Прочитайте данные доски и примечание к Приложению 4. Затем запишите прогноз: потом будет с чем сравнить.', q: 'Какой столбец таблицы вы бы посмотрели первым?' };
  if (state.step === 1) {
    if (!state.checks2) return { b: 'Решите сами, затем нажмите «Проверить». ИИ подключится на шаге 4.' };
    if (m.offByOne) return { b: `В ${m.offByOne} строках ответ меньше на 1. Это самая частая ошибка и у людей, и у ИИ.`, q: 'Сколько дней длится задача, начатая и законченная в один день?' };
    if (m.ok < m.total) return { b: 'Проверка показала, где ошибка. Откройте подсказку по нужному блоку.' };
    return { b: 'Расчёт верен. Посмотрите на столбец ожидания ещё раз, прежде чем идти дальше.', q: 'Что общего у запросов продавцов, которые не уложились в срок?' };
  }
  if (state.step === 2) return state.checks3 ? { b: 'Штриховка на диаграмме задач — это и есть затор. Обратите внимание, где проходят четверги.', q: 'Что изменится, если комитет будет собираться чаще?' } : { b: 'Диаграмма показывает, сколько задач в системе, но не показывает, почему. Причину ищите в столбце ожидания.' };
  if (state.step === 3) {
    if (c.holes) return { b: 'В запросе остались поля шаблона в квадратных скобках. ИИ заполнит их сам, и обычно неудачно.' };
    if (c.ctx.st !== 'ok') return { b: 'Контекст неполный. Формулу, длину недели и текущий день ИИ иначе додумает сам.', q: 'Какое правило расчёта ИИ пока не видит?' };
    if (c.task.st !== 'ok') return { b: 'В задаче не все пункты задания. ИИ отвечает только на то, что спросили.' };
    if (c.lim.st !== 'ok') return { b: 'Попросите ИИ показать вычисления и проверить себя: так ошибку видно сразу.' };
    return { b: 'Запрос собран. Отправьте его и сравните ответ ИИ со своим расчётом.' };
  }
  if (state.step === 4) return state.markRevealed ? { b: 'Каждую найденную ошибку превратите в уточнение: это и есть работа с ИИ в несколько шагов.' } : { b: 'Держите рядом свой расчёт. Каждое число ИИ сверяйте с ним.', q: 'Какой вывод ИИ звучит уверенно, но не следует из данных?' };
  return { b: 'ИИ даёт черновик, выводы делает человек. Проверьте каждое изменение в песочнице, прежде чем писать эффект.' };
}

/* ================= Boot ================= */
function buildRuler() {
  const r = $('#ruler'); if (!r) return;
  for (let d = 1; d <= TODAY; d++) {
    const wk = (d - 1) % 5 === 0 ? 6 + (d - 1) / 5 : null;
    r.append(h('span', { class: [THURSDAYS.includes(d) ? 'thu' : '', wk ? 'wk' : '', d === TODAY ? 'now' : ''].join(' ').trim(), 'data-wk': wk ? `неделя ${wk}` : null, 'data-short': wk ? `н.${wk}` : null, title: `День ${d}${THURSDAYS.includes(d) ? ', четверг: комитет по изменениям' : ''}${d === TODAY ? ', текущий день' : ''}` }));
  }
}
function boot() {
  if (!unlocked(state.step)) state.step = 0;
  buildRuler(); render();
  const get = async (name) => { try { return window.claude && window.claude.use ? await window.claude.use(name) : null; } catch (e) { return null; } };
  Promise.all([get('sample'), get('downloads')]).then(([smp, dl]) => { state.sample = typeof smp === 'function' ? smp : null; state.downloads = dl || null; render(); });
}
boot();

</script>
