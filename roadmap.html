<title>Дорожная карта — Корзина</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
/* Layout: a programme control desk. A dark band on top carries the 35-week ruler with the fixed launch flag
   and the route of five stations; below, a white working sheet beside a narrow logbook rail.
   Signal orange is reserved for what holds the date: the critical path and the launch. */
:root {
  --paper: #E6E8E3;      /* concrete */
  --sheet: #FBFBF9;
  --sheet-2: #F0F1ED;
  --ink: #1D2026;
  --ink-2: #5A6068;
  --rule: #D3D6CF;
  --rule-2: #B4B9B0;
  --band: #20242B;       /* graphite control band, same in both themes */
  --band-ink: #E9EBE6;
  --band-ink-2: #9AA1AB;
  --signal: #F2551D;     /* critical path, launch */
  --signal-tint: #FDE3D8;
  --cobalt: #2D4FE3;     /* teams, adaptive work */
  --cobalt-tint: #E2E7FC;
  --amber: #D9960B;      /* payout release windows */
  --violet: #7650C4;
  --green: #2D8A57;
  --cal: #3A414C;        /* calendar works */
  --ok: #23804A; --ok-tint: #DDF0E3;
  --warn: #9A6400; --warn-tint: #F8ECCB;
  --bad: #C42B2B; --bad-tint: #F8DEDC;
  --on-fill: #FFFFFF;
  --font-display: "Dela Gothic One", "Golos Text", system-ui, sans-serif;
  --font-body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #14161A; --sheet: #1D2026; --sheet-2: #252930; --ink: #ECEDE9; --ink-2: #A2A8B0; --rule: #333840; --rule-2: #4A5059;
    --band: #0C0E11; --band-ink: #ECEDE9; --band-ink-2: #8E959F;
    --signal: #FF7341; --signal-tint: #44231A; --cobalt: #8EA4FF; --cobalt-tint: #232C52; --amber: #F2B84B; --violet: #B79BF0; --green: #6CCB93; --cal: #B9C0CA;
    --ok: #6CCB93; --ok-tint: #173323; --warn: #F2C14E; --warn-tint: #3A2D0E; --bad: #FF8A80; --bad-tint: #401A18;
    --on-fill: #14161A; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #14161A; --sheet: #1D2026; --sheet-2: #252930; --ink: #ECEDE9; --ink-2: #A2A8B0; --rule: #333840; --rule-2: #4A5059;
  --band: #0C0E11; --band-ink: #ECEDE9; --band-ink-2: #8E959F;
  --signal: #FF7341; --signal-tint: #44231A; --cobalt: #8EA4FF; --cobalt-tint: #232C52; --amber: #F2B84B; --violet: #B79BF0; --green: #6CCB93; --cal: #B9C0CA;
  --ok: #6CCB93; --ok-tint: #173323; --warn: #F2C14E; --warn-tint: #3A2D0E; --bad: #FF8A80; --bad-tint: #401A18;
  --on-fill: #14161A; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; padding-inline: 16px; padding-block: 0 56px; font-variant-numeric: tabular-nums; }
.wrap { max-width: 1320px; margin-inline: auto; }
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2.5px solid var(--cobalt); outline-offset: 2px; }
.mono { font-variant-numeric: tabular-nums; }

/* ---------- Control band ---------- */
.band { background: var(--band); color: var(--band-ink); margin-inline: -16px; padding-inline: 16px; padding-block: 26px 0; }
.band-top { display: flex; flex-wrap: wrap; gap: 14px 40px; align-items: end; justify-content: space-between; }
.brand { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.brand h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(26px, 4vw, 40px); line-height: 1; letter-spacing: -0.01em; }
.brand p { color: var(--band-ink-2); max-width: 62ch; font-size: 14.5px; }
.casetag { font-size: 13px; color: var(--band-ink-2); border: 1px solid #454b55; border-radius: 999px; padding: 4px 12px; white-space: nowrap; }

.ruler { margin-top: 26px; display: grid; grid-template-columns: repeat(35, minmax(0, 1fr)); align-items: end; height: 46px; position: relative; }
.ruler span { height: 8px; border-left: 1px solid #4a515c; position: relative; }
.ruler span.five { height: 16px; border-left-color: #7c8490; }
.ruler span.five::after { content: attr(data-w); position: absolute; bottom: 19px; left: -4px; font-size: 11px; color: var(--band-ink-2); }
.ruler span.flag { height: 40px; border-left: 2px solid var(--signal); }
.ruler span.flag::after { content: "1 июня · запуск"; position: absolute; top: 0; right: 4px; white-space: nowrap; font-size: 12px; font-weight: 600; color: var(--band); background: var(--signal); padding: 1px 8px; border-radius: 3px 0 0 3px; }
.ruler span.bill { border-left: 1px dashed var(--amber); height: 22px; }
@media (max-width: 600px) { .ruler span.flag::after { content: "1 июня"; } .ruler span.five[data-w="25"]::after, .ruler span.five[data-w="30"]::after { content: none; } }

/* Route of five stations */
.steps { position: relative; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding-block: 22px 24px; border-top: 1px solid #3a4049; }
.steps::before { content: ""; position: absolute; left: 14px; right: 14px; top: 36px; height: 3px; background: #3e444e; border-radius: 3px; }
.step { appearance: none; position: relative; text-align: left; cursor: pointer; border: 0; background: transparent; color: var(--band-ink); padding: 0 10px 0 0; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.step .dot { width: 31px; height: 31px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; background: var(--band); border: 3px solid #5b626d; color: var(--band-ink-2); position: relative; z-index: 1; }
.step .t { font-weight: 600; font-size: 14.5px; line-height: 1.25; }
.step .s { font-size: 12.5px; color: var(--band-ink-2); line-height: 1.3; }
.step:hover .dot { border-color: var(--band-ink); }
.step.done .dot { background: var(--green); border-color: var(--green); color: var(--band); }
.step[aria-current="step"] .dot { background: var(--signal); border-color: var(--signal); color: var(--band); box-shadow: 0 0 0 5px rgba(242, 85, 29, .25); }
.step.locked { cursor: not-allowed; }
.step.locked .dot { border-style: dashed; }
.step.locked .t, .step.locked .s { color: #6d7480; }
@media (max-width: 760px) { .step .s { display: none; } .step .t { font-size: 12.5px; } .steps::before { top: 36px; } }

/* ---------- Working area ---------- */
.workspace { display: grid; gap: 22px; grid-template-columns: minmax(0, 1fr); align-items: start; padding-top: 24px; }
@media (min-width: 1100px) { .workspace { grid-template-columns: minmax(0, 1fr) 320px; } }
.panel { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.card { background: var(--sheet); border-radius: 16px; padding: 22px 24px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card > h3, .sec-h { font-family: var(--font-display); font-weight: 400; font-size: 19px; line-height: 1.2; letter-spacing: -0.005em; }
.lead { color: var(--ink-2); max-width: 72ch; }
.lbl { font-size: 13px; color: var(--ink-2); font-weight: 600; }
.grid2 { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 820px) { .grid2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
@media (max-width: 600px) { .card { padding: 18px 16px; border-radius: 12px; } }

.btn { appearance: none; cursor: pointer; border: 1.5px solid var(--ink); background: transparent; border-radius: 999px; padding: 8px 18px; font-weight: 600; line-height: 1.2; }
.btn:hover { background: var(--sheet-2); }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.btn-primary { background: var(--ink); color: var(--sheet); }
.btn-primary:hover { background: var(--ink); filter: brightness(1.25); }
.btn-small { padding: 5px 13px; font-size: 13px; border-width: 1px; border-color: var(--rule-2); font-weight: 500; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.status { min-height: 20px; font-size: 13.5px; color: var(--ink-2); }
.status.err { color: var(--bad); }

textarea, input[type="text"], input[type="number"], select { width: 100%; border: 1.5px solid var(--rule); background: var(--sheet); border-radius: 10px; padding: 9px 12px; }
textarea:hover, input:hover, select:hover { border-color: var(--rule-2); }
textarea { resize: vertical; line-height: 1.55; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field-top { display: flex; justify-content: space-between; gap: 8px 14px; align-items: baseline; flex-wrap: wrap; }
.field .help, .help { font-size: 13px; color: var(--ink-2); }

/* Tables */
table.data { width: 100%; border-collapse: collapse; font-size: 14px; }
table.data th, table.data td { text-align: left; padding: 10px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
table.data th { font-size: 12.5px; color: var(--ink-2); font-weight: 600; border-bottom: 2px solid var(--ink); }
table.data tbody tr:last-child td { border-bottom: 0; }
.tscroll { overflow-x: auto; }
table.mine td { vertical-align: middle; }
table.mine input { width: 4.2em; padding: 6px 4px; text-align: center; border-radius: 8px; font-weight: 600; font-size: 15px; }
table.mine select { width: auto; }
table.mine tr.given td { color: var(--ink-2); }
.rowhint { font-size: 12.5px; color: var(--ink-2); margin-top: 4px; max-width: 34ch; }

/* Case */
.news { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 820px) { .news { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.newsitem { position: relative; padding: 16px 16px 14px; background: var(--signal-tint); border-radius: 4px 14px 14px 14px; display: flex; flex-direction: column; gap: 6px; }
.newsitem b { font-family: var(--font-display); font-weight: 400; font-size: 16px; color: var(--signal); }
.task-list { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; }
.task-list li::marker { font-weight: 700; color: var(--ink-2); }

/* Prompt builder: one form, five rows */
.rctfo { display: flex; flex-direction: column; background: var(--sheet); border-radius: 16px; overflow: hidden; }
.part { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 6px 22px; padding: 18px 24px 18px 20px; border-bottom: 1px solid var(--rule); border-left: 5px solid var(--rule); }
.part:last-child { border-bottom: 0; }
.part > .field-top { grid-column: 1; grid-row: 1 / span 3; flex-direction: column; align-items: start; justify-content: start; gap: 4px; }
.part > textarea, .part > .actions, .part > .checks { grid-column: 2; }
.part.ok { border-left-color: var(--ok); }
.part.warn { border-left-color: var(--amber); }
.part.bad { border-left-color: var(--bad); }
.part-name { font-family: var(--font-display); font-weight: 400; font-size: 17px; }
@media (max-width: 700px) { .part { grid-template-columns: minmax(0, 1fr); padding: 16px; } .part > .field-top, .part > textarea, .part > .actions, .part > .checks { grid-column: 1; grid-row: auto; } }
.checks { display: flex; flex-wrap: wrap; gap: 6px; }
.chk { font-size: 12.5px; padding: 2px 10px 2px 8px; border-radius: 999px; color: var(--ink-2); background: var(--sheet-2); display: inline-flex; align-items: center; gap: 6px; }
.chk::before { content: ""; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid currentColor; flex: none; }
.chk.on { color: var(--ok); background: var(--ok-tint); }
.chk.on::before { background: currentColor; }
.chk.alert { color: var(--bad); background: var(--bad-tint); }
.chk.alert::before { border-radius: 1px; background: currentColor; transform: rotate(45deg); }
.preview { margin: 0; padding: 14px; background: var(--sheet-2); border-radius: 10px; max-height: 340px; overflow: auto; font-family: ui-monospace, Menlo, monospace; font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.svc { color: var(--ink-2); }
details > summary { cursor: pointer; color: var(--ink-2); font-size: 13.5px; }

/* ---------- Roadmap board ---------- */
.gantt-wrap { overflow-x: auto; border-radius: 12px; background: var(--sheet-2); }
.gantt { min-width: 820px; display: grid; grid-template-columns: 200px minmax(0, 1fr); font-size: 13px; }
.g-lab { padding: 6px 12px; border-bottom: 1px solid var(--rule); display: flex; flex-direction: column; justify-content: center; min-width: 0; background: var(--sheet); }
.g-lab .ln { font-size: 11.5px; color: var(--ink-2); }
.g-lab .nm { overflow-wrap: anywhere; line-height: 1.3; font-weight: 500; }
.g-track { position: relative; border-bottom: 1px solid var(--rule); min-height: 44px; display: grid; grid-template-columns: repeat(35, minmax(0, 1fr)); align-items: center;
  background-image: repeating-linear-gradient(90deg, transparent 0, transparent calc(100% / 7 - 1px), var(--rule) calc(100% / 7 - 1px), var(--rule) calc(100% / 7)),
    repeating-linear-gradient(90deg, transparent 0, transparent calc(100% / 35 - 1px), color-mix(in srgb, var(--rule) 45%, transparent) calc(100% / 35 - 1px), color-mix(in srgb, var(--rule) 45%, transparent) calc(100% / 35)); }
.g-head { font-size: 11.5px; color: var(--ink-2); min-height: 30px; background: var(--sheet); border-bottom: 2px solid var(--ink); }
.g-lab.g-head { font-weight: 600; justify-content: end; }
.g-head span { text-align: left; padding-left: 3px; font-weight: 600; }
.bar { grid-row: 1; height: 22px; border-radius: 999px; position: relative; z-index: 2; display: flex; align-items: center; padding: 0 9px; color: var(--on-fill); font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; }
.bar.ms { height: 15px; width: 15px; justify-self: center; transform: rotate(45deg); border-radius: 3px; padding: 0; }
.bar.crit { background: var(--signal) !important; box-shadow: 0 0 0 3px var(--signal-tint); }
.ghost { grid-row: 1; height: 32px; border: 2px dashed var(--ink-2); border-radius: 999px; z-index: 1; }
.ghost.ms { width: 24px; justify-self: center; border-radius: 4px; }
.mark { grid-row: 1; justify-self: end; width: 0; height: 100%; z-index: 0; border-left: 1.5px dashed var(--amber); }
.mark.lane-gate { border-left: 2px solid var(--signal); }
.mark.lane-win, .mark.lane-gate { background: none !important; }
.lane-cal { background: var(--cal); } .lane-agile { background: var(--cobalt); } .lane-gate { background: var(--signal); }
.lane-win { background: var(--amber); } .lane-legal { background: var(--violet); } .lane-mkt { background: var(--green); } .lane-teal { background: var(--ink-2); }
.g-row { display: contents; }
.g-row.bad .g-lab { box-shadow: inset 5px 0 0 var(--bad); }
.g-row.warn .g-lab { box-shadow: inset 5px 0 0 var(--amber); }
.g-row.ok .g-lab { box-shadow: inset 5px 0 0 var(--ok); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--ink-2); align-items: center; }
.legend i { display: inline-block; width: 18px; height: 9px; border-radius: 999px; margin-right: 6px; vertical-align: 0; }
.legend .gh { border: 1.5px dashed var(--ink-2); background: transparent; }

/* Verification */
.claims { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 820px) { .claims { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.claim { padding: 12px 14px; background: var(--sheet-2); border-radius: 10px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.claim p { overflow-wrap: anywhere; }
.vtable td:first-child { font-weight: 600; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; padding: 2px 10px 2px 8px; border-radius: 999px; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.ok { color: var(--ok); background: var(--ok-tint); }
.pill.warn { color: var(--warn); background: var(--warn-tint); }
.pill.bad { color: var(--bad); background: var(--bad-tint); }
.pill.bad::before { border-radius: 1px; transform: rotate(45deg); }
.pill.info { color: var(--ink-2); background: var(--sheet-2); }
.pick { display: flex; flex-wrap: wrap; gap: 8px; }
.pick label { display: inline-flex; gap: 7px; align-items: center; border: 1.5px solid var(--rule); border-radius: 999px; padding: 5px 13px 5px 10px; font-size: 13.5px; cursor: pointer; background: var(--sheet); }
.pick label:has(input:checked) { border-color: var(--ink); background: var(--ink); color: var(--sheet); }
.pick input { margin: 0; accent-color: var(--signal); }
.selfrow { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); align-items: end; }
@media (min-width: 820px) { .selfrow { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.scn { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; }
.scn label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.scn input { accent-color: var(--signal); }
.scn select { width: auto; }
.bigline { display: flex; flex-wrap: wrap; gap: 6px 22px; align-items: baseline; }
.bignum { font-family: var(--font-display); font-size: 30px; line-height: 1.1; }
.bignum.bad { color: var(--signal); } .bignum.ok { color: var(--ok); }

/* Decision */
.opts { display: flex; flex-direction: column; gap: 10px; }
.optrow { display: grid; gap: 10px; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); }
@media (max-width: 600px) { .optrow { grid-template-columns: minmax(0, 1fr); } }
.reflect { white-space: pre-wrap; overflow-wrap: anywhere; padding: 14px 16px; background: var(--cobalt-tint); border-radius: 4px 14px 14px 14px; min-height: 40px; }
.hintrow { display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 1px solid var(--rule); }
.hintrow b { font-weight: 600; }

/* ---------- Logbook rail ---------- */
.rail { background: var(--sheet); border-radius: 16px; display: flex; flex-direction: column; min-width: 0; border-top: 6px solid var(--band); }
@media (min-width: 1100px) { .rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 14px); max-height: calc(100vh - 28px); overflow: auto; } }
.rail-sec { padding: 16px 18px; border-bottom: 1px solid var(--rule); display: flex; flex-direction: column; gap: 10px; }
.rail-sec:last-child { border-bottom: 0; }
.rail h3 { font-family: var(--font-display); font-weight: 400; font-size: 16px; }
.rail h4 { font-size: 13px; color: var(--ink-2); font-weight: 600; }
.goal { display: flex; gap: 10px; align-items: baseline; font-size: 14px; }
.goal .dot { flex: none; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--rule-2); transform: translateY(1px); }
.goal.on .dot { background: var(--green); border-color: var(--green); }
.meter { display: flex; gap: 4px; }
.meter i { flex: 1; height: 10px; border-radius: 999px; background: var(--rule); }
.meter i.ok { background: var(--ok); } .meter i.warn { background: var(--amber); } .meter i.bad { background: var(--bad); }
.attempts { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.attempt { display: flex; gap: 8px; justify-content: space-between; padding: 6px 10px; background: var(--sheet-2); border-radius: 8px; }
.tip { font-size: 14px; background: var(--cobalt-tint); }
.tip .q { color: var(--ink-2); font-style: italic; }
.empty { padding: 26px 18px; text-align: center; color: var(--ink-2); border: 2px dashed var(--rule-2); border-radius: 14px; }
@media (prefers-reduced-motion: no-preference) { .btn, .step .dot, .pick label { transition: background-color .15s ease, border-color .15s ease, box-shadow .15s ease; } }
</style>

<header class="band">
  <div class="wrap">
    <div class="band-top">
      <div class="brand">
        <h1>Дорожная карта</h1>
        <p>Практикум 3: гибридная дорожная карта. Сначала вы строите карту сами, затем проверяете, как с той же задачей справится ИИ, и сами принимаете решение для правления.</p>
      </div>
      <span class="casetag">Кейс «Витрина», вымышленные данные</span>
    </div>
    <div class="ruler" id="ruler" aria-hidden="true"></div>
    <nav class="steps" aria-label="Шаги практикума" id="steps"></nav>
  </div>
</header>

<div class="wrap">
  <div class="workspace">
    <main class="panel" id="main"></main>

    h('div', { style: 'display:flex;gap:8px;align-items:baseline' }, h('span', { class: 'pill ' + o.st, text: { ok: 'готово', warn: 'проверить', bad: 'важно', info: 'совет' }[o.st] }), h('b', { text: o.t })),
    h('p', { text: o.b }), o.q ? h('p', { class: 'q', text: o.q }) : null)));
  renderRail(); renderSteps();
}
async function reflect() {
  if (!state.sample || state.reflecting) return;
  const d = state.dec;
  const rows = verify(state.answer).filter((r) => r.st === 'bad').map((r) => `- ${r.area}: ИИ «${r.ai}», по данным ${r.fact}`).join('\n') || 'нет данных';
  const prompt = `Ты — Agile-коуч и наставник руководителей проектов. Ты работаешь вопросами и не даёшь готовых решений.
Кейс (вымышленный): маркетплейс «Корзина» запускает направление «Доставка еды», запуск 35-я неделя (1 июня), бюджет фиксирован. Критическая цепочка: решение о бюджете 3 → оплата 2 → поставка термоконтейнеров и самокатов 16 → монтаж и запуск курьерской сети 4 → санитарные разрешения 6 → пилот в одном городе 4 = 35 недель, запас 0. Помещения дарк-кухонь и складов готовы к 20-й неделе (запас 1 неделя); новость: перенос на 23-ю, сдвиг запуска +2 недели; ремонтная компания может сдать одну дарк-кухню из четырёх к 20-й. Ресторанная «Сеть А» хочет принимать заказы с 28-й недели, до получения санитарных разрешений (31-я). Председатель хочет каталог готовых рационов в первой версии без изменения даты и бюджета.
Ошибки, которые участник нашёл в ответе ИИ:
${rows}
Ответ участника правлению:
1) ${d.p1 || '—'}
2) ${d.p2 || '—'}
3) ${d.p3 || '—'}
Варианты: ${d.opts.filter((o) => o.name).map((o) => `${o.name} (цена: ${o.cost || 'не названа'})`).join('; ') || '—'}
«Сеть А»: ${d.bank || '—'}
Каталог: ${d.catalog || '—'}

Задача: до 150 слов, связным текстом без таблиц и списков: 1) чем ответ силён; 2) главный риск ответа; 3) два вопроса, которые зададут на правлении; 4) один шаг, чтобы усилить ответ за 5 минут. Критерии сильного ответа: опора на расчёт, у каждого варианта названа цена, явный запрос решения к правлению, еда не доставляется реальным покупателям до санитарных разрешений, объём меняется только с явной жертвой. Не пиши готовый ответ за участника. Пиши на русском.`;
  state.reflecting = true; state.reflect = ''; const btn = $('#reflect-btn'); if (btn) { btn.disabled = true; btn.textContent = 'Коуч думает…'; }
  const out = $('#reflect-out'); if (out) { out.hidden = false; out.textContent = 'Коуч думает…'; }
  let err = '';
  try {
    await state.sample(prompt, { cache: false, onText: ({ text }) => { state.reflect = text; const o = $('#reflect-out'); if (o) o.textContent = text; } });
  } catch (e) { if (e && e.text) state.reflect = e.text; err = errorCopy(e); }
  finally { state.reflecting = false; render(); if (err) setStatus(err, 'err'); }
}
function report() {
  const d = state.dec, a = state.answer;
  const rows = verify(a);
  const L = [];
  L.push('# Практикум 3: гибридная дорожная карта (кейс «Витрина», маркетплейс «Корзина»)', '');
  L.push('## Запрос к ИИ', '', '```', state.lastPrompt || compiled(), '```', '');
  L.push(`Полнота запроса по структуре: ${promptChecks().score}%. Попыток: ${state.attempts.length}.`, '');
  if (a) {
    L.push('## Сверка ответа ИИ с данными', '', '| Что | ИИ | Расчёт | Итог |', '|---|---|---|---|');
    rows.forEach((r) => L.push(`| ${r.area} | ${r.ai.replace(/\|/g, '/')} | ${r.fact.replace(/\|/g, '/')} | ${{ ok: 'верно', warn: 'проверить', bad: 'ошибка', info: 'совет' }[r.st]} |`));
    L.push('');
  }
  L.push('## Собственный расчёт', '', `Цепочка: ${state.self.crit.map((id) => NAMES[id]).join(' → ') || '—'}`, `Запас: ${state.self.slack || '—'} нед.; сдвиг из-за помещений: ${state.self.impact || '—'} нед.`, '');
  L.push('## Ответ правлению', '', `1. ${d.p1 || '—'}`, `2. ${d.p2 || '—'}`, `3. ${d.p3 || '—'}`, '');
  L.push('Варианты сохранить дату:', ...d.opts.filter((o) => o.name).map((o) => `- ${o.name}. Цена: ${o.cost || 'не названа'}`), '');
  L.push(`«Сеть А»: ${d.bank || '—'}`, '', `Каталог рационов: ${d.catalog || '—'}`, '');
  if (state.reflect) L.push('## Разбор коуча', '', state.reflect, '');
  return L.join('\n');
}
async function saveReport() {
  try { await state.downloads.save({ filename: 'praktikum-3-dorozhnaya-karta.md', data: report() }); }
  catch (e) { if (e && e.code !== 'declined') setStatus('Файл не сохранён. Скопируйте отчёт кнопкой рядом.', 'err'); }
}

/* ---- Rail ---- */
function renderRail() {
  const c = promptChecks();
  const g = goals();
  const kids = [];
  kids.push(h('div', { class: 'rail-sec' }, h('h3', { text: 'Чему учит практикум' }),
    ...g.map((x) => h('div', { class: 'goal' + (x.on ? ' on' : '') }, h('span', { class: 'dot' }), h('span', { text: x.k })))));
  kids.push(h('div', { class: 'rail-sec' }, h('h4', { text: `Запрос по структуре · ${c.score}%` }),
    h('div', { class: 'meter' }, ['role', 'ctx', 'task', 'fmt', 'lim'].map((k) => h('i', { class: c[k].st, title: PARTS.find((p) => p.k === k).n }))),
    h('div', { class: 'legend' }, 'Роль · Контекст · Задача · Формат · Ограничения')));
  const tip = railTip(c);
  if (tip) kids.push(h('div', { class: 'rail-sec tip' }, h('h4', { text: 'Коуч' }), h('p', { text: tip.b }), tip.q ? h('p', { class: 'q', text: tip.q }) : null));
  if (state.attempts.length) kids.push(h('div', { class: 'rail-sec' }, h('h4', { text: 'Попытки' }),
    h('div', { class: 'attempts' }, state.attempts.slice(-6).map((t) => h('div', { class: 'attempt' }, h('span', { text: `#${t.n} · ${t.source}` }), h('span', { class: 'mono', text: `запрос ${t.score}% · ошибок ${t.errors}` })))),
    h('p', { class: 'legend', text: 'Сравните: чем полнее контекст и ограничения, тем меньше ошибок в ответе.' })));
  $('#rail').replaceChildren(...kids);
}
function railTip(c) {
  const m = mineStatus();
  if (state.step === 0) return { b: 'Прочитайте Приложение 2 и новости. Запомните, что фиксировано: дата и бюджет.', q: 'Чем в этой ситуации может управлять руководитель программы?' };
  if (state.step === 1) {
    if (!m.filled) return { b: 'Начните с работ, у которых срок дан прямо: бюджет, помещения, реклама.' };
    if (m.checked && m.ok < m.total) return { b: 'Проверка показала, где ошибка. Пройдите зависимости ещё раз или откройте подсказку.', q: 'После чего начинается работа, отмеченная красным?' };
    return { b: 'Решите сами, затем нажмите «Проверить». ИИ подключится на следующем шаге.' };
  }
  if (state.step === 2) {
    if (c.holes) return { b: 'В запросе остались поля шаблона в квадратных скобках. ИИ заполнит их сам, и обычно неудачно.' };
    if (c.ctx.st !== 'ok') return { b: 'Контекст неполный. Чего ИИ не знает, то он додумает: длительности, зависимости, окна выпусков системы выплат.', q: 'Какие данные кейса ИИ пока не видит?' };
    if (c.task.st !== 'ok') return { b: 'В задаче не все пункты задания. ИИ отвечает на то, что спросили.', q: 'Вы попросили назвать цену каждого варианта?' };
    if (c.lim.st !== 'ok') return { b: 'Ограничения защищают от выдумки. Попросите отделить допущения от данных и показать расчёт.' };
    return { b: 'Запрос собран. Отправьте его и сравните ответ ИИ со своей картой.' };
  }
  if (state.step === 3) {
    if (!state.markRevealed) return { b: 'Держите рядом свою карту с шага 2. Каждое число ИИ сверяйте с ней.', q: 'Какое утверждение ИИ звучит уверенно, но не следует из данных?' };
    return { b: 'Каждую найденную ошибку превратите в уточнение: это и есть работа с ИИ в несколько шагов.' };
  }
  return { b: 'ИИ даёт черновик, решение принимает человек. Сначала напишите своё, потом сравните с черновиком ИИ.' };
}

/* ================= Boot ================= */
function buildRuler() {
  const r = $('#ruler'); if (!r) return;
  for (let w = 1; w <= 35; w++) r.append(h('span', { class: w === 35 ? 'flag' : [8, 16, 24, 32].includes(w) ? 'bill' : (w === 1 || w % 5 === 0) ? 'five' : '', 'data-w': String(w) }));
}
function boot() {
  buildRuler();
  render();
  const get = async (name) => { try { return window.claude && window.claude.use ? await window.claude.use(name) : null; } catch (e) { return null; } };
  Promise.all([get('sample'), get('downloads')]).then(([smp, dl]) => {
    state.sample = typeof smp === 'function' ? smp : null; state.downloads = dl || null;
    render();
    if (state.step === 4) refreshDecide();
  });
}
const _renderMain = renderMain;
renderMain = function () { _renderMain(); if (state.step === 2 && unlocked(2)) renderSafety(promptChecks()); if (state.step === 4 && unlocked(4)) refreshDecide(); };
boot();
</script>
